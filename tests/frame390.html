<!DOCTYPE html>
<html lang="ko">
<head>

<title>ProPlan · 390px 확인용 틀</title>

<style>
  html, body { margin: 0; padding: 0; background: #23272C; }

  iframe { width: 390px; height: 844px; border: 0; display: block; background: #fff; }
  .label { color: #9AA3AE; font: 700 12px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    text-align: center; margin: 6px 0 0; }
</style>
</head>
<body>
<div class="row">
  <div>
    <iframe id="phone" src="../index.html" title="ProPlan 390px"></iframe>
    <div class="label">390 × 844 (아이폰 12·13·14)</div>
  </div>
</div>
</body>
</html>
