    else if (p.matched) hint.innerHTML = '“' + esc(p.matched) + '”에서 <b>' + fmtShort(p.date) + '</b>을(를) 인식했어요.';
    else hint.innerHTML = '날짜가 없어 <b>' + fmtShort(eff) + '</b> 기록으로 저장됩니다. 옆 날짜 칸에서 바꿀 수 있어요.';
  }
}

/* =========================================================
   음성 입력 엔진 (레슨 차트 · 캘린더 빠른 추가 공용)
   iOS 사파리는 stop()만 하면 마이크 세션이 남아 다음 start()가
   조용히 먹통이 됩니다. 그래서
     · 멈출 때는 abort()로 확실히 놓아 주고
     · 시작할 때마다 완전히 새 SpeechRecognition 객체를 만들고
     · 늦게 도착한 이전 객체의 콜백은 세대(gen) 번호로 무시하며
     · start()가 실패하거나 조용히 안 되면 새 객체로 몇 번 다시 시도합니다.
   ========================================================= */
var voice = {
  want: false,        /* 사용자가 듣기를 켜 둔 상태 */
  kind: null,         /* 'note' | 'qa' */
  inst: null,         /* 현재 SpeechRecognition 객체 */
  gen: 0,             /* 세대 번호(이전 콜백 무시용) */
  started: false,
  base: '',           /* 듣기 시작할 때 이미 있던 글 */
  committed: '',      /* 확정된 음성 문장 */
  lastWritten: '',    /* 앱이 마지막으로 넣은 값(사용자가 고쳤는지 판별) */
  fails: 0,           /* 연속으로 켜지지 못한 횟수 */
  pauses: 0,
  retryTimer: null,
  watchTimer: null,
  quietUntil: 0
};

function vrSR(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }

function vrEls(kind){
  if (kind === 'qa') return { ta: document.getElementById('qaLine'), btn: document.getElementById('qaVoiceBtn'), hint: document.getElementById('qaBar') };
  return { ta: document.getElementById('noteText'), btn: document.getElementById('voiceBtn'), hint: document.getElementById('noteHint') };
}

function vrPaint(){
  var on = !!voice.want, kind = voice.kind;
  var nb = document.getElementById('voiceBtn');
  if (nb) {
    if (on && kind === 'note') nb.classList.add('rec'); else nb.classList.remove('rec');
    nb.textContent = (on && kind === 'note') ? '듣는 중…' : '🎤 음성 입력';
  }
  var qb = document.getElementById('qaVoiceBtn');
  if (qb) {
    if (on && kind === 'qa') qb.classList.add('rec'); else qb.classList.remove('rec');
    qb.textContent = (on && kind === 'qa') ? '듣는 중…' : '🎤 음성 입력';
  }
  /* 멈춘 뒤에도 입력칸은 항상 열려 있어야 합니다 */
  var nt = document.getElementById('noteText'), qt = document.getElementById('qaLine');
  if (nt) { nt.disabled = false; nt.readOnly = false; }
  if (qt) { qt.disabled = false; qt.readOnly = false; }
}

/* 인식기에서 손을 떼고 마이크 세션을 반납합니다 */
function vrDetach(r){
  if (!r) return;
  try { r.onstart = null; r.onresult = null; r.onerror = null; r.onend = null; } catch(e){}
  try { r.abort(); } catch(e){}
  try { r.stop(); } catch(e){}
  voice.quietUntil = Date.now() + 250;   /* iOS가 마이크를 놓을 짧은 틈 */
}

function vrJoin(a, b){
  a = String(a == null ? '' : a);
  b = String(b == null ? '' : b);
  if (!a) return b.replace(/^[ \t]+/, '');
  if (!b) return a;
  var sep = (/\s$/.test(a) || /^\s/.test(b)) ? '' : ' ';
  return (a + sep + b).replace(/[ \t]{2,}/g, ' ');
}

function vrRefresh(kind){
  try {
    if (kind === 'qa') applyQuickParse();
    else { refreshNoteDate(); refreshNoteTags(); }
  } catch(e){}
}

function vrTakeResult(e){
  var kind = voice.kind;
  var els = vrEls(kind);
  if (!els.ta) return;
  var ta = els.ta;
  /* 듣는 동안 사용자가 직접 고쳤다면 그 글을 새 기준으로 삼습니다(덮어쓰지 않음) */
  if (ta.value !== voice.lastWritten) {
    voice.base = ta.value.replace(/\s+$/, '');
    voice.committed = '';
  }
  var finals = '', interim = '';
  var res = (e && e.results) ? e.results : [];
  var from = (e && typeof e.resultIndex === 'number') ? e.resultIndex : 0;
  for (var i = from; i < res.length; i++) {
    var r = res[i];
    if (!r) continue;
    var txt = (r[0] && r[0].transcript) ? r[0].transcript : '';
    if (!txt) continue;
    if (r.isFinal) finals += txt; else interim += txt;
  }
  if (finals) {
    voice.committed = vrJoin(voice.committed, finals);
    if (kind === 'note' && memberCtx) memberCtx.voiceUsed = true;
  }
  var next = vrJoin(vrJoin(voice.base, voice.committed), interim);
  if (ta.value !== next) ta.value = next;
  voice.lastWritten = ta.value;
  vrRefresh(kind);
}

function vrRetry(gen, reason){
  if (!voice.want || gen !== voice.gen) return;
  var delay;
  if (reason === 'end' || reason === 'no-speech') {
    voice.pauses++;
    if (voice.pauses > 400) { vrStop(); return; }
    delay = 200;
  } else {
    voice.fails++;
    if (voice.fails > 3) {
      var els = vrEls(voice.kind);
      if (els.hint) els.hint.innerHTML = '음성 인식을 다시 켜지 못했어요. 타이핑으로 적으신 뒤 잠시 뒤 🎤를 다시 눌러 주세요.';
      vrStop();
      return;
    }
    delay = 300 * voice.fails;
  }
  clearTimeout(voice.retryTimer);
  voice.retryTimer = setTimeout(function(){
    if (voice.want && gen === voice.gen) vrAttempt(gen);
  }, delay);
}

/* 매 시도마다 완전히 새 인식기를 만듭니다 */
function vrAttempt(gen){
  if (!voice.want || gen !== voice.gen) return;
  var SR = vrSR();
  if (!SR) { vrStop(); return; }
  var els = vrEls(voice.kind);
  if (!els.ta) { vrStop(); return; }          /* 창이 닫혔으면 조용히 정리 */
  var wait = voice.quietUntil - Date.now();
  if (wait > 0) {
    clearTimeout(voice.retryTimer);
    voice.retryTimer = setTimeout(function(){ vrAttempt(gen); }, wait + 20);
    return;
  }
  var rec;
  try { rec = new SR(); } catch (err0) { vrRetry(gen, 'new'); return; }
  voice.inst = rec;
  voice.started = false;
  try {
    rec.lang = 'ko-KR';
    rec.interimResults = true;
    rec.continuous = true;
    rec.maxAlternatives = 1;
  } catch(e){}

  rec.onstart = function(){
    if (voice.inst !== rec) return;
    voice.started = true;
    voice.fails = 0;
    clearTimeout(voice.watchTimer); voice.watchTimer = null;
    vrPaint();
  };
  rec.onresult = function(e){
    if (voice.inst !== rec || !voice.want) return;
    vrTakeResult(e);
  };
  rec.onerror = function(e){
    if (voice.inst !== rec) return;
    var err = (e && e.error) ? String(e.error) : 'error';
    if (err === 'aborted') return;            /* 우리가 멈춘 경우: onend가 정리합니다 */
    if (err === 'no-speech') {                /* 잠깐 조용했을 뿐 — 계속 듣습니다 */
      var h1 = vrEls(voice.kind).hint;
      if (h1) h1.innerHTML = '잘 안 들렸어요. 다시 말씀해 주세요. (🎤를 다시 누르면 멈춰요)';
      voice.inst = null;
      vrDetach(rec);
      vrRetry(gen, 'no-speech');
      return;
    }
    if (err === 'not-allowed' || err === 'service-not-allowed') {
      var h2 = vrEls(voice.kind).hint;
      if (h2) h2.innerHTML = '마이크 사용이 허용되지 않았어요. 브라우저 설정에서 마이크를 허용한 뒤 🎤를 다시 눌러 주세요.';
      vrStop();
      return;
    }
    if (err === 'audio-capture') {
      var h3 = vrEls(voice.kind).hint;
      if (h3) h3.innerHTML = '마이크를 찾지 못했어요. 다른 앱이 마이크를 쓰고 있지 않은지 확인한 뒤 🎤를 다시 눌러 주세요.';
      vrStop();
      return;
    }
    var h4 = vrEls(voice.kind).hint;
    if (h4) h4.innerHTML = '음성 인식이 잠시 멈췄어요(' + esc(err) + '). 🎤를 다시 누르거나 타이핑으로 계속 적어 주세요.';
    vrStop();
  };
  rec.onend = function(){
    if (voice.inst !== rec) return;
    voice.inst = null;
    if (!voice.want) { vrPaint(); return; }
    /* 사용자가 멈추지 않았는데 끝난 경우(iOS는 문장마다 스스로 끝냅니다) 이어서 듣기 */
    vrRetry(gen, 'end');
  };

  try {
    rec.start();
  } catch (err1) {
    /* InvalidStateError 등: 이전 세션이 남아 있을 때 */
    voice.inst = null;
    vrDetach(rec);
    vrRetry(gen, 'start');
    return;
  }
  clearTimeout(voice.watchTimer);
  voice.watchTimer = setTimeout(function(){
    if (!voice.want || voice.inst !== rec || voice.started) return;
    /* start()가 조용히 실패한 경우 — 새 객체로 다시 */
    voice.inst = null;
    vrDetach(rec);
    vrRetry(gen, 'silent');
  }, 2500);
}

function vrStart(kind){
  var els = vrEls(kind);
  if (!els.ta) return;
  if (!vrSR()) {
    if (els.hint) els.hint.innerHTML = '이 브라우저는 음성 인식을 지원하지 않아요. 타이핑으로 입력해 주세요. (아이폰 사파리·크롬에서는 동작합니다)';
    toast('음성 인식을 지원하지 않는 브라우저예요');
    return;
  }
  if (voice.want) vrStop();
  var left = voice.inst;
  voice.inst = null;
  if (left) vrDetach(left);
  voice.want = true;
  voice.kind = kind;
  voice.gen++;
  voice.started = false;
  voice.fails = 0;
  voice.pauses = 0;
  voice.base = els.ta.value.replace(/\s+$/, '');
  voice.committed = '';
  voice.lastWritten = els.ta.value;
  if (kind === 'note' && memberCtx) memberCtx.voiceUsed = false;
  vrPaint();
  toast('말씀하세요 · 다시 누르면 멈춰요');
  vrAttempt(voice.gen);
}

function vrStop(){
  var kind = voice.kind;
  var r = voice.inst;
  voice.want = false;
  voice.kind = null;
  voice.gen++;
  voice.inst = null;
  voice.started = false;
  voice.fails = 0;
  voice.pauses = 0;
  clearTimeout(voice.retryTimer); clearTimeout(voice.watchTimer);
  voice.retryTimer = null; voice.watchTimer = null;
  if (r) vrDetach(r);
  voice.base = '';
  voice.committed = '';
  voice.lastWritten = '';
  vrPaint();
  return kind;
}

function toggleVoice(){
  if (!document.getElementById('noteText')) return;
  if (voice.want) {
    var wasNote = (voice.kind === 'note');
    vrStop();
    if (wasNote) {
      var h = document.getElementById('noteHint');
      if (h) h.innerHTML = '음성 입력을 멈췄어요. 🎤를 다시 누르면 이어서 들을 수 있어요.';
    }
    return;
  }
  vrStart('note');
}

function stopVoice(){ vrStop(); }

function saveNote(){
  if (!memberCtx) return;
  var ta = document.getElementById('noteText');
  var dEl = document.getElementById('noteDate');
  var raw = ta ? ta.value.trim() : '';
  if (!raw) { toast('레슨 내용을 먼저 적어주세요'); if (ta) ta.focus(); return; }
  var p = parseDateFromText(raw);
  var date = (dEl && dEl.value) ? dEl.value : (p.date || todayISO());
  var text = p.cleaned || raw;
  var wasVoice = !!(memberCtx.voiceUsed || (voice.want && voice.kind === 'note'));
  /* 손대지 않았으면 본문에서 자동 태그, 칩을 눌렀으면 그 선택을 그대로 */
  var tags = memberCtx.tagTouched ? sortTags(memberCtx.tagSel || []) : detectGolfTags(text);
  state.notes.push({
    id: uid('note'), memberId: memberCtx.memberId, date: date, text: text,
    createdAt: nowLocalISO(), source: wasVoice ? 'voice' : 'text', raw: raw, tags: tags
  });
  save();
  memberCtx.draft = '';
  memberCtx.noteDate = todayISO();
  memberCtx.voiceUsed = false;
  memberCtx.tagSel = [];
  memberCtx.tagTouched = false;
  memberCtx.tagFilter = '전체';
  /* 입력칸을 먼저 비워야 paintMemberSheet의 임시저장(captureNoteDraft)이
     방금 저장한 글을 다시 채우지 않습니다 */
  if (ta) ta.value = '';
  var ndEl = document.getElementById('noteDate');
  if (ndEl) ndEl.value = memberCtx.noteDate;
  stopVoice();
  paintMemberSheet();
  render(true);
  toast(fmtShort(date) + ' 레슨 차트에 저장했어요');
}

/* =========================================================
   재등록 골든타임 · 1탭 수강권 연장
   ========================================================= */
var RENEW_PRESETS = [8, 10, 20];
var renewCtx = null;

/* 가장 최근에 산 수강권 */
function lastPkgOf(mid){
  var list = memberPkgs(mid).slice().sort(function(a, b){
    if (String(a.startDate) !== String(b.startDate)) return String(a.startDate) < String(b.startDate) ? 1 : -1;
    return 0;
  });
  return list.length ? list[0] : null;
}

/* 지난 수강권의 회당 금액 × 추가 횟수 (금액 미입력 수강권만 있으면 빈 값) */
function renewalDefaultAmount(mid, n, dur){
  n = +n || 0;
  if (n <= 0) return '';
  var paid = memberPkgs(mid).filter(function(p){ return +p.price > 0; });
  if (!paid.length) return '';
  var same = paid.filter(function(p){ return p.durationMinutes === dur; });
  var pool = same.length ? same : paid;
  var p = pool.slice().sort(function(a, b){ return String(a.startDate) < String(b.startDate) ? 1 : -1; })[0];
  var unit = perSessionPrice(p);
  return unit > 0 ? Math.round(unit * n) : '';
}

function renewUnitHint(){
  if (!renewCtx) return '';
  var n = +renewCtx.sessions || 0;
  var amount = parseInt(renewCtx.amount, 10) || 0;
  if (amount > 0 && n > 0) return '회당 약 <b>' + money(Math.round(amount / n)) + '</b> · 총 ' + money(amount);
  return '금액을 넣으면 회당 금액을 계산해 드려요.';
}

function renewSummaryHTML(m){
  if (!renewCtx) return '';
  var n = +renewCtx.sessions || 0;
  var before = totalRemaining(m.id);
  var after = before + n;
  var amount = parseInt(renewCtx.amount, 10) || 0;
  var unit = (amount > 0 && n > 0) ? Math.round(amount / n) : 0;
  return '<div class="rline"><span class="k">연장 후 잔여</span><b>' + before + '회</b>' +
      '<span class="arrow">→</span><span class="big">' + after + '회</span>' +
      '<span style="font-size:11px;font-weight:700;color:var(--muted)">(+' + n + ')</span></div>' +
    '<div class="rline"><span class="k">새 수강권</span><b>' + renewCtx.duration + '분 ' + n + '회</b>' +
      '<span>' + (amount ? ' · ' + money(amount) : '') + (unit ? ' · 회당 ' + money(unit) : '') + '</span></div>' +
    '<div class="hint" style="margin-top:7px;padding:0">기존 레슨 차트·지난 수강권 기록은 그대로 남고, 새 수강권은 오늘부터 시작해요.</div>';
}

function renewBodyHTML(m){
  var c = renewCtx, lp = lastPkgOf(m.id);
  return '<div class="formnote"><b>' + esc(m.name) + '</b> · 잔여 <b>' + totalRemaining(m.id) + '회</b>' +
      (lp && lp.price ? ' · 지난 수강권 회당 ' + money(perSessionPrice(lp)) : '') + '</div>' +
    '<div class="field"><label>추가할 횟수</label>' +
      '<div class="rpreset">' + RENEW_PRESETS.map(function(n){
        return '<button class="rpre' + (+c.sessions === n ? ' on' : '') + '" data-act="renew-preset" data-v="' + n + '">+' + n + '회</button>';
      }).join('') +
        '<button class="rpre" data-act="renew-direct" style="font-size:11.5px">직접 입력</button></div>' +
      '<input class="input" id="rqSessions" type="number" inputmode="numeric" min="1" step="1" value="' + c.sessions + '" style="margin-top:8px">' +
    '</div>' +
    '<div class="field"><label>레슨 시간</label><div class="seg" id="rqDur">' +
      '<button class="' + (c.duration === 25 ? 'on' : '') + '" data-act="renew-dur" data-v="25">25분</button>' +
      '<button class="' + (c.duration === 55 ? 'on' : '') + '" data-act="renew-dur" data-v="55">55분</button>' +
    '</div></div>' +
    '<div class="row2">' +
      '<div class="field"><label>금액 (선택)</label><input class="input" id="rqAmount" type="number" inputmode="numeric" value="' +
        (c.amount === '' ? '' : c.amount) + '" placeholder="예) 600000"><div class="hint" id="rqUnit">' + renewUnitHint() + '</div></div>' +
      '<div class="field"><label>유효기간</label>' + pickFieldHTML('rqMonths', monthPickOptions(), c.months) + '</div>' +
    '</div>' +
    '<div class="rsum" id="rqSum">' + renewSummaryHTML(m) + '</div>';
}

function paintRenew(){
  if (!renewCtx) return;

  if (!m) return;

  });

/* 새 수강권 사이클을 만들어 잔여·총 횟수를 늘리고, 이력을 renewalLog·passHistory에 남깁니다 */
function saveRenewal(){
  if (!renewCtx) return;
  var m = memberById(renewCtx.memberId);
  if (!m) return;
  var nEl = document.getElementById('rqSessions');
  var n = parseInt(nEl ? nEl.value : renewCtx.sessions, 10);
  if (!(n > 0)) { toast('추가할 횟수를 1 이상으로 적어주세요'); if (nEl) nEl.focus(); return; }
  var aEl = document.getElementById('rqAmount');
  var amount = parseInt(String(aEl ? aEl.value : renewCtx.amount).replace(/[^0-9]/g, ''), 10);
  if (isNaN(amount)) amount = 0;
  var mEl = document.getElementById('rqMonths');
  var months = parseInt(mEl ? mEl.value : renewCtx.months, 10);
  if (isNaN(months)) months = 6;
  var start = todayISO();
  var dur = renewCtx.duration;
  var pkg = {
    id: uid('pkg'), memberId: m.id, durationMinutes: dur,
    totalSessions: n, remainingSessions: n, startDate: start,
    expiryDate: months > 0 ? addMonths(start, months) : '9999-12-31',
    price: amount, note: '재등록', renewal: true
  };
  state.packages.push(pkg);
  if (!isArr(m.passHistory)) m.passHistory = [];
  var entry = { date: start, at: nowLocalISO(), sessions: n, durationMinutes: dur,
    amount: amount, months: months > 0 ? months : 0, pkgId: pkg.id, kind: 'renewal' };
  m.passHistory.push(entry);
  if (!isArr(state.renewalLog)) state.renewalLog = [];
  state.renewalLog.push({ memberId: m.id, name: m.name, kind: 'renewal', pkgId: pkg.id,
    date: start, at: entry.at, sessions: n, durationMinutes: dur, amount: amount });
  var sh = renewCtx.sh;
  renewCtx = null;
  save();
  if (sh) sh.close();
  if (memberCtx) paintMemberSheet();
  render(true);
  toast(m.name + ' 수강권 +' + n + '회 연장 · 잔여 ' + totalRemaining(m.id) + '회');
}

/* =========================================================
   통계 탭
   ========================================================= */
function monthStats(ym){
  var r = { completed:0, same_day_cancel:0, no_show:0, excused_cancel:0, makeup:0, deducted:0, total:0 };
  state.sessions.forEach(function(s){
    if (s.date.slice(0, 7) !== ym) return;
    if (s.status === 'scheduled') return;
    r[s.status] = (r[s.status] || 0) + 1;
    r.total++;
    if (STATUS[s.status] && STATUS[s.status].deducted) r.deducted++;
  });
  /* 일반취소는 일정에서 지워지므로 남겨 둔 기록(state.cancelLog)으로 집계한다 */
  (state.cancelLog || []).forEach(function(c){
    if (String(c.date || '').slice(0, 7) !== ym) return;
    r.excused_cancel++;
    r.total++;
  });
  return r;
}

function weekBars(ym){
  var p = ym.split('-'), y = +p[0], mo = +p[1];
  var days = new Date(y, mo, 0).getDate();
  var weeks = Math.ceil(days / 7);
  var out = [];
  for (var w = 0; w < weeks; w++) {
    var from = iso(new Date(y, mo - 1, w * 7 + 1));
    var to = iso(new Date(y, mo - 1, Math.min(days, w * 7 + 7)));
    var list = state.sessions.filter(function(s){ return s.date >= from && s.date <= to && s.status !== 'scheduled'; });
    out.push({
      label: (w * 7 + 1) + '일',
      total: list.length,
      done: list.filter(function(s){ return s.status === 'completed'; }).length
    });
  }
  return out;
}

function kpi(cls, n, label, unit){
  return '<div class="kpi ' + (cls || '') + '"><div class="n">' + n + (unit ? '<small>' + unit + '</small>' : '') + '</div><div class="l">' + label + '</div></div>';
}

function statsMonthNav(){
  return '<div class="monhdr"><div class="m">' + monthLabel(ui.month) + '</div><div class="navs">' +
    '<button class="iconbtn" data-act="stats-month" data-delta="-1" aria-label="이전 달">' + ICON.back + '</button>' +
    '<button class="btn btn-sm btn-outline" data-act="stats-month" data-delta="0">이번 달</button>' +
    '<button class="iconbtn" data-act="stats-month" data-delta="1" aria-label="다음 달" style="transform:rotate(180deg)">' + ICON.back + '</button>' +
  '</div></div>';
}

    kpi('green', ms.completed, '완료 레슨', '건') +

        '<button class="btn btn-sm btn-outline" data-act="tpl-use" data-id="' + t.id + '">등록</button></div>';

  h += '<div class="sec"><h2>앱스토어 출시 로드맵</h2><span class="aside">현재 1단계</span></div><div class="card"><div class="rm">' +

  h += '<div class="foot">레슨 관리 프로토타입 · 아이디어 검증용<br>실제 회원 정보가 아닌 예시 데이터입니다</div>';
  return h;
}

/* ---------- 수입 정산 (차감된 레슨 × 회당 금액) ---------- */
function perSessionPrice(p){
  if (!p) return 0;
  var price = +p.price || 0, n = +p.totalSessions || 0;
  return (price > 0 && n > 0) ? Math.round(price / n) : 0;
}

function monthFromTo(ym){
  var p = String(ym).split('-'), y = +p[0], mo = +p[1];
  var last = new Date(y, mo, 0).getDate();
  return { from: ym + '-01', to: ym + '-' + pad(last), last: last };
}

/* 레슨에 붙은 수강권 (연결이 없으면 같은 시간 단위 수강권으로 추정) */
function sessionPkg(s){
  var p = pkgById(s.packageId);
  if (p) return p;
  var list = memberPkgs(s.memberId);
  for (var i = 0; i < list.length; i++) if (list[i].durationMinutes === s.durationMinutes) return list[i];
  return list.length ? list[0] : null;
}

function revenueRange(from, to){
  var all = [], total = 0, missing = 0, mmap = {}, rows = [];
  state.sessions.forEach(function(s){
    if (!s.deducted) return;
    if (s.date < from || s.date > to) return;
    var unit = perSessionPrice(sessionPkg(s));
    all.push({ id: s.id, date: s.date, time: s.startTime, status: s.status,
      memberId: s.memberId, name: memberName(s.memberId), dur: s.durationMinutes,
      unit: unit, missing: !(unit > 0) });
  });
  all.sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return minOf(b.time) - minOf(a.time);
  });
  all.forEach(function(r){
    if (r.missing) {
      missing++;
      if (r.memberId) mmap[r.memberId] = (mmap[r.memberId] || 0) + 1;
      return;
    }
    total += r.unit;
    rows.push(r);
  });
  return { all: all, rows: rows, total: total, count: rows.length,
    deducted: all.length, missing: missing, missingByMember: mmap };
}

function revenueByMember(rows){
  var map = {}, list = [];
  rows.forEach(function(r){
    var k = r.memberId || '-';
    if (!map[k]) { map[k] = { memberId: r.memberId, name: r.name, count: 0, amount: 0 }; list.push(map[k]); }
    map[k].count++; map[k].amount += r.unit;
  });
  list.sort(function(a, b){ return b.amount - a.amount; });
  return list;
}

/* 450000 → 45만 · 1230000 → 123만 (막대 그래프 라벨용) */
function wonShort(n){
  n = Math.round(n || 0);
  if (n >= 100000000) { var e = n / 100000000; return (e >= 10 ? Math.round(e) : Math.round(e * 10) / 10) + '억'; }
  if (n >= 10000) { var m = n / 10000; return (m >= 100 ? Math.round(m) : Math.round(m * 10) / 10) + '만'; }
  return n ? String(n) : '0';
}

function revMonthBody(ym, cur){
  var months = [], max = 1;
  for (var i = 5; i >= 0; i--) {
    var k = addMonths(ym + '-01', -i).slice(0, 7);

    months.push({ key: k, total: t });

  }
  var h = '<div class="sec" style="margin-top:16px"><h2>최근 6개월</h2><span class="aside">막대를 눌러 이동</span></div>' +

      return '<button class="wcol" data-act="rev-month" data-ym="' + x.key + '" aria-label="' + monthLabel(x.key) + ' 수입">' +

        '<span class="wlab' + (on ? ' on' : '') + '">' + (+x.key.slice(5, 7)) + '월</span></button>';

  return h;
}

function revWeekBody(ym){
  var rng = monthFromTo(ym), weeks = [], max = 1;
  for (var d = 1; d <= rng.last; d += 7) {
    var to = Math.min(rng.last, d + 6);
    var g = revenueRange(ym + '-' + pad(d), ym + '-' + pad(to));
    weeks.push({ key: 'w' + d, idx: weeks.length + 1, from: d, to: to, total: g.total, deducted: g.deducted, missing: g.missing, rows: g.rows, missingByMember: g.missingByMember });
    max = Math.max(max, g.total);
  }
  return '<div class="rvlist" style="margin-top:16px">' + weeks.map(function(w){
    var open = ui.revOpen === w.key;
    var share = w.total ? Math.max(4, Math.round(w.total / max * 100)) : 0;
    return '<div class="rvitem">' +
      '<button class="rvrow" data-act="rev-open" data-key="' + w.key + '" data-open="' + (open ? 1 : 0) + '">' +
        '<span class="rvmain"><span class="rvtitle">' + w.idx + '주차</span>' +
          '<span class="rvmeta">' + fmtDot(ym + '-' + pad(w.from)) + '~' + fmtDot(ym + '-' + pad(w.to)) + ' · 차감 ' + w.deducted + '회</span>' +
          '<span class="rvshare"><i style="width:' + share + '%"></i></span></span>' +
        '<span class="rvright"><span class="rvamt">' + money(w.total) + '</span>' +
          (w.missing ? '<span class="rvcnt">미입력 ' + w.missing + '건</span>' : '') + '</span>' +
        '<span class="rvchev">' + ICON.chev + '</span>' +

      (open ? revDetailMembers(w.rows, w.missingByMember) : '') +

  }).join('') + '</div>';
}

function revDayBody(cur){
  var map = {}, days = [];
  cur.all.forEach(function(r){
    if (!map[r.date]) { map[r.date] = { key: 'd' + r.date, date: r.date, total: 0, count: 0, missing: 0, rows: [] }; days.push(map[r.date]); }
    var d = map[r.date];
    d.count++;
    d.rows.push(r);
    if (r.missing) d.missing++;
    else d.total += r.unit;
  });
  days.sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  var max = 1;
  days.forEach(function(d){ max = Math.max(max, d.total); });

  var h = '<div class="sec" style="margin-top:16px"><h2>일별 수입</h2><span class="aside">' + days.length + '일 · 최근순</span></div>';

  return h + '<div class="rvlist">' + days.map(function(d){
    var open = ui.revOpen === d.key;
    var dow = WEEK[parseISO(d.date).getDay()];

   캘린더 + 버튼 · 한 줄 음성/타이핑 레슨 추가
   ========================================================= */
var qaCtx = null;

var QA_EXAMPLES = [
  '내일 오후 3시 김민준 55분 분당',
  '11월 25일 14:30 박서연 판교연습장',

];

function parseQuickLesson(text){
  var raw = String(text || '').trim();
  var res = { date:'', time:'', location:'', memberName:'', memberId:'', duration:0, gender:'', found:{} };
  if (!raw) return res;
  var t = raw;
  var dp = parseDateFromText(raw);
  if (dp.date) {
    res.date = dp.date;
    res.found.date = true;
    if (dp.matchedRaw) t = t.replace(dp.matchedRaw, ' ');
  }
  var m;

  /* 시간 */
  if ((m = t.match(/(오전|오후|아침|저녁|밤)\s*(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/))) {
    var hh = +m[2], mi = m[3] ? +m[3] : 0;
    var pm = (m[1] === '오후' || m[1] === '저녁' || m[1] === '밤');
    if (pm && hh < 12) hh += 12;
    if (!pm && hh === 12) hh = 0;
    if (hh < 24 && mi < 60) { res.time = pad(hh) + ':' + pad(mi); res.found.time = true; }
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/(\d{1,2})\s*:\s*(\d{2})/))) {
    if ((+m[1]) < 24 && (+m[2]) < 60) { res.time = pad(+m[1]) + ':' + m[2]; res.found.time = true; }
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/))) {
    var h2 = +m[1], m2 = m[2] ? +m[2] : 0;
    if (h2 >= 1 && h2 <= 6) h2 += 12;
    if (h2 < 24 && m2 < 60) { res.time = pad(h2) + ':' + pad(m2); res.found.time = true; }
    t = t.replace(m[0], ' ');
  }

  /* 수업 시간 25분 / 55분 */
  if ((m = t.match(/(\d{2,3})\s*분/))) {
    var v = +m[1];
    if (v >= 10 && v <= 240) { res.duration = (v <= 35 ? 25 : 55); res.durationRaw = v; res.found.duration = true; }
    t = t.replace(m[0], ' ');
  }

  /* 성별 */
  if ((m = t.match(/(남성|남자|여성|여자)/))) {
    res.gender = (m[1].charAt(0) === '남' ? 'male' : 'female');
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/\s(남|여)(?=\s)/))) {
    res.gender = (m[1] === '남' ? 'male' : 'female');
    t = t.replace(' ' + m[1] + ' ', ' ');
  }

  /* 남은 토큰: 회원 이름 / 장소 */
  var toks = t.replace(/[,·、]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').filter(function(x){ return !!x; });
  var loc = [];
  toks.forEach(function(tok){
    var v = tok.replace(/[()\[\]"]/g, '').replace(/(님|씨|회원)$/, '').trim();
    if (!v) return;
    if (!res.memberName && /^[가-힣]{2,4}$/.test(v) && !isRegionWord(v) && !isLevelWord(v) && !isNameStopWord(v)) { res.memberName = v; res.found.member = true; return; }
    if (!res.memberName && /^[A-Za-z][A-Za-z.]{1,14}$/.test(v)) { res.memberName = v; res.found.member = true; return; }
    if (isLevelWord(v)) { res.level = v; return; }
    loc.push(v);
  });
  res.location = loc.join(' ').trim();
  if (res.location) res.found.location = true;

  if (res.memberName) {
    for (var i = 0; i < state.members.length; i++) {
      if (state.members[i].name === res.memberName) { res.memberId = state.members[i].id; break; }
    }
  }
  return res;
}

  if (p.duration) { qaCtx.duration = p.duration; setSegValue('qaDur', p.duration); }

  var sel = document.getElementById('qaMember');
  if (sel) {
    refreshQaMemberOptions(p, null);
    if (p.memberId) sel.value = p.memberId;
    else if (p.memberName) sel.value = '__new__';
    syncPickLabel('qaMember');
  }

  if (bar) {
    if (!ta.value.trim()) bar.innerHTML = '날짜 · 시간 · 회원 · 장소를 알아서 나눠 담아요.';
    else {
      var bits = [];
      bits.push(p.date ? fmtShort(p.date) : '날짜 ?');
      bits.push(p.time || '시간 ?');
      bits.push(p.memberName ? p.memberName + (p.memberId ? '' : '(새 회원)') : '회원 ?');
      bits.push((p.duration || 55) + '분');
      if (p.location) bits.push(p.location);
      bar.innerHTML = '인식 결과 · <b>' + esc(bits.join(' · ')) + '</b>';
    }
  }
  validateQuick();
}

function validateQuick(){
  if (!qaCtx) return;
  var dEl = document.getElementById('qaDate'), tEl = document.getElementById('qaTime');
  var sel = document.getElementById('qaMember'), w = document.getElementById('qaWarn');
  if (!dEl || !tEl || !w || !sel) return;
  var msgs = [];
  var date = dEl.value, time = tEl.value, mid = sel.value;
  if (!date) msgs.push('날짜를 골라주세요.');
  if (!time) msgs.push('시간을 골라주세요.');
  if (!mid) msgs.push('회원을 골라주세요.');
  if (mid === '__new__' && !qaCtx.parsedName) msgs.push('새 회원 이름을 적어주세요.');
  if (date && time) {
    var a = minOf(time), b = a + (qaCtx.duration || 55);
    var clash = sessionsByDate(date).filter(function(s){
      if (s.status === 'excused_cancel' || s.status === 'same_day_cancel' || s.status === 'no_show') return false;
      return a < sessionEnd(s) && minOf(s.startTime) < b;
    });
    if (clash.length) msgs.push(clash[0].startTime + '에 ' + memberName(clash[0].memberId) + ' 레슨이 있어요.');
  }
  w.innerHTML = msgs.length
    ? '<div class="err">' + esc(msgs.join(' ')) + '</div>'
    : '<div class="ok">' + fmtShort(date) + ' ' + time + ' · ' +
      (mid === '__new__' ? '새 회원 ' + esc(qaCtx.parsedName) : memberName(mid)) + ' ' + (qaCtx.duration || 55) + '분</div>';
  var btn = qaCtx.sh.footer.querySelector('[data-act="qa-save"]');
  if (btn) btn.disabled = msgs.length > 0;
}

function saveQuickLesson(){
  if (!qaCtx) return;
  var dEl = document.getElementById('qaDate'), tEl = document.getElementById('qaTime');
  var sel = document.getElementById('qaMember'), lEl = document.getElementById('qaLocation');
  if (!dEl || !tEl || !sel) return;
  var date = dEl.value, time = tEl.value, mid = sel.value;
  var loc = lEl ? lEl.value.trim() : '';
  if (!date || !time || !mid) { toast('날짜 · 시간 · 회원을 채워주세요'); return; }
  var dur = qaCtx.duration || 55;
  if (mid === '__new__') {
    var name = (qaCtx.parsedName || '').trim();
    if (!name) { toast('새 회원 이름을 적어주세요'); return; }
    var nm = { id: uid('mem'), name: name, gender: qaCtx.gender || '', region: '', phone: '', level: '', memo: '', since: todayISO() };
    state.members.push(nm);
    mid = nm.id;
  }
  var pkg = null;
  activePkgs(mid).forEach(function(p){
    if (p.durationMinutes === dur && !pkg && !(p.expiryDate && p.expiryDate < todayISO())) pkg = p;
  });
  if (!pkg) activePkgs(mid).forEach(function(p){ if (p.durationMinutes === dur && !pkg) pkg = p; });
  var s = {
    id: uid('lsn'), memberId: mid, packageId: pkg ? pkg.id : '', date: date, startTime: time,
    durationMinutes: dur, location: loc, status:'scheduled', deducted:false, memo:'', settledAt:'', source:'quick'
  };
  state.sessions.push(s);
  save();
  ui.tab = 'calendar'; ui.date = date; ui.month = date.slice(0, 7);
  var sh = qaCtx.sh;
  qaCtx = null;
  stopQaVoice();
  if (sh) sh.close();
  render();
  toast(fmtShort(date) + ' ' + time + ' · ' + memberName(mid) + ' ' + dur + '분 추가');
  calendarAfterAdd(s);
}

function toggleQaVoice(){
  if (!document.getElementById('qaLine')) return;
  if (voice.want) {
    var wasQa = (voice.kind === 'qa');
    vrStop();
    if (wasQa) {
      var bar = document.getElementById('qaBar');
      if (bar) bar.innerHTML = '음성 입력을 멈췄어요. 🎤를 다시 누르면 이어서 들을 수 있어요.';
    }
    return;
  }
  vrStart('qa');
}

function updatePkUnit(){

function exportData(){
  try {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'golf-lesson-data-' + todayISO() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast('데이터 파일을 내보냈어요');
  } catch (e) {
    toast('이 브라우저에서는 내보내기를 지원하지 않아요');
  }
}

function onClick(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act');
  var i, w;

  switch (act) {
    case 'tab':
      closeAllSheets();
      ui.tab = el.getAttribute('data-tab');
      render();
      break;

    case 'member-sort': {
      var sm = el.getAttribute('data-v') || 'remaining';
      if (memberSortMode() === sm) break;
      state.memberSort = sm;
      save();
      render(true);
      toast('회원 목록 · ' + memberSortLabel(sm));
      break;
    }

    case 'day':
      ui.date = el.getAttribute('data-date');
      render();
      break;

    case 'month': {
      var delta = parseInt(el.getAttribute('data-delta'), 10) || 0;
      if (!delta) { ui.date = todayISO(); }
      else {
        var d0 = parseISO(ui.date);
        ui.date = iso(new Date(d0.getFullYear(), d0.getMonth() + delta, 1));
      }
      render();
      break;
    }

    case 'stats-month': {
      var dl = parseInt(el.getAttribute('data-delta'), 10) || 0;
      if (!dl) ui.month = todayISO().slice(0, 7);
      else {
        var p = ui.month.split('-');
        var d1 = new Date(+p[0], (+p[1]) - 1 + dl, 1);
        ui.month = d1.getFullYear() + '-' + pad(d1.getMonth() + 1);
      }
      ui.revOpen = '';
      render();
      break;
    }

    /* ---------- 통계 하위 메뉴 · 수입 정산 ---------- */
    case 'stats-view':
      ui.stats = el.getAttribute('data-v') === 'revenue' ? 'revenue' : 'lesson';
      ui.revOpen = '';
      render();
      break;

    case 'rev-unit':
      ui.revUnit = el.getAttribute('data-v') || 'month';
      ui.revOpen = '';
      render(true);
      break;

    case 'rev-month': {
      var ymv = el.getAttribute('data-ym');
      if (ymv) { ui.month = ymv; ui.revOpen = ''; render(true); }
      break;
    }

    case 'rev-open': {
      var rk = el.getAttribute('data-key');
      ui.revOpen = (ui.revOpen === rk) ? '' : rk;
      render(true);
      break;
    }

    case 'pkg-price':
      openPriceSheet(el.getAttribute('data-mid'));
      break;

    case 'price-save':
      savePrice();
      break;

    /* ---------- 앱 안 피커 ---------- */
    case 'pick':
      openPick(el.getAttribute('data-field'));
      break;

    case 'pick-set': {
      if (!pickCtx) break;
      var pf = pickCtx.field, pv = el.getAttribute('data-v');
      pickCtx.sh.close();
      pickCtx = null;
      applyPick(pf, pv);
      break;
    }

    case 'datepick':
      openDatePick(el.getAttribute('data-field'));
      break;

    case 'dpmon': {
      if (!dpCtx) break;
      var dmd = parseInt(el.getAttribute('data-delta'), 10) || 0;
      var dmp = dpCtx.ym.split('-');
      var dmd2 = new Date(+dmp[0], (+dmp[1]) - 1 + dmd, 1);
      dpCtx.ym = dmd2.getFullYear() + '-' + pad(dmd2.getMonth() + 1);
      paintDatePick();
      break;
    }

    case 'dpday':
      if (!dpCtx) break;
      var dpf = dpCtx.field, dpv = el.getAttribute('data-date');
      dpCtx.sh.close();
      dpCtx = null;
      applyDate(dpf, dpv);
      break;

    case 'dp-today':
      if (!dpCtx) break;
      var dpf2 = dpCtx.field;
      dpCtx.sh.close();
      dpCtx = null;
      applyDate(dpf2, todayISO());
      break;

    case 'timepick':
      openTimePick(el.getAttribute('data-field'));
      break;

    case 'tpick':
      if (!tpCtx) break;
      var tpf = tpCtx.field, tpv = el.getAttribute('data-v');
      tpCtx.sh.close();
      tpCtx = null;
      applyTime(tpf, tpv);
      break;

    case 'sheet-close':
      closeSheetEl(el.closest('.sheetwrap'));
      break;

    case 'confirm-yes': {
      var fn = confirmFn;
      confirmFn = null;
      closeSheetEl(el.closest('.sheetwrap'));
      if (fn) fn();
      break;
    }

    /* ---------- 레슨 상태 ---------- */
    case 'status-sheet':
      openStatusSheet(el.getAttribute('data-sid'));
      break;

    case 'status-set': {
      var s = findSession(el.getAttribute('data-sid'));
      if (!s) break;
      var st = el.getAttribute('data-status');
      var pkg = pkgById(s.packageId);
      w = el.closest('.sheetwrap');
      if (st === 'excused_cancel') {
        /* 일반취소 = 차감 되돌리고 일정에서 삭제 (오늘·캘린더에서 사라짐) */
        var cx = cancelExcused(s);
        save();
        if (w) closeSheetEl(w);
        render(true);
        lastCancel = cx;
        var cmsg = cx.memberName + ' 일반취소 · 일정에서 지웠어요';
        if (cx.wasDeducted) cmsg += ' · 잔여 ' + cx.remaining + '회로 복구';
        toast(cmsg, { label:'되돌리기', act:'status-undo', ms:6000 });
        break;
      }
      applyStatus(s, st);
      save();
      if (w) closeSheetEl(w);
      render(true);
      toast(STATUS[st].label + ' 처리' + (pkg ? ' · ' + memberName(s.memberId) + ' 잔여 ' + pkg.remainingSessions + '회' : ''));
      break;
    }

    case 'status-undo': {
      var uc = lastCancel;
      lastCancel = null;
      var tel = document.getElementById('toast');
      if (tel) tel.classList.remove('on');
      if (!uc) break;
      if (undoCancelExcused(uc)) {
        save();
        render(true);
        var bs = uc.snap;
        toast(memberName(bs.memberId) + ' ' + fmtDot(bs.date) + ' ' + bs.startTime + ' · ' +
          (STATUS[bs.status] ? STATUS[bs.status].label : '예정') + ' 상태로 되돌렸어요' +
          (uc.wasDeducted ? ' · 차감도 원래대로' : ''));
      }
      break;
    }

    /* ---------- 외부 캘린더 ---------- */
    case 'cal-toggle': {
      var cst = calSync();
      cst.enabled = !cst.enabled;
      save();
      paintCalSetting();
      toast(cst.enabled ? '캘린더 연동 켜짐 · ' + calTargetLabel(cst.target) : '캘린더 연동 꺼짐');
      break;
    }

    case 'cal-target': {
      var csg = calSync();
      if (!csg.enabled) { toast('캘린더 연동 스위치를 먼저 켜 주세요'); break; }
      var cv = el.getAttribute('data-v');
      if (csg.target === cv) break;
      csg.target = cv;
      save();
      paintCalSetting();
      toast('연동 캘린더 · ' + calTargetLabel(cv));
      break;
    }

    case 'cal-sheet':
      openCalSheet(el.getAttribute('data-sid'));
      break;

    case 'cal-apple': {
      var sa = findSession(el.getAttribute('data-sid'));
      if (!sa) break;
      toast(addToAppleCalendar(sa)
        ? '.ics 파일을 만들었어요 · 열어서 "캘린더에 추가"를 누르면 끝'
        : '캘린더 파일을 만들지 못했어요 · 다시 시도해 주세요', { ms: 3600 });
      break;
    }

    case 'cal-google': {
      var sg = findSession(el.getAttribute('data-sid'));
      if (!sg) break;
      if (addToGoogleCalendar(sg)) {
        w = el.closest('.sheetwrap');
        if (w) closeSheetEl(w);
      } else {
        calPendingSid = sg.id;
        toast('팝업이 막혔어요 · 구글 캘린더로 열기', { act:'cal-google-retry', label:'열기', ms: 8000 });
      }
      break;
    }

    case 'cal-google-retry': {
      var sp = calPendingSid ? findSession(calPendingSid) : null;
      calPendingSid = null;
      var tel = document.getElementById('toast');
      if (tel) tel.classList.remove('on');
      if (sp) { try { window.open(gcalUrl(sp), '_blank'); } catch(e){} }
      break;
    }

    /* ---------- 마감 정산 ---------- */
    case 'settle-open':
      openSettleSheet(todayISO());
      break;

    case 'settle-set':
      if (!settleCtx) break;
      settleCtx.sel.decisions[el.getAttribute('data-sid')] = el.getAttribute('data-status');
      paintSettle();
      break;

    case 'settle-all':
      if (!settleCtx) break;
      settleCtx.list.forEach(function(x){
        if (!settleCtx.sel.decisions[x.id]) settleCtx.sel.decisions[x.id] = 'completed';
      });
      paintSettle();
      break;

    case 'settle-apply':
      settleApply();
      break;

    /* ---------- 레슨 메모 ---------- */
    case 'note-open':
      openSessionMemoSheet(el.getAttribute('data-sid'));
      break;

    /* ---------- 카톡 요약 복사 ---------- */
    case 'kakao-copy': {
      var ksid = el.getAttribute('data-sid');
      var kmid = el.getAttribute('data-mid');
      var ktxt = ksid ? kakaoReportForSession(ksid) : (kmid ? kakaoReportForMember(kmid) : '');
      if (!ktxt) { toast('복사할 레슨 정보가 없어요'); break; }
      copyText(ktxt, function(ok){
        toast(ok ? '카톡용 레슨 요약이 복사됐어요' : '복사가 안 됐어요 · 다시 눌러 주세요', { ms: ok ? 2200 : 3000 });
      });
      break;
    }

    /* ---------- 수강권 연장 (재등록) ---------- */
    case 'renew-open':
      openRenewSheet(el.getAttribute('data-id'));
      break;

    case 'renew-preset': {
      if (!renewCtx) break;
      renewCtx.sessions = parseInt(el.getAttribute('data-v'), 10) || 0;
      var rqEl = document.getElementById('rqSessions');
      if (rqEl) rqEl.value = renewCtx.sessions;
      if (!renewCtx.amountTouched) renewCtx.amount = renewalDefaultAmount(renewCtx.memberId, renewCtx.sessions, renewCtx.duration);
      paintRenew();
      break;
    }

    case 'renew-direct': {
      var rqEl2 = document.getElementById('rqSessions');
      if (rqEl2) { rqEl2.focus(); try { rqEl2.select(); } catch(e){} }
      break;
    }

    case 'renew-dur': {
      if (!renewCtx) break;
      renewCtx.duration = parseInt(el.getAttribute('data-v'), 10) || 55;
      for (i = 0; i < el.parentNode.children.length; i++) {
        el.parentNode.children[i].classList.toggle('on', el.parentNode.children[i] === el);
      }
      if (!renewCtx.amountTouched) renewCtx.amount = renewalDefaultAmount(renewCtx.memberId, renewCtx.sessions, renewCtx.duration);
      paintRenew();
      break;
    }

    case 'renew-apply':
      saveRenewal();
      break;

    /* ---------- 골프 태그 ---------- */
    case 'note-tag': {
      if (!memberCtx) break;
      var tkey = el.getAttribute('data-v');
      var sel = isArr(memberCtx.tagSel) ? memberCtx.tagSel : [];
      var at = sel.indexOf(tkey);
      if (at >= 0) sel.splice(at, 1); else sel.push(tkey);
      memberCtx.tagSel = sortTags(sel);
      memberCtx.tagTouched = true;
      el.classList.toggle('on', memberCtx.tagSel.indexOf(tkey) >= 0);
      break;
    }

    case 'tag-filter': {
      if (!memberCtx) break;
      memberCtx.tagFilter = el.getAttribute('data-v') || '전체';
      paintMemberSheet();
      break;
    }

    case 'sm-save': {
      var ss = findSession(el.getAttribute('data-sid'));
      var ta = document.getElementById('smMemo');
      if (ss && ta) { ss.memo = ta.value.trim(); save(); }
      closeSheetEl(el.closest('.sheetwrap'));
      render(true);
      toast('레슨 메모를 저장했어요');
      break;
    }

    /* ---------- 회원 ---------- */
    case 'member-open':
      openMemberSheet(el.getAttribute('data-id'));
      break;

    case 'member-add':
      openAddMemberSheet(null);
      break;

    case 'member-edit':
      openAddMemberSheet(memberById(el.getAttribute('data-id')));
      break;

    case 'member-save':
      saveMember();
      break;

    case 'memo-save': {
      if (!memberCtx) break;
      var mm = memberById(memberCtx.memberId);
      var mt = document.getElementById('swingMemo');
      if (mm && mt) { mm.memo = mt.value.trim(); save(); toast('스윙 메모를 저장했어요'); }
      break;
    }

    /* ---------- 수강권 ---------- */
    case 'pkg-add':
      openPackageSheet(el.getAttribute('data-id'));
      break;

    case 'pkg-save':
      savePackage();
      break;

    case 'pk-dur':
      if (!pkgCtx) break;
      pkgCtx.duration = parseInt(el.getAttribute('data-v'), 10) || 55;
      for (i = 0; i < el.parentNode.children.length; i++) {
        el.parentNode.children[i].classList.toggle('on', el.parentNode.children[i] === el);
      }
      break;

    case 'pk-count': {
      var pc = document.getElementById('pkSessions');
      if (pc) pc.value = el.getAttribute('data-v');
      updatePkUnit();
      var chips = el.parentNode.children;
      for (i = 0; i < chips.length; i++) chips[i].classList.toggle('on', chips[i] === el);
      break;
    }

    /* ---------- 레슨 차트 ---------- */
    case 'voice':
      toggleVoice();
      break;

    case 'note-save':
      saveNote();
      break;

    case 'note-del': {
      var nid = el.getAttribute('data-nid');
      askConfirm('기록 삭제', '이 레슨 기록을 지울까요? 되돌릴 수 없어요.', '기록 삭제', function(){
        state.notes = (state.notes || []).filter(function(n){ return n.id !== nid; });
        save();
        if (memberCtx) paintMemberSheet();
        render(true);
        toast('기록을 삭제했어요');
      });

      if (q) { q.value = el.getAttribute('data-v'); applyQuickLine(); }

      renderGenderChips(el);
      break;

    case 'mf-dur':
      if (!addCtx) break;
      addCtx.duration = parseInt(el.getAttribute('data-v'), 10) || 55;
      setDurUI(addCtx.duration);
      break;

    case 'mf-count': {
      var sc = document.getElementById('mfSessions');
      if (sc) sc.value = el.getAttribute('data-v');
      updateUnit();
      break;
    }

    /* ---------- 예약 ---------- */
    case 'book-open':
      openBookSheet({
        date: ui.tab === 'calendar' ? ui.date : todayISO(),
        memberId: el.getAttribute('data-member') || null
      });
      break;

    case 'bk-dur':
      if (!bookCtx) break;
      bookCtx.dur = parseInt(el.getAttribute('data-v'), 10) || 55;
      for (i = 0; i < el.parentNode.children.length; i++) {
        el.parentNode.children[i].classList.toggle('on', el.parentNode.children[i] === el);

      break;

      openQuickAddSheet();
      break;

    case 'qa-voice':
      toggleQaVoice();

    case 'qa-example': {
      var ql = document.getElementById('qaLine');
      if (ql) { ql.value = el.getAttribute('data-v'); applyQuickParse(); }
      break;
    }

    case 'qa-dur':
      if (!qaCtx) break;
      qaCtx.duration = parseInt(el.getAttribute('data-v'), 10) || 55;
      setSegValue('qaDur', qaCtx.duration);
      validateQuick();
      break;

    case 'qa-save':
      saveQuickLesson();
      break;

    /* ---------- 통계 / 설정 ---------- */
    case 'tpl-use': {
      var tid = el.getAttribute('data-id');
      var tpl = null;
      state.templates.forEach(function(t){ if (t.id === tid) tpl = t; });
      openAddMemberSheet(null, tpl);
      break;
    }

    case 'pro-save': {
      var pEl = document.getElementById('setPro'), aEl = document.getElementById('setAcademy');
      if (pEl && pEl.value.trim()) state.pro.name = pEl.value.trim();
      if (aEl) state.pro.academy = aEl.value.trim();
      save();
      render();
      toast('프로 정보를 저장했어요');
      break;
    }

    case 'export-data':
      exportData();
      break;

    case 'demo-reset':
      askConfirm('데모 데이터로 초기화', '지금까지 이 브라우저에 저장한 예약·회원·기록이 모두 지워지고 처음 예시 데이터로 돌아갑니다.', '초기화', resetDemo);
      break;

    default:
      break;
  }
}

function renderGenderChips(el){
  var seg = document.getElementById('mfGender');
  if (!seg) return;
  for (var i = 0; i < seg.children.length; i++) {
    seg.children[i].classList.toggle('on', seg.children[i] === el);
  }
}

function onFieldChange(e){
  var t = e.target;
  var pid = t && t.getAttribute ? t.getAttribute('data-pid') : null;
  if (pid) {
    var pkg = pkgById(pid);
    var hintEl = document.getElementById('pv_' + pid);
    var v = parseInt(String(t.value).replace(/[^0-9]/g, ''), 10);
    if (hintEl && pkg) {
      hintEl.innerHTML = (v > 0 && pkg.totalSessions > 0)
        ? '회당 약 <b>' + money(Math.round(v / pkg.totalSessions)) + '</b> · 총 ' + money(v)
        : '금액을 넣으면 회당 금액을 계산해 드려요.';
    }
    return;
  }
  var id = t && t.id;
  if (!id) return;
  if (id === 'mSearch') {
    ui.search = e.target.value;
    var box = document.getElementById('memberList');
    if (box) box.innerHTML = memberRowsHTML(filteredMembers());
  } else if (id === 'quickLine') {
    applyQuickLine();
  } else if (id === 'mfSessions' || id === 'mfPrice') {
    updateUnit();
  } else if (id === 'pkSessions' || id === 'pkPrice') {
    updatePkUnit();
  } else if (id === 'noteText') {
    refreshNoteDate();
    refreshNoteTags();
  } else if (id === 'rqSessions') {
    if (!renewCtx) return;
    var rn = parseInt(e.target.value, 10);
    renewCtx.sessions = (rn > 0) ? rn : 0;
    if (!renewCtx.amountTouched) renewCtx.amount = renewalDefaultAmount(renewCtx.memberId, renewCtx.sessions, renewCtx.duration);
    paintRenew();
  } else if (id === 'rqAmount') {
    if (!renewCtx) return;
    var rav = String(e.target.value).replace(/[^0-9]/g, '');
    renewCtx.amount = rav === '' ? '' : parseInt(rav, 10);
    renewCtx.amountTouched = true;
    paintRenew();
  } else if (id === 'noteDate') {
    if (memberCtx) memberCtx.noteDate = e.target.value;
    var b = document.getElementById('noteDateBadge');
    if (b) b.textContent = fmtShort(e.target.value || todayISO());
  } else if (id === 'bkMember') {
    refreshBkPkgs();
  } else if (id === 'bkDate' || id === 'bkTime') {
    validateBook();
  } else if (id === 'qaLine') {
    applyQuickParse();
  } else if (id === 'qaDate' || id === 'qaTime' || id === 'qaMember' || id === 'qaLocation') {
    validateQuick();
  }
}

/* =========================================================
   시작
   ========================================================= */
function init(){
  var firstRun = false;
  try { firstRun = !localStorage.getItem(KEY); } catch (e) {}
  load();
  if (!state.notes) state.notes = [];
  /* 예전에 저장한 레슨 기록은 본문에서 태그를 한 번 계산해 둡니다 */
  var tagged = 0;
  state.notes.forEach(function(n){
    if (!isArr(n.tags)) { n.tags = detectGolfTags(n.text || ''); tagged++; }
  });
  if (!isArr(state.renewalLog)) state.renewalLog = [];
  state.members.forEach(function(mm){ if (!isArr(mm.passHistory)) mm.passHistory = []; });
  if (tagged) save();
  if (!state.pro) state.pro = { name: '이시훈', title: 'KPGA 투어 프로', academy: '' };
  if (!state.templates) state.templates = [];
  ui.date = todayISO();
  ui.month = todayISO().slice(0, 7);
  render();
  if (firstRun) setTimeout(function(){ toast('데모 데이터로 시작합니다 · 통계에서 초기화할 수 있어요'); }, 700);
}

document.addEventListener('click', onClick);
document.addEventListener('input', onFieldChange);
document.addEventListener('change', onFieldChange);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeTopSheet();
});
/* 앱을 떠날 때는 마이크를 확실히 반납합니다 */
window.addEventListener('pagehide', function(){ if (voice.want || voice.inst) vrStop(); });

init();

})();

</script>
