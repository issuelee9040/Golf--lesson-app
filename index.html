  if (!name && !useDemo) {          /* 이름은 필수 — 빈 이름으로는 시작하지 않음 */
    if (errEl) errEl.classList.add('on');
    focusOnboarding();
    return false;
  }
  if (errEl) errEl.classList.remove('on');
  var keepTheme = themeOf();
  obWaiting = false;                /* 이제부터 저장 가능 */
  if (useDemo) {
    state = buildDemo();
    state.pro.name = name || '프로';
    if (academy) state.pro.academy = academy;
  } else {
    state = blankState(name, academy);
  }
  state.theme = keepTheme;
  if (!isArr(state.notes)) state.notes = [];
  if (!isArr(state.renewalLog)) state.renewalLog = [];
  save();
  applyTheme(keepTheme);
  hideOnboarding();
  ui.tab = 'today';
  ui.date = todayISO();
  ui.month = todayISO().slice(0, 7);
  ui.search = '';
  render();
  toast(useDemo

  return true;

function pastDates(endISO, count, dows, fromISO){
  var out = [], d = endISO, guard = 0;
  while (out.length < count && guard < 500) {
    if (dows.indexOf(dowOf(d)) >= 0 && d >= fromISO) out.push(d);
    d = addDays(d, -1); guard++;
  }
  return out.reverse();
}

   ========================================================= */
var REGION_LIST = ['분당','판교','강남','서초','송파','잠실','수원','일산','용인','광교','위례','하남','미사',
  '평촌','안양','부천','인천','대전','대구','부산','울산','청주','전주','창원','제주','김포','파주','남양주',
  '성남','동탄','영통','오산','화성','시흥','광명','구리','노원','마포','강서','목동','여의도','반포','압구정',
  '대치','도곡','방배','성수','수지','죽전','기흥','정자','서현','야탑','세종','천안','아산','익산','군산',
  '포항','경주','김해','양산','진주','여수','순천','목포','원주','춘천','강릉','속초','제주시','서귀포','하와이'];
var LEVEL_LIST = ['입문','초급','중급','상급','프로','왕초보'];
var STOP_WORDS = ['다음주','이번주','다다음주','다음','이번','오전','오후','아침','저녁','밤','낮','요일','시','분','때','쯤',
  '레슨','수업','연습','장소','회원','새로','오늘','내일','어제','그제','그저께','모레',
  '월요일','화요일','수요일','목요일','금요일','토요일','일요일'];
function isNameStopWord(v){ return STOP_WORDS.indexOf(v) >= 0; }

function isRegionWord(v){
  if (REGION_LIST.indexOf(v) >= 0) return true;
  if (!v || v.length < 3 || v.length > 6) return false;
  if (isNameStopWord(v)) return false;
  return /(특별시|광역시|시|군|구|읍|면)$/.test(v);
}
function isLevelWord(v){ return LEVEL_LIST.indexOf(v) >= 0; }

/* ---------- 금액 표기 읽기 (80만원 · 8만5천 · 1,000,000원 · 70000) ---------- */
var MONEY_UNIT = { '억': 100000000, '만': 10000, '천': 1000 };
function moneyNum(s){ var n = parseFloat(String(s).replace(/,/g, '')); return isFinite(n) ? n : 0; }
/* 만/천/억이 한 번에 두 번까지 붙는 표기(8만5천)를 한 값으로 */
function moneyMatchToValue(m){
  var v = moneyNum(m[1]) * MONEY_UNIT[m[2]];
  if (m[3]) v += moneyNum(m[3]) * MONEY_UNIT[m[4]];
  return Math.round(v);
}
/* 문장에서 금액 하나를 찾아 { value, text }. 단위(만·천·억·원)가 없으면 allowBare 일 때만 숫자 하나를 금액으로 봅니다 */
function takeMoney(str, allowBare){
  var m = str.match(/([0-9][0-9,]*(?:\.[0-9]+)?)\s*(억|만|천)(?:\s*([0-9][0-9,]*(?:\.[0-9]+)?)\s*(만|천))?\s*원?/);
  if (m) return { value: moneyMatchToValue(m), text: m[0] };
  m = str.match(/([0-9][0-9,]*(?:\.[0-9]+)?)\s*원/);
  if (m) return { value: Math.round(moneyNum(m[1])), text: m[0] };
  if (allowBare) {
    m = str.match(/(?:^|[\s:：])([0-9]{4,9})(?=$|[\s,])/);
    if (m) return { value: Math.round(moneyNum(m[1])), text: m[1] };
  }
  return null;
}
function cutText(str, idx, len){ return str.slice(0, idx) + ' ' + str.slice(idx + len); }

function parseMemberLine(text){
  var raw = String(text || '');
  var res = { name:'', duration:0, durationRaw:0, sessions:0, total:0, rem:0,
              price:0, perLesson:0, gender:'', region:'', phone:'', level:'', extra:'', found:{} };
  var m, n;

  /* ① 회당 단가 — "회당 7만원" · "1회당 70000" */
  if ((m = raw.match(/(?:1\s*회\s*당|회\s*당)\s*[:：]?\s*/))) {
    var per = takeMoney(raw.slice(m.index + m[0].length), true);
    if (per && per.value > 0) {
      res.perLesson = per.value;
      res.found.perLesson = true;
      raw = cutText(raw, m.index, m[0].length + per.text.length);
    }
  }
  /* ② 총 금액 — "80만원" · "8만5천" · "1,000,000원" */
  var tot = takeMoney(raw, false);
  if (tot && tot.value > 0) {
    res.price = tot.value;
    res.found.price = true;
    raw = raw.replace(tot.text, ' ');
  }

  /* ③ 남은 횟수 / 전체 횟수 */
  /* "4/10회" · "4/10" (앞뒤가 날짜가 아닐 때) */
  if ((m = raw.match(/(\d{1,3})\s*\/\s*(\d{1,3})\s*(?:회|회권)?/))) {
    var before = m.index > 0 ? raw.charAt(m.index - 1) : ' ';
    var tail = raw.slice(m.index + m[0].length, m.index + m[0].length + 3);
    var a = parseInt(m[1], 10), b = parseInt(m[2], 10);
    /* "4/10"은 횟수, "11/24"처럼 날짜로 읽힐 수 있는 모양은 '회'가 붙었을 때만 횟수 */
    var looksDate = /^\s*(부터|까지|예약|시작|일|월)/.test(tail) || (!/회/.test(m[0]) && a <= 12 && b <= 31 && a < b);
    if (!/[0-9\/]/.test(before) && !looksDate && a > 0 && b > 0 && a <= 200 && b <= 200) {
      res.rem = Math.min(a, b);
      res.total = Math.max(a, b);
      res.found.rem = true;
      res.found.total = true;
      raw = cutText(raw, m.index, m[0].length);
    }
  }
  /* "10회중 4회남음" · "10회 중 4회 남음" */
  if (!res.found.rem && (m = raw.match(/(\d{1,3})\s*회\s*(?:중에서|중에|중|에서)\s*(?:잔여\s*)?(\d{1,3})\s*회\s*(?:남음|남았|남아|남은)?/))) {
    var tt = parseInt(m[1], 10), rr = parseInt(m[2], 10);
    if (tt > 0 && rr > 0 && tt <= 200 && rr <= 200) {
      res.total = tt;
      res.rem = Math.min(rr, tt);
      res.found.total = true;
      res.found.rem = true;
      raw = cutText(raw, m.index, m[0].length);
    }
  }
  /* "잔여 4회" · "남은 4회" */
  if (!res.found.rem && (m = raw.match(/(?:잔여|남은|남아\s*있는)\s*[:：]?\s*(\d{1,3})\s*회?/))) {
    res.rem = parseInt(m[1], 10);
    res.found.rem = true;
    raw = cutText(raw, m.index, m[0].length);
  }
  /* "4회 남음" · "4회남음" · "4회 남아" */
  if (!res.found.rem && (m = raw.match(/(\d{1,3})\s*회\s*(?:남음|남았|남아|남은)/))) {
    res.rem = parseInt(m[1], 10);
    res.found.rem = true;
    raw = cutText(raw, m.index, m[0].length);
  }
  /* "총 10회" · "전체 10회" */
  if (!res.found.total && (m = raw.match(/(?:총|전체)\s*(\d{1,3})\s*회/))) {
    res.total = parseInt(m[1], 10);
    res.found.total = true;
    raw = cutText(raw, m.index, m[0].length);
  }

  /* ④ 나머지 기본 항목 */
  var t = ' ' + raw.replace(/[,/·|;\t\n]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';

  if ((m = t.match(/0?1[016789][-\s]?\d{3,4}[-\s]?\d{4}/))) {
    res.phone = m[0].replace(/\s/g, '-');
    res.found.phone = true;
    t = t.replace(m[0], ' ');
  }
  if ((m = t.match(/(\d{2,3})\s*분/))) {
    var mm = parseInt(m[1], 10);
    if (mm >= 10 && mm <= 240) {
      res.durationRaw = mm;
      res.duration = (mm <= 35 ? 25 : 55);
      res.found.duration = true;
    }
    t = t.replace(m[0], ' ');
  }
  if (!res.found.total && (m = t.match(/(\d{1,3})\s*(?:회권|회짜리|회분|회|번)/))) {
    n = parseInt(m[1], 10);
    if (n > 0 && n <= 200) { res.total = n; res.found.total = true; }
    t = t.replace(m[0], ' ');
  }
  if ((m = t.match(/(남성|남자|여성|여자)/))) {
    res.gender = (m[1].charAt(0) === '남' ? 'male' : 'female');
    res.found.gender = true;
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/\s(남|여)(?=\s)/))) {
    res.gender = (m[1] === '남' ? 'male' : 'female');
    res.found.gender = true;
    t = t.replace(' ' + m[1] + ' ', ' ');
  }
  if ((m = t.match(/\s(왕초보|입문|초급|중급|상급|프로)(?=\s)/))) {
    res.level = (m[1] === '왕초보' ? '입문' : m[1]);
    res.found.level = true;
    t = t.replace(' ' + m[1] + ' ', ' ');
  }

  var toks = t.replace(/\s+/g, ' ').trim().split(' ').filter(function(x){ return !!x; });
  var rest = [];
  toks.forEach(function(tok){
    var v = tok.replace(/[()\[\]{}"'`~!@#$%^&*+=?_<>:;,.\u3000]/g, '')
               .replace(/(님|씨|회원)$/, '').trim();
    if (!v) return;
    if (!res.name && /^[가-힣]{2,4}$/.test(v) && !isRegionWord(v) && !isLevelWord(v) && !isNameStopWord(v)) { res.name = v; res.found.name = true; return; }
    if (!res.name && /^[A-Za-z][A-Za-z .]{1,14}$/.test(v)) { res.name = v; res.found.name = true; return; }
    if (!res.region && isRegionWord(v)) { res.region = v; res.found.region = true; return; }
    rest.push(v);
  });

  if (!res.region) {
    for (var i = 0; i < rest.length; i++) {
      if (isRegionWord(rest[i])) { res.region = rest[i]; rest.splice(i, 1); res.found.region = true; break; }
    }
  }
  res.extra = rest.join(' ').trim();

  /* ⑤ 횟수 · 금액 정리 */
  if (!res.found.total && res.total <= 0) {
    if (res.found.rem) res.total = res.rem;
    else if (res.sessions > 0) res.total = res.sessions;
  }
  if (res.total > 0 && (res.rem <= 0 || res.rem > res.total)) res.rem = res.total;
  res.sessions = res.total || res.sessions;
  if (!res.found.price && res.perLesson > 0 && res.total > 0) {
    res.price = res.perLesson * res.total;
    res.found.price = true;
  }
  if (res.price > 0 && res.total > 0) res.perLesson = Math.round(res.price / res.total);
  return res;
}

/* 여러 줄(카톡·메모·엑셀 붙여넣기)을 한 명씩 파싱 */
function parseMemberLines(text){
  var out = [];
  String(text || '').split(/\r?\n/).forEach(function(line){
    var s = String(line).replace(/\t/g, ' ').replace(/\s+/g, ' ').trim();
    if (!s) return;
    s = s.replace(/^[-*•·]\s*/, '').replace(/^\d{1,2}[).]\s+/, '');
    if (!s) return;
    var p = parseMemberLine(s);
    p.line = s;
    if (!p.name && !p.total && !p.price && !p.extra) return;   /* 제목 줄·빈 줄은 버림 */
    out.push(p);
  });
  return out;
}

function parseSummary(p){
  var bits = [];
  bits.push(p.found.name ? p.name : '이름 ?');
  bits.push((p.found.duration ? durName(p.duration) : '55분(기본)') + (p.found.duration && p.durationRaw && p.durationRaw !== p.duration ? ' ← ' + p.durationRaw + '분' : ''));
  if (p.total > 0) bits.push(p.total + '회' + (p.rem > 0 && p.rem < p.total ? ' 중 잔여 ' + p.rem + '회' : ''));
  else bits.push('횟수 ?');
  if (p.found.gender) bits.push(p.gender === 'male' ? '남' : '여');
  if (p.found.region) bits.push(p.region);
  if (p.found.level) bits.push(p.level);
  if (p.price > 0) bits.push(money(p.price) + (p.perLesson > 0 ? ' · 회당 ' + money(p.perLesson) : ''));
  return bits.join(' · ');
}

  if (ui.tab === 'today') html = viewToday();
  else if (ui.tab === 'calendar') html = viewCalendar();
  else if (ui.tab === 'members') html = viewMembers();

      ICON[t[2]] + '<span>' + t[1] + '</span></button>';
  }).join('');

/* ---------- 토스트 ---------- */
var toastTimer = null;
function toast(msg, opt){
  var el = document.getElementById('toast');
  var ms = (opt && opt.ms) || 2400;
  if (opt && opt.act) {
    el.innerHTML = '<span class="ts-msg">' + esc(msg) + '</span>' +
      '<button class="ts-act" data-act="' + esc(opt.act) + '">' + esc(opt.label || '되돌리기') + '</button>';
    el.classList.add('act');
  } else {
    el.textContent = msg;
    el.classList.remove('act');
  }
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, ms);
}

/* ---------- 시트(바닥에서 올라오는 창) ---------- */
var sheetStack = [];
function openSheet(opts){
  var wrap = document.createElement('div');
  wrap.className = 'sheetwrap';
  var sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML =
    '<div class="grab"></div>' +
    '<div class="sh"><h3></h3><button class="iconbtn" data-act="sheet-close" aria-label="닫기">' + ICON.x + '</button></div>' +
    '<div class="sub" style="display:none"></div>' +
    '<div class="sb"></div>' +
    '<div class="sf" style="display:none"></div>';
  wrap.appendChild(sheet);
  sheet.querySelector('h3').textContent = opts.title || '';
  var subEl = sheet.querySelector('.sub');
  if (opts.sub) { subEl.innerHTML = opts.sub; subEl.style.display = ''; }
  var bodyEl = sheet.querySelector('.sb');
  var footEl = sheet.querySelector('.sf');
  if (opts.body !== undefined) bodyEl.innerHTML = opts.body;
  if (opts.footer) { footEl.innerHTML = opts.footer; footEl.style.display = ''; }
  document.getElementById('sheetRoot').appendChild(wrap);
  sheetStack.push(wrap);
  wrap.addEventListener('click', function(e){ if (e.target === wrap) requestSheetClose(wrap); });
  attachSheetGestures(wrap, sheet);
  return { el: wrap, sheet: sheet, body: bodyEl, footer: footEl, close: function(){ closeSheetEl(wrap); } };
}

/* 시트가 스스로 '지금 닫으면 안 되는 이유'를 말하게 한다 (한 줄 간편 입력에 적어 둔 글 보호).
   wrap.__guardClose 가 문장을 돌려주면 그대로 닫지 않고 한 번 더 물어봅니다. */
function sheetCloseGuard(wrap){
  if (!wrap || typeof wrap.__guardClose !== 'function') return '';
  try { return wrap.__guardClose() || ''; } catch(e){ return ''; }
}
function requestSheetClose(wrap){
  var msg = sheetCloseGuard(wrap);
  if (!msg) { closeSheetEl(wrap); return; }
  askDiscardClose(wrap, msg);
}

var discardTarget = null;
var discardConfirm = null;   /* 확인 시트 그 자체 (Esc·바깥 탭으로 닫히면 대기 상태도 풀기) */
/* 확인 시트의 두 갈래 — 계속 작성 / 그래도 닫기 */
function discardStay(){
  discardTarget = null;
}
function discardAndClose(confirmWrap){
  var target = discardTarget;
  discardTarget = null;
  if (confirmWrap) closeSheetEl(confirmWrap);
  if (target) closeSheetEl(target);
}
/* 적어 둔 글을 지우고 닫을지 한 번만 물어보는 작은 시트 */
function askDiscardClose(wrap, msg){
  if (discardTarget) return;
  discardTarget = wrap;
  var sh = openSheet({
    title: '작성 중인 내용이 있어요',
    sub: '닫으면 방금 적어 둔 내용이 사라져요.',
    body: '<div class="formnote">' + msg + '</div>',
    footer: '<div style="display:flex;gap:8px">' +
      '<button class="btn btn-ghost" style="flex:0 0 44%" data-act="discard-stay">계속 작성</button>' +
      '<button class="btn btn-danger" style="flex:1" data-act="discard-close">그래도 닫기</button></div>'
  });
  discardConfirm = sh.el;
}

function closeSheetEl(wrap){
  if (!wrap) return;
  if (wrap === discardConfirm){       /* 확인 시트가 다른 경로(Esc·바깥 탭)로 닫혀도 안내 대기 해제 */
    discardConfirm = null;
    discardTarget = null;
  }
  var i = sheetStack.indexOf(wrap);
  if (i >= 0) sheetStack.splice(i, 1);
  if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
  if (memberCtx && memberCtx.sh && memberCtx.sh.el === wrap) { stopVoice(); memberCtx = null; }
  if (settleCtx && settleCtx.sh && settleCtx.sh.el === wrap) settleCtx = null;
  if (addCtx && addCtx.sh && addCtx.sh.el === wrap) { if (voice.kind === 'am') vrStop(); addCtx = null; }
  if (tmCtx && tmCtx.sh && tmCtx.sh.el === wrap) { if (voice.kind === 'tm') vrStop(); tmCtx = null; }
  if (bookCtx && bookCtx.sh && bookCtx.sh.el === wrap) bookCtx = null;
  if (pkgCtx && pkgCtx.sh && pkgCtx.sh.el === wrap) pkgCtx = null;
  if (qaCtx && qaCtx.sh && qaCtx.sh.el === wrap) { stopQaVoice(); qaCtx = null; }
  if (priceCtx && priceCtx.sh && priceCtx.sh.el === wrap) priceCtx = null;
  if (renewCtx && renewCtx.sh && renewCtx.sh.el === wrap) renewCtx = null;
  if (pickCtx && pickCtx.sh && pickCtx.sh.el === wrap) pickCtx = null;
  if (dpCtx && dpCtx.sh && dpCtx.sh.el === wrap) dpCtx = null;
  if (tpCtx && tpCtx.sh && tpCtx.sh.el === wrap) tpCtx = null;
}
function closeTopSheet(){
  if (!sheetStack.length) return;
  /* Esc 도 X·바깥 탭과 같이, 적어 둔 글이 있으면 한 번 더 물어봅니다 */
  requestSheetClose(sheetStack[sheetStack.length - 1]);
}
function closeAllSheets(){
  sheetStack.slice().forEach(closeSheetEl);
}

/* =========================================================
   시트 제스처 — 아래로 밀어 닫기 + 아이폰 사파리 '당겨서 새로고침' 막기

   · 손잡이(grab)나 제목줄, 맨 아래 버튼 줄을 잡고 아래로 끌면 — 또는 내용이
     맨 위(scrollTop <= 0)일 때 본문을 끌면 — 시트가 손가락을 따라 내려옵니다.   · 76px 넘게 내리거나 짧게 튕겨서(v >= 0.5px/ms, 28px 이상) 놓으면
     그 시트 하나만 닫혀 바로 아래 화면(이전 시트 또는 원래 탭)으로 돌아갑니다.
     모자라면 제자리로 부드럽게 돌아갑니다.
   · 끌어내리는 동안 touchmove 를 preventDefault 해서 사파리가 이 동작을
     '당겨서 새로고침'(페이지 전체 다시 열기)으로 받아채지 못하게 합니다.
     위로 스크롤하거나 내용 중간에서 끌 때는 손대지 않아 스크롤이 그대로 부드럽습니다.
   ========================================================= */
var SHEET_DISMISS_PX = 76;      /* 이만큼 내리면 닫힘 */
var SHEET_FLICK_DY = 28;        /* 튕겨서 닫을 때 최소 이동 거리 */
var SHEET_FLICK_V = 0.5;        /* px/ms — 이보다 빠르면 짧게 튕겨도 닫힘 */
var SHEET_DIM = 'rgba(9,13,18,.4)';

function attachSheetGestures(wrap, sheet){
  var head = sheet.querySelector('.sh');
  var grab = sheet.querySelector('.grab');
  var body = sheet.querySelector('.sb');
  var st = null;   /* 지금 손가락 하나를 따라가는 중인 제스처 */

  function isTop(){
    return sheetStack.length > 0 && sheetStack[sheetStack.length - 1] === wrap;
  }
  function inHead(t){
    if (!t) return false;
    if (grab && t === grab) return true;
    if (head && t === head) return true;
    if (grab && grab.contains && grab.contains(t)) return true;
    if (head && head.contains && head.contains(t)) return true;
    return false;
  }
  function inField(t){
    return !!t && typeof t.closest === 'function' && !!t.closest('input,textarea,select,option');
  }
  /* 입력칸 자체가 스크롤할 수 있는지 — 여러 줄을 적어 넘치는 textarea 는
     손가락을 따라 안에서 스크롤해야 하므로 시트 닫기·새로고침 방해에서 빼야 한다 */
  function fieldEl(t){
    return (t && typeof t.closest === 'function') ? t.closest('textarea,input,select') : null;
  }
  function fieldCanScroll(el, dy){
    if (!el) return false;
    var sh = el.scrollHeight || 0, ch = el.clientHeight || 0;
    if (sh <= ch + 1) return false;                 /* 넘치는 내용이 없음 */
    if (dy > 0) return el.scrollTop > 0;            /* 손가락을 내림 = 위쪽 내용 보기 */
    return el.scrollTop + ch < sh - 1;              /* 손가락을 올림 = 아래쪽 내용 보기 */
  }
  function atTop(){ return !body || body.scrollTop <= 0; }
  function inBody(t){ return !!t && !!body && (t === body || (body.contains && body.contains(t))); }

  /* 손가락을 따라 내려온 만큼 시트를 옮기고, 뒤 어둠은 조금씩 옅게 */
  function paint(ty){
    if (ty < 0) ty = 0;
    var damped = ty <= 140 ? ty : 140 + (ty - 140) * 0.35;   /* 140px 부터는 저항 */
    sheet.style.transform = 'translateY(' + Math.round(damped) + 'px)';
    wrap.style.background = 'rgba(9,13,18,' + (0.4 * (1 - Math.min(damped / 340, 0.9))).toFixed(3) + ')';
  }

  function snapBack(){
    sheet.style.transition = 'transform .26s cubic-bezier(.2,.9,.2,1)';
    wrap.style.transition = 'background-color .26s linear';
    sheet.style.transform = 'translateY(0)';
    wrap.style.background = SHEET_DIM;
  }

  /* 이 시트 하나만 아래로 흘려보내고 스택에서 뺌 → 이전 시트/탭이 그대로 드러남 */
  function dismissOut(){
    /* 적어 둔 글이 있으면 흘러내리지 않고 제자리로 돌아온 뒤 한 번 물어봅니다 */
    var guard = sheetCloseGuard(wrap);
    if (guard) { snapBack(); askDiscardClose(wrap, guard); return; }
    wrap.classList.add('closing');
    sheet.style.transition = 'transform .2s cubic-bezier(.4,0,1,1)';
    wrap.style.transition = 'background-color .2s linear';
    sheet.style.transform = 'translateY(100%)';
    wrap.style.background = 'rgba(9,13,18,0)';
    var w = wrap;
    setTimeout(function(){ closeSheetEl(w); }, 200);
  }

  function down(e){
    if (!isTop() || !e.touches || e.touches.length !== 1) { st = null; return; }
    var p = e.touches[0];
    var now = e.timeStamp || Date.now();
    st = {
      x0: p.clientX, y0: p.clientY,
      t0: now, t1: now,
      head: inHead(e.target), field: inField(e.target), fieldEl: fieldEl(e.target),
      backdrop: e.target === wrap,
      dy: 0, dragging: false, locked: false, blockPTR: false
    };
    sheet.style.animation = 'none';
    sheet.style.transition = 'none';
    wrap.style.transition = 'none';
  }

  function move(e){
    if (!st || !e.touches || e.touches.length !== 1) return;
    var p = e.touches[0];
    var dy = p.clientY - st.y0;
    var dx = p.clientX - st.x0;
    st.t1 = e.timeStamp || Date.now();

    if (st.locked){
      /* 입력칸에서 시작한 끌기 — 시트는 안 움직이고 새로고침만 막음 */
      if (st.blockPTR && e.cancelable !== false && e.preventDefault) e.preventDefault();
      return;
    }

    if (!st.dragging){
      if (Math.abs(dy) < 5 && Math.abs(dx) < 5) return;          /* 손떨림은 그냥 둠 */
      if (Math.abs(dx) > Math.abs(dy)) { st.locked = true; return; }   /* 가로 → 그냥 둠 */
      if (dy <= 0) { st.locked = true; return; }                 /* 위로 → 그냥 스크롤 */
      if (!st.head && inBody(e.target) && !atTop()) { st.locked = true; return; }  /* 내용 중간 → 그냥 스크롤 */
      if (st.field){                                             /* 입력칸 → 시트는 안 움직임 */
        st.locked = true;
        /* 안에서 스크롤할 여지가 있으면 그대로 두고(부드러운 스크롤),
           위쪽 끝에서 더 내리는 동작만 사파리 '당겨서 새로고침'으로 새지 않게 막는다 */
        if (dy < 0 || fieldCanScroll(st.fieldEl, dy)) return;
        st.blockPTR = true;
        if (e.cancelable !== false && e.preventDefault) e.preventDefault();
        return;
      }
      if (st.backdrop){                                          /* 바깥 여백 → 끌지 않고 새로고침만 막음 */
        st.locked = true; st.blockPTR = true;
        if (e.cancelable !== false && e.preventDefault) e.preventDefault();
        return;
      }
      st.dragging = true;                                       /* 여기서부터 시트가 따라 내려옴 */
    }

    if (e.cancelable !== false && e.preventDefault) e.preventDefault();   /* 사파리 당겨서 새로고침 차단 */
    st.dy = dy;
    paint(dy);
  }

  function up(e){
    if (!st) return;
    var s = st;
    st = null;
    if (e && e.changedTouches && e.changedTouches.length === 1){
      s.dy = e.changedTouches[0].clientY - s.y0;
      s.t1 = e.timeStamp || s.t1;
    }
    if (!s.dragging) return;
    var dt = s.t1 - s.t0;
    var v = dt >= 8 ? s.dy / dt : 0;    /* 한 프레임 안에 잰 값은 속도로 치지 않음 */
    if (s.dy >= SHEET_DISMISS_PX || (s.dy >= SHEET_FLICK_DY && v >= SHEET_FLICK_V)) dismissOut();
    else snapBack();
  }

  function cancel(){
    if (!st) return;
    var s = st;
    st = null;
    if (s.dragging) snapBack();
  }

  wrap.addEventListener('touchstart', down, { passive: true });
  wrap.addEventListener('touchmove', move, { passive: false });   /* preventDefault 를 위해 필수 */
  wrap.addEventListener('touchend', up);
  wrap.addEventListener('touchcancel', cancel);
}
function findSession(id){
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].id === id) return state.sessions[i];
  return null;
}
function timeOfISO(x){ return String(x || '').slice(11, 16); }

var pickCtx = null;
var PICK_META = {
  bkMember: { title:'회원', sub:'이름 옆에 남은 횟수를 같이 보여드려요.' },
  bkPkg:    { title:'차감할 수강권', sub:'예약해 두고, 정산에서 차감될 때 이 수강권을 씁니다.' },
  qaMember: { title:'회원', sub:'목록에 없으면 맨 아래에서 새 회원으로 추가할 수 있어요.' },
  mfLevel:  { title:'레벨', sub:'회원 목록에 함께 표시돼요.' },
  mSort:    { title:'회원 정렬', sub:'회원 목록을 어떤 순서로 볼지 골라 주세요.' },
  mfMonths: { title:'유효기간', sub:'시작일부터 이 기간이 지나면 만료로 표시돼요.' },
  pkMonths: { title:'유효기간', sub:'시작일부터 이 기간이 지나면 만료로 표시돼요.' },

  hourFrom: { title:'가장 이른 시작 시간', sub:'레슨 시작 시간 칩의 첫 칸이에요. 보통 첫 레슨을 시작하는 시각으로 두면 돼요.' },
  hourTo:   { title:'가장 늦은 시작 시간', sub:'레슨 시작 시간 칩의 마지막 칸이에요. 저녁 마지막 레슨을 시작하는 시각까지 열어 둘 수 있어요.' }
};

function pickOptHTML(o, inField){
  return '<b>' + esc(o.label) + '</b>' + (o.sub && !inField ? '<span class="sub">' + esc(o.sub) + '</span>' : '');
}

function pickFieldHTML(id, opts, value){
  pickerFields[id] = opts || [];
  var cur = null;
  for (var i = 0; i < pickerFields[id].length; i++) if (String(pickerFields[id][i].v) === String(value)) cur = pickerFields[id][i];
  return '<button class="input pickfield" id="' + id + 'Btn" data-act="pick" data-field="' + id + '" type="button">' +
      '<span class="pv" id="' + id + 'Lbl">' + (cur ? pickOptHTML(cur, true) : '<span class="ph">골라주세요</span>') + '</span>' +
      '<span class="pchev">' + ICON.chevD + '</span></button>' +
    '<input type="hidden" id="' + id + '" value="' + esc(value === undefined || value === null ? '' : value) + '">';
}

function syncPickLabel(id){
  var lbl = document.getElementById(id + 'Lbl');
  var hidden = document.getElementById(id);
  if (!lbl) return;
  if (!hidden) { lbl.innerHTML = '<span class="ph">골라주세요</span>'; return; }
  var opts = pickerFields[id] || [], cur = null;
  for (var i = 0; i < opts.length; i++) if (String(opts[i].v) === String(hidden.value)) cur = opts[i];
  lbl.innerHTML = cur ? pickOptHTML(cur, true) : '<span class="ph">골라주세요</span>';
}

function setPickOptions(id, opts, value){
  pickerFields[id] = opts || [];
  var hidden = document.getElementById(id);
  if (hidden && value !== undefined) hidden.value = value;
  syncPickLabel(id);
}

function openPick(fieldId){
  var opts = pickerFields[fieldId] || [];
  var meta = PICK_META[fieldId] || { title:'골라주세요', sub:'' };
  var hidden = document.getElementById(fieldId);
  var curVal = hidden ? hidden.value : '';
  var sh = openSheet({ title: meta.title, sub: meta.sub });
  pickCtx = { sh: sh, field: fieldId, opts: opts, value: curVal };
  paintPick();
}

function paintPick(){
  if (!pickCtx) return;
  var o = pickCtx.opts;
  pickCtx.sh.body.innerHTML = o.length
    ? '<div class="pklist">' + o.map(function(x){
        var on = String(x.v) === String(pickCtx.value);
        return '<button class="pkopt' + (on ? ' on' : '') + '" data-act="pick-set" data-v="' + esc(x.v) + '">' +
          '<span class="pt">' + pickOptHTML(x) + '</span>' +
          '<span class="pc">' + ICON.check + '</span>' +
        '</button>';
      }).join('') + '</div>'
    : '<div class="pkempty">고를 수 있는 항목이 없어요</div>';
}

function applyPick(fieldId, value){
  var hidden = document.getElementById(fieldId);
  if (hidden) hidden.value = value;
  syncPickLabel(fieldId);
  if (fieldId === 'mSort') {
    state.memberSort = value;
    save();
    render(true);
    toast('회원 목록 · ' + memberSortLabel(value));
    return;
  }
  if (fieldId === 'hourFrom' || fieldId === 'hourTo') {
    var r = dayRange();
    if (fieldId === 'hourFrom') r.from = +value; else r.to = +value;
    if (r.from < FROM_MIN || r.from > FROM_MAX) r.from = dayFromMin();
    if (r.to < TO_MIN || r.to > TO_MAX) r.to = dayToMin();
    state.hours = { fromMin: r.from, toMin: r.to };
    save();
    syncHourRows();
    toast('레슨 시간 범위 · ' + dayRangeLabel());
    return;
  }
  if (fieldId === 'bkMember') {
    if (bookCtx) bookCtx.memberId = value;
    if (bookCtx && bookCtx.mode !== 'sep') refreshBkPkgs(); else validateBook();
  }
  else if (fieldId === 'bkPkg') validateBook();
  else if (fieldId === 'qaMember') {
    if (qaCtx) qaCtx.memberId = value === '__new__' ? '' : value;
    validateQuick();
  }
}

/* ---------- 날짜 · 시간 필드 (앱 안 달력 / 시간 칩) ---------- */
var dpCtx = null, tpCtx = null;

function dateFieldLabel(v, short){
  if (!v) return '';
  if (short) return fmtShort(v);
  var d = parseISO(v);
  return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate() + ' (' + WEEK[d.getDay()] + ')';
}

function dateFieldHTML(id, value, short, cls){
  return '<button class="input pickfield' + (cls ? ' ' + cls : '') + '" type="button" data-act="datepick" data-field="' + id + '">' +
      '<span class="pv" id="' + id + 'Lbl">' + (value ? esc(dateFieldLabel(value, short)) : '<span class="ph">날짜를 골라주세요</span>') + '</span>' +
      '<span class="pchev">' + ICON.cal + '</span></button>' +
    '<input type="hidden" id="' + id + '" value="' + esc(value || '') + '">';
}

function timeFieldHTML(id, value){
  return '<button class="input pickfield" type="button" data-act="timepick" data-field="' + id + '">' +
      '<span class="pv" id="' + id + 'Lbl">' + (value ? esc(value) : '<span class="ph">시간을 골라주세요</span>') + '</span>' +
      '<span class="pchev">' + ICON.clock + '</span></button>' +
    '<input type="hidden" id="' + id + '" value="' + esc(value || '') + '">';
}

function syncDateLabel(id){
  var el = document.getElementById(id + 'Lbl'), h = document.getElementById(id);
  if (!el) return;
  var v = h ? h.value : '';
  el.innerHTML = v ? esc(dateFieldLabel(v, id === 'noteDate')) : '<span class="ph">날짜를 골라주세요</span>';
}

function syncTimeLabel(id){
  var el = document.getElementById(id + 'Lbl'), h = document.getElementById(id);
  if (!el) return;
  var v = h ? h.value : '';
  el.innerHTML = v ? esc(v) : '<span class="ph">시간을 골라주세요</span>';
}

function applyDate(field, v){
  var h = document.getElementById(field);
  if (h) h.value = v;
  syncDateLabel(field);
  if (field === 'bkDate') validateBook();
  else if (field === 'qaDate') validateQuick();
  else if (field === 'noteDate') {
    if (memberCtx) memberCtx.noteDate = v;
  }
}

function applyTime(field, v){
  var h = document.getElementById(field);
  if (h) h.value = v;
  syncTimeLabel(field);
  if (field === 'bkTime') validateBook();
  else if (field === 'qaTime') validateQuick();
}

function openDatePick(field){
  var h = document.getElementById(field);
  var cur = (h && h.value) || todayISO();
  var sh = openSheet({ title:'날짜', sub:'달력에서 날짜를 누르면 바로 정해져요.' });
  dpCtx = { sh: sh, field: field, ym: cur.slice(0, 7), value: cur };
  paintDatePick();
}

function paintDatePick(){
  if (!dpCtx) return;
  var y = +(dpCtx.ym.slice(0, 4)), mo = +(dpCtx.ym.slice(5, 7));
  var first = new Date(y, mo - 1, 1).getDay();
  var last = new Date(y, mo, 0).getDate();
  var cells = '';
  for (var i = 0; i < first; i++) cells += '<span class="day out"></span>';
  for (var day = 1; day <= last; day++) {
    var ds = dpCtx.ym + '-' + pad(day);
    var dow = new Date(y, mo - 1, day).getDay();
    var cls = 'day' + (dow === 0 ? ' sun' : (dow === 6 ? ' sat' : '')) +
      (ds === todayISO() ? ' today' : '') + (ds === dpCtx.value ? ' sel' : '');
    cells += '<button class="' + cls + '" data-act="dpday" data-date="' + ds + '">' + day + '</button>';
  }
  dpCtx.sh.body.innerHTML =
    '<div class="monhdr"><div class="m">' + monthLabel(dpCtx.ym) + '</div><div class="navs">' +
      '<button class="iconbtn" data-act="dpmon" data-delta="-1" aria-label="이전 달">' + ICON.back + '</button>' +
      '<button class="iconbtn" data-act="dpmon" data-delta="1" aria-label="다음 달" style="transform:rotate(180deg)">' + ICON.back + '</button>' +
    '</div></div>' +
    '<div class="cal dpcal"><div class="wk">' + WEEK.map(function(w){ return '<div>' + w + '</div>'; }).join('') + '</div>' +
      '<div class="grid">' + cells + '</div></div>' +
    '<div class="crow mt10" style="margin-top:12px"><button class="btn btn-outline btn-block" data-act="dp-today">오늘로</button></div>' +
    '<div class="hint">날짜를 누르면 정해지고 창이 닫혀요.</div>';
}

function openTimePick(field){
  var h = document.getElementById(field);
  var cur = (h && h.value) || defaultTime();
  var sh = openSheet({ title:'시작 시간',
    sub:'30분 단위로 고를 수 있어요.<span class="subnote">현재 ' + dayRangeLabel() +
        ' · 시간 범위는 <b>설정</b> 탭에서 바꿀 수 있어요</span>' });
  tpCtx = { sh: sh, field: field, value: cur };
  paintTimePick();
}

function paintTimePick(){
  if (!tpCtx) return;
  var list = daySlots();
  if (tpCtx.value && list.indexOf(tpCtx.value) < 0) list.unshift(tpCtx.value);
  tpCtx.sh.body.innerHTML = '<div class="tslotwrap">' + list.map(function(t){
    return '<button class="tslot' + (t === tpCtx.value ? ' on' : '') + '" data-act="tpick" data-v="' + t + '">' + t + '</button>';
  }).join('') + '</div>';
}

/* =========================================================
   오늘 탭
   ========================================================= */
function viewToday(){
  var t = todayISO(), list = sessionsByDate(t);
  var mins = sum(list, function(s){ return s.durationMinutes; });
  var dsep = list.filter(isSep).length;
  var dp = list.filter(function(s){ return !isSep(s); });
  var d25 = dp.filter(function(s){ return s.durationMinutes === 25; }).length;
  var d55 = dp.length - d25;
  var und = list.filter(function(s){ return s.status === 'scheduled'; }).length;
  var settled = settlementFor(t);

  var h = '<div class="hero">' +
    '<div class="k">' + fmtLong(t) + '</div>' +
    '<div class="big">오늘 레슨 ' + list.length + '건</div>' +
    '<div class="row">' +
      (list.length
        ? '<span class="pillstat">' + hms(mins) + '</span>' +
          (d55 ? '<span class="pillstat">55분 ' + d55 + '</span>' : '') +
          (d25 ? '<span class="pillstat">25분 ' + d25 + '</span>' : '') +
          (dsep ? '<span class="pillstat">⛳ 별도 ' + dsep + '</span>' : '') +
          '<span class="pillstat">' + (und ? '예정 ' + und + '건' : '전원 확인') + '</span>'
        : '<span class="pillstat">레슨 없음</span>') +
    '</div>' +
    /* 빈 날에는 정산 대신, 가장 하고 싶은 일(레슨 잡기)을 바로 누를 수 있게 */
    (list.length
      ? '<button class="herobtn" data-act="settle-open">' +
          '<span>' + (settled ? '마감 정산 수정하기' : '오늘 레슨 마감 정산하기') +
            '<span class="hb-sub">' + (settled
              ? '차감 ' + settled.deducted + '회 반영 · ' + timeOfISO(settled.settledAt) + ' 정산'
              : '완료 · 당일취소 · 노쇼를 한 번에 차감 처리') + '</span></span>' +
          '<span class="hb-go">' + ICON.chev + '</span>' +
        '</button>'
      : '<button class="herobtn" data-act="quick-add">' +
          '<span>+ 오늘 레슨 잡기' +
            '<span class="hb-sub">한 줄로 적으면 날짜 · 시간 · 회원이 알아서 채워져요</span></span>' +
          '<span class="hb-go">' + ICON.chev + '</span>' +
        '</button>') +
  '</div>';

  /* 아직 회원이 없는 새 프로 — 1탭으로 첫 회원 추가 */
  if (!state.members.length) {
    h += '<div class="card mt10" id="firstMemberCard">' +
      '<div style="font-size:14.5px;font-weight:800;letter-spacing:-.3px">첫 회원을 추가해 볼까요?</div>' +
      '<div class="hint" style="margin-top:3px">한 줄로 <b>이름 · 수강권</b>만 적어도 되고, 명단을 통째로 붙여넣으면 한 번에 등록해요.</div>' +
      '<button class="btn btn-primary btn-block" data-act="member-add" style="margin-top:12px">+ 회원 추가</button>' +
    '</div>';
  }

  /* 알림 */
  var low = [], exp = [];
  state.members.forEach(function(m){
    var tr = totalRemaining(m.id);
    if (tr > 0 && tr <= LOW_LIMIT) low.push({ m: m, rem: tr });
  });
  low.sort(function(a, b){ return a.rem - b.rem; });
  state.packages.forEach(function(p){
    if (p.remainingSessions > 0 && p.expiryDate < addDays(t, 21)) {
      exp.push(memberName(p.memberId) + ' ' + fmtDot(p.expiryDate) + ' 만료');
    }
  });
  if (low.length) {
    h += '<div class="golden">' +
      '<div class="golden-hd"><span class="gh-ic">' + ICON.flag + '</span>재등록 골든타임' +
        '<span class="gh-n">잔여 ' + LOW_LIMIT + '회 이하 ' + low.length + '명</span></div>' +
      '<div class="golden-sub">수업이 끊기기 전에 지금 연장하세요</div>' +
      low.slice(0, 4).map(function(x){
        return '<button class="golden-row" data-act="renew-open" data-id="' + x.m.id + '">' +
          '<span class="golden-n">' + esc(x.m.name) + '</span>' +
          '<span class="golden-r">잔여 ' + x.rem + '회</span>' +
          '<span class="golden-go">연장' + ICON.chev + '</span></button>';
      }).join('') +
      (low.length > 4 ? '<div class="golden-more">회원 탭에서 ' + (low.length - 4) + '명 더 볼 수 있어요</div>' : '') +
      '</div>';
  }
  if (exp.length) {
    h += '<div class="alert blue"><span class="ai">' + ICON.flag + '</span><div>' +
      '<div class="at">만료 예정 수강권</div><div class="ad">' + esc(exp.join(' · ')) + '</div></div></div>';
  }

  h += '<div class="sec"><h2>오늘 시간표</h2><span class="aside">' + (list.length ? '시간순' : '비어 있음') + '</span></div>';
  if (!list.length) {
    h += '<div class="empty"><div class="et">오늘은 예약이 없어요</div><div class="ed">한 줄로 적으면 오늘 레슨이 바로 잡혀요.</div>' +
      '<button class="btn btn-primary btn-block" data-act="quick-add" style="margin-top:12px">+ 오늘 레슨 잡기</button></div>';
  } else {
    h += list.map(lessonCard).join('');
  }

  if (settled) {
    h += '<div class="card mt10">' +
      '<div class="nameline"><span class="name" style="font-size:14px">오늘 정산 완료</span>' +
        '<span class="st st-completed">' + timeOfISO(settled.settledAt) + ' 마감</span></div>' +
      '<div class="chiprow mt10">' +
        '<span class="legend"><span class="lg">완료 ' + (settled.counts.completed || 0) + '</span>' +
        '<span class="lg">당일취소 ' + (settled.counts.same_day_cancel || 0) + '</span>' +
        '<span class="lg">노쇼 ' + (settled.counts.no_show || 0) + '</span>' +
        '<span class="lg">일반취소 ' + (settled.counts.excused_cancel || 0) + '</span>' +
        '<span class="lg">보강 ' + (settled.counts.makeup || 0) + '</span>' +
        (settled.sepCount ? '<span class="lg">별도 결제 ' + settled.sepCount + '</span>' : '') + '</span>' +
      '</div>' +
      '<div class="hint">차감 ' + settled.deducted + '회가 잔여 횟수에 반영됐어요. 잘못 찍었으면 위 버튼으로 다시 정산하세요. 차이는 자동으로 맞춰져요.</div>' +
    '</div>';
  }

  /* 정산 기준은 실제로 정산할 레슨이 남아 있을 때만 — 빈 날·정산 끝난 날에는 화면만 길어짐 */
  if (list.length && !settled) {
    h += '<div class="sguide">' +
    '<div class="sguide-hd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.4"/><circle cx="12" cy="8.1" r=".9" fill="currentColor" stroke="none"/></svg>' +
      '<h2 class="t">정산 기준</h2></div>' +
    '<div class="sguide-row"><span class="sguide-badge ded">1회 차감</span>' +
      '<span class="sguide-items">완료<span class="sep">·</span>당일취소<span class="sep">·</span>노쇼</span></div>' +
    '<div class="sguide-row"><span class="sguide-badge keep">미차감</span>' +
      '<span class="sguide-items">일반취소<span class="sep">·</span>보강</span></div>' +
    '<div class="sguide-row"><span class="sguide-badge sep">별도 결제</span>' +
      '<span class="sguide-items">⛳ 필드<span class="sep">·</span>🎯 숏게임<span class="sep">·</span>💡 원포인트 — 수강권 미차감</span></div>' +
    '<div class="sguide-note">하루가 끝나면 마감 정산에서 한 번에 확정해요.</div>' +
  '</div>';
  }

  return h;
}

function lessonCard(s){
  var sep = isSep(s);
  var m = s.memberId ? memberById(s.memberId) : null, pkg = sep ? null : pkgById(s.packageId);
  var st = STATUS[s.status] || STATUS.scheduled;
  var rem = pkg ? pkg.remainingSessions : 0, tot = pkg ? pkg.totalSessions : 0;
  var pct = tot ? Math.round(rem / tot * 100) : 0;
  var memo = s.memo ? ' · ' + esc(s.memo) : '';
  var actions;
  if (s.status === 'scheduled') {
    actions = '<button class="btn btn-sm btn-primary" data-act="status-set" data-sid="' + s.id + '" data-status="completed">완료</button>' +
              '<button class="btn btn-sm btn-outline" data-act="status-sheet" data-sid="' + s.id + '">취소·노쇼</button>';
  } else {
    actions = '<button class="btn btn-sm btn-outline" data-act="status-sheet" data-sid="' + s.id + '">상태 변경</button>';
  }
  var nameline = sep
    ? '<span class="lkind lk-' + sepKind(s) + '">' + sepBadge(s) + '</span>' +
      (s.memberId
        ? '<button class="name" data-act="member-open" data-id="' + s.memberId + '">' + esc(m ? m.name : '-') + '</button>'
        : '<span class="name">' + esc(s.guestName || '비회원') + '</span><span class="guestpill">비회원</span>')
    : '<button class="name" data-act="member-open" data-id="' + s.memberId + '">' + esc(m ? m.name : '-') + '</button>';
  var metaline = sep
    ? '별도 결제 <b>' + sepFeeLine(s) + '</b> · ' + sepKindLabel(s) +
      (s.location ? ' · ' + esc(s.location) : '') + memo
    : (pkg ? durName(pkg.durationMinutes) + ' 수강권 · 잔여 <b>' + rem + '</b>/' + tot + '회' : '수강권 없음') +
      (s.location ? ' · ' + esc(s.location) : '') + memo;
  return '<div class="card lesson-card"><div class="lesson">' +
    '<div class="timecol"><div class="t">' + s.startTime + '</div><div class="d">' + s.durationMinutes + '분</div></div>' +
    '<div class="body">' +
      '<div class="nameline">' + nameline +
        '<span class="st st-' + st.cls + '">' + st.label + '</span>' +
        /* 수정은 상태 시트를 거치지 않고 바로 — 이름줄 오른쪽 끝에서 한 번에 닿습니다 */
        '<button class="btn btn-sm btn-ghost tedit" data-act="lesson-edit" data-sid="' + s.id + '" aria-label="' + esc(sessionName(s)) + ' 레슨 수정">수정</button>' +
      '</div>' +
      '<div class="meta">' + metaline + '</div>' +
      (sep ? '' : '<div class="bar"><i class="' + (rem <= LOW_LIMIT ? 'low' : '') + '" style="width:' + pct + '%"></i></div>') +
      '<div class="chiprow mt10 acts">' + actions +
        '<button class="btn btn-sm btn-ghost" data-act="note-open" data-sid="' + s.id + '" aria-label="' + esc(sessionName(s)) + ' 수업 메모">수업 메모</button>' +
        (s.memberId ? '<button class="btn btn-sm btn-ghost" data-act="tm-open" data-sid="' + s.id + '">레슨 차트</button>' : '') +
      '</div>' +
    '</div></div></div>';
}

/* =========================================================
   레슨 상태 변경
   ========================================================= */
/* 상태 배지: 4글자 상태(당일취소·일반취소)는 두 줄로 나눠 네모 안에 꼭 맞춘다 */
function statusBadge(label){
  if (!label || label.length <= 2) return esc(label);
  var mid = Math.ceil(label.length / 2);
  return esc(label.slice(0, mid)) + '<br>' + esc(label.slice(mid));
}

function openStatusSheet(sid){
  var s = findSession(sid);
  if (!s) return;
  var sep = isSep(s);
  var m = s.memberId ? memberById(s.memberId) : null, pkg = sep ? null : pkgById(s.packageId);
  var who = (sep ? '<span class="lkind lk-' + sepKind(s) + '">' + sepBadge(s) + '</span> ' : '') +
    '<b>' + esc(sessionName(s)) + '</b>' + (s.memberId ? '' : ' <span class="guestpill">비회원</span>');
  var body = '<div class="formnote">' + who + ' · ' + fmtShort(s.date) + ' ' + s.startTime +
    ' · ' + s.durationMinutes + '분' + (s.location ? ' · ' + esc(s.location) : '') +
    (sep ? ' · 별도 결제 ' + sepFeeLine(s) + ' · 수강권 미차감'
         : (pkg ? ' · 잔여 ' + pkg.remainingSessions + '/' + pkg.totalSessions + '회' : '')) + '</div>';
  if (sep) {
    body += '<div class="field"><label>별도 레슨비 (원)</label>' +
      '<div class="crow" style="margin-top:0">' +
        '<input class="input" id="sepFee" inputmode="numeric" value="' + (sepFee(s) || '') + '" placeholder="예: 150000">' +
        '<button class="btn btn-primary" data-act="sep-fee-save" data-sid="' + s.id + '" style="flex:none;height:45px;padding:0 15px">저장</button>' +
      '</div><div class="hint">저장하면 이 달 <b>별도 결제 수입</b>에 바로 반영돼요. 비워 두면 수입에서 빠져요.</div></div>';
  }
  /* 상태 5가지 — 예전에는 한 줄씩 쌓아 자리를 많이 차지해서,
     절반 높이의 2열 타일(점 + 이름 + 차감 표시)로 바꿨습니다. 누르는 높이는 46px 유지 */
  body += '<div class="statusgrid' + (sep ? ' n4' : '') + '">' + statusKeysFor(s).map(function(k){
    var on = s.status === k;
    var tag = sep ? (CHARGED[k] ? '수입 포함' : '수입 없음') : (STATUS[k].deducted ? '차감' : '미차감');
    var desc = sep ? SEP_STATUS_DESC[k] : STATUS[k].desc;
    return '<button class="stopt stopt-' + k + (on ? ' on' : '') + '" data-act="status-set" data-sid="' + s.id +
        '" data-status="' + k + '" aria-label="' + esc(STATUS[k].label + ' · ' + desc) + '">' +
      '<span class="so-dot" aria-hidden="true"></span>' +
      '<span class="so-t">' + STATUS[k].label + '</span>' +
      '<span class="so-k">' + tag + '</span>' +
    '</button>';
  }).join('') + '</div>' +
    '<div class="hint stophint">' + (sep
      ? '별도 결제 레슨은 수강권 횟수를 건드리지 않고, <b>완료 · 당일취소 · 노쇼</b>만 수입에 잡혀요.'
      : '<b>완료 · 당일취소 · 노쇼</b>는 횟수를 차감하고, <b>일반취소 · 보강</b>은 차감하지 않아요. 일반취소는 일정에서도 지워져요.') + '</div>';
  var sh = openSheet({
    title: sep ? sepKindLabel(s) + ' · 별도 결제' : '레슨 상태',
    sub: sep ? '필드 · 숏게임 · 원포인트 레슨은 수강권 횟수를 건드리지 않고, 별도 결제 수입만 정산해요.'
             : '잔여 횟수는 상태 변경에 맞춰 자동으로 조정되고, 일반취소는 일정에서 지워져요.',
    body: body,
    footer: (s.memberId ? '<button class="cta-hero" data-act="member-open" data-id="' + s.memberId + '" aria-label="' + esc((m ? m.name : '회원') + ' 정보와 레슨 차트 열기') + '" style="margin-bottom:8px">' + esc(m ? m.name : '회원') + ' 정보 · 레슨 차트 열기' +
        '<span class="cta-go">' + ICON.chev + '</span></button>' : '') +
      '<button class="btn btn-kakao kakao-cta btn-block" data-act="kakao-copy" data-sid="' + s.id + '" style="margin-bottom:8px">' +
        '<span class="kko-ic">' + ICON.chat + '</span>' +
        '<span class="kko-t"><b>카톡 요약 복사</b><span class="kko-s">레슨 내용 · 잔여 횟수 · 오늘 포인트를 한 번에</span></span>' +
        '<span class="kko-go">복사</span></button>' +
      '<button class="btn btn-outline btn-block" data-act="lesson-edit" data-sid="' + s.id + '" style="margin-bottom:8px">✏️ 내용 수정 ' + (sep ? '(날짜 · 시간 · 장소 · 금액)' : '(날짜 · 시간 · 장소)') + '</button>' +
      '<button class="btn btn-outline btn-block" data-act="cal-sheet" data-sid="' + s.id + '">📅 내 캘린더에 추가</button>'
  });
  return sh;
}

/* =========================================================
   오늘 마감 정산
   ========================================================= */
var settleCtx = null;
var lastCancel = null;   /* 직전 일반취소 건 (토스트 '되돌리기'용) */

function openSettleSheet(dateStr){
  var list = sessionsByDate(dateStr);
  if (!list.length) { toast('이 날은 예약된 레슨이 없어요'); return; }
  var sel = { date: dateStr, decisions: {} };
  list.forEach(function(s){ if (s.status !== 'scheduled') sel.decisions[s.id] = s.status; });
  settleCtx = { sel: sel, list: list };
  var sh = openSheet({ title:'오늘 마감 정산', sub: fmtLong(dateStr) + ' · 레슨 ' + list.length + '건' });
  settleCtx.sh = sh;
  paintSettle();
}

function paintSettle(){
  if (!settleCtx || !settleCtx.sh) return;
  var sc = settleCtx.sh.body.scrollTop;
  settleCtx.sh.body.innerHTML = settleBodyHTML(settleCtx.sel, settleCtx.list);
  settleCtx.sh.footer.style.display = '';
  settleCtx.sh.footer.innerHTML = settleFooterHTML(settleCtx.sel, settleCtx.list);
  settleCtx.sh.body.scrollTop = sc;
}

function settleTally(sel, list){
  var ded = 0, keep = 0, und = 0, sep = 0, sepCharge = 0;
  list.forEach(function(s){
    var c = sel.decisions[s.id];
    if (!c) { und++; return; }
    if (isSep(s)) { sep++; if (CHARGED[c]) sepCharge++; return; }
    if (STATUS[c].deducted) ded++; else keep++;
  });
  return { ded: ded, keep: keep, und: und, total: list.length, sep: sep, sepCharge: sepCharge };
}

function settleBodyHTML(sel, list){
  var rows = list.map(function(s){
    var sep = isSep(s);
    var pkg = pkgById(s.packageId);
    var cur = sel.decisions[s.id];
    var rem = pkg ? pkg.remainingSessions : 0;
    var proj = rem;
    if (!sep && cur) proj = Math.max(0, rem - (STATUS[cur].deducted ? 1 : 0) + (s.deducted ? 1 : 0));
    var opts = statusKeysFor(s).map(function(k){
      return '<button class="sopt sopt-' + k + (cur === k ? ' on' : '') + (cur === k && (sep ? CHARGED[k] : STATUS[k].deducted) ? ' opt-ded' : '') +
        '" data-act="settle-set" data-sid="' + s.id + '" data-status="' + k + '">' + STATUS[k].label + '</button>';
    }).join('');
    var projText = sep
      ? (cur ? (CHARGED[cur] ? '별도 수입 포함' : '수입 없음') : '상태를 골라 주세요')
      : (cur ? '잔여 ' + rem + ' → <b>' + proj + '</b>' : '상태를 골라 주세요');
    /* 고른 상태를 잔여 미리보기 옆에 이름으로 남깁니다 (버튼 색만으로는 보기 어려움) */
    var selLabel = cur
      ? '<span class="ssel ssel-' + cur + '">' + STATUS[cur].label + '</span>'
      : '<span class="ssel">예정</span>';   /* 아직 안 고른 줄도 '예정'으로 — 화면마다 미정/예정으로 갈리지 않게 */
    return '<div class="srow' + (cur ? '' : ' pend') + '">' +
      '<div class="srowh">' +
        (sep ? '<span class="lkind lk-' + sepKind(s) + '">' + sepBadge(s) + '</span>' : '') +
        '<span class="sname">' + esc(sessionName(s)) + '</span>' +
        (sep ? '<span class="paytag">별도 ' + (sepFee(s) ? money(sepFee(s)) : '미입력') + '</span>'
             : '<span class="dur' + (s.durationMinutes === 55 ? ' d55' : '') + '">' + s.durationMinutes + '분</span>') +
        '<span class="stime">' + s.startTime + '</span>' +
        selLabel +
        '<span class="sproj' + (cur ? '' : ' dim') + '">' + projText + '</span>' +
      '</div>' +
      '<div class="sopts' + (sep ? ' n4' : '') + '">' + opts + '</div>' +
    '</div>';
  }).join('');
  return '<div class="formnote">완료 · 당일취소 · 노쇼는 횟수를 <b>차감</b>하고, 일반취소 · 보강은 <b>차감하지 않아요</b>.<br>' +
    '<b>필드 · 숏게임 · 원포인트(별도 결제)</b>은 수강권 횟수를 건드리지 않고 수입만 정산해요.<br>' +
    '일반취소로 확정하면 그 레슨은 오늘·캘린더에서 지워지고, 이미 처리된 레슨을 바꿔 정산하면 차이가 잔여 횟수에 자동으로 반영돼요.</div>' + rows;
}

function settleFooterHTML(sel, list){
  var t = settleTally(sel, list);
  var dis = t.und ? ' disabled' : '';
  var h = '<div class="sumline"><span>차감 <b>' + t.ded + '회</b> · 미차감 <b>' + t.keep + '회</b>' +
    (t.sep ? ' · 별도 <b>' + t.sep + '건</b>' : '') +
    (t.und ? ' · 예정 <b>' + t.und + '건</b>' : '') + '</span><span>' + t.total + '건</span></div>';
  if (t.und) {
    h += '<div class="hintline">예정 ' + t.und + '건을 고르면 정산할 수 있어요.</div>' +
      '<button class="btn btn-sm btn-ghost btn-block" data-act="settle-all">남은 레슨 모두 완료로</button>' +
      '<div style="height:8px"></div>';
  }
  h += '<button class="btn btn-primary btn-block" data-act="settle-apply"' + dis + '>정산 완료 · 차감 ' + t.ded + '회' +
    (t.sep ? ' · 별도 ' + t.sep + '건' : '') + ' 반영</button>';
  return h;
}

function settleApply(){
  if (!settleCtx) return;
  var t = settleTally(settleCtx.sel, settleCtx.list);
  if (t.und) { toast('예정 ' + t.und + '건을 먼저 골라주세요'); return; }
  var counts = { completed:0, same_day_cancel:0, no_show:0, excused_cancel:0, makeup:0 };
  var deducted = 0, cleared = 0, sepCount = 0;
  settleCtx.list.forEach(function(s){
    var target = settleCtx.sel.decisions[s.id];
    if (!target) return;
    if (target === 'excused_cancel') {
      cancelExcused(s);                  /* 차감 복구 + 일정에서 제거 */
      cleared++;
    } else {
      applyStatus(s, target);
    }
    counts[target] = (counts[target] || 0) + 1;
    if (isSep(s)) sepCount++;
    else if (STATUS[target].deducted) deducted++;
    s.settledAt = nowLocalISO();
  });
  var rec = settlementFor(settleCtx.sel.date);
  if (!rec) { rec = { date: settleCtx.sel.date }; state.settlements.push(rec); }
  rec.settledAt = nowLocalISO();
  rec.counts = counts;
  rec.deducted = deducted;
  rec.sepCount = sepCount;
  state.settlements.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  save();
  var sh = settleCtx.sh;
  settleCtx = null;
  if (sh) sh.close();
  render();
  toast('마감 정산 완료 · 차감 ' + deducted + '회 반영' + (sepCount ? ' · 별도 ' + sepCount + '건' : '') +
    (cleared ? ' · 일반취소 ' + cleared + '건 일정에서 지움' : ''));
}

var tmCtx = null;

function saveTodayMemo(){
  if (!tmCtx) return;
  var ta = document.getElementById('tmText');
  var text = ta ? ta.value.trim() : '';
  if (!text) { toast('오늘 레슨 내용을 먼저 적어주세요'); if (ta) ta.focus(); return; }
  var mid = tmCtx.memberId, date = tmCtx.date;
  var wasVoice = !!(tmCtx.voiceUsed || (voice.want && voice.kind === 'tm'));
  var tags = detectGolfTags(text);
  var prev = memoNoteFor(mid, date);
  if (prev) {
    prev.text = text; prev.tags = tags; prev.createdAt = nowLocalISO();
    if (wasVoice) prev.source = 'voice';
  } else {
    state.notes.push({
      id: uid('note'), memberId: mid, date: date, text: text,
      createdAt: nowLocalISO(), source: wasVoice ? 'voice' : 'text', raw: text, tags: tags
    });

  save();
  var sh = tmCtx.sh;
  tmCtx = null;
  if (voice.kind === 'tm') vrStop();
  if (sh) sh.close();
  render(true);
  toast(fmtShort(date) + ' · 레슨 차트에 저장했어요');
}

/* =========================================================
   캘린더 탭
   ========================================================= */
function viewCalendar(){
  var sel = ui.date;
  var d = parseISO(sel);
  var y = d.getFullYear(), m = d.getMonth();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var startPad = new Date(y, m, 1).getDay();
  var rows = Math.ceil((startPad + daysInMonth) / 7);
  var gridStart = new Date(y, m, 1 - startPad);

  var byDate = {};
  state.sessions.forEach(function(s){
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  });

  function dotsFor(key){
    var arr = byDate[key];
    if (!arr || !arr.length) return '<div class="dots"></div>';
    var hasR = false, hasA = false, hasG = false, hasS = false, hasGray = false;
    arr.forEach(function(s){
      if (s.status === 'no_show') hasR = true;
      else if (s.status === 'same_day_cancel') hasA = true;
      else if (s.status === 'completed') hasG = true;
      else if (s.status === 'excused_cancel' || s.status === 'makeup') hasGray = true;
      else hasS = true;
    });
    var out = '';
    if (hasR) out += '<i class="r"></i>';
    if (hasA) out += '<i class="a"></i>';
    if (hasG || hasS) out += '<i></i>';
    if (hasGray) out += '<i class="g"></i>';
    return '<div class="dots">' + out + '</div>';
  }

  var cells = '';
  for (var i = 0; i < rows * 7; i++) {
    var cd = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    var key = iso(cd);
    var out = cd.getMonth() !== m;
    var wd = cd.getDay();
    var cls = 'day' + (out ? ' out' : '') + (key === todayISO() ? ' today' : '') + (key === sel ? ' sel' : '') +
      (wd === 0 ? ' sun' : (wd === 6 ? ' sat' : ''));
    var dayN = (byDate[key] || []).length;
    var dayLbl = (cd.getMonth() + 1) + '월 ' + cd.getDate() + '일 (' + WEEK[wd] + ') · ' + (dayN ? '레슨 ' + dayN + '건' : '레슨 없음');
    cells += '<button class="' + cls + '" data-act="day" data-date="' + key + '" aria-label="' + esc(dayLbl) + '">' +
      cd.getDate() + dotsFor(key) + '</button>';
  }

  var list = sessionsByDate(sel);
  var sepN = list.filter(isSep).length;
  var passN = list.length - sepN;
  var d25 = list.filter(function(s){ return !isSep(s) && s.durationMinutes === 25; }).length;

  var h = '<div class="monhdr"><div class="m">' + y + '년 ' + (m + 1) + '월</div>' +
    '<div class="navs">' +
      '<button class="iconbtn" data-act="month" data-delta="-1" aria-label="이전 달">' + ICON.back + '</button>' +
      '<button class="btn btn-sm btn-outline" data-act="month" data-delta="0">오늘</button>' +
      '<button class="iconbtn" data-act="month" data-delta="1" aria-label="다음 달" style="transform:rotate(180deg)">' + ICON.back + '</button>' +
    '</div></div>';

  h += '<div class="cal"><div class="wk"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>' +
    '<div class="grid">' + cells + '</div></div>';

  h += '<div class="dayhead"><div><div class="dh">' + fmtShort(sel) + '</div>' +
    '<div class="ds">' + (list.length ? '레슨 ' + list.length + '건 · 25분 ' + d25 + ' · 55분 ' + (passN - d25) + (sepN ? ' · 별도 결제 ' + sepN : '') : '예약 없음') + '</div></div>' +
    '<button class="btn btn-sm btn-primary" data-act="book-open">' + ICON.plus + ' 레슨 예약</button></div>';

  h += dayListHTML(sel);
  h += '<div class="sec" style="margin-top:16px"><h2>시간표</h2><span class="aside">레슨을 누르면 상태 변경</span></div>';
  h += timelineHTML(sel);
  h += '<div class="legend" style="margin-top:14px">' +
    '<span class="lg"><i class="lgdot scheduled"></i>예정</span>' +
    '<span class="lg"><i class="lgdot completed"></i>완료</span>' +
    '<span class="lg"><i class="lgdot sameday"></i>당일취소</span>' +
    '<span class="lg"><i class="lgdot noshow"></i>노쇼</span>' +
    '<span class="lg"><i class="lgdot makeup"></i>보강</span></div>';
  h += '<div class="hint">오른쪽 아래 <b>+</b> 버튼에 한 줄만 적으면 레슨이 바로 잡혀요.</div>';
  h += '<div style="height:60px"></div>';
  return h;
}

/* 선택한 날짜의 일정 목록 (시간 · 구분 · 회원 · 장소 · 상태) */

        '<span class="drow-t">' + s.startTime + '</span>' +
        '<span class="drow-b">' +
          '<span class="drow-n">' + (sep ? '<span class="lkind lk-' + sepKind(s) + '">' + sepBadge(s) + '</span>' : '') +
            esc(sessionName(s)) +
            (sep ? '' : '<span class="dur' + (s.durationMinutes === 55 ? ' d55' : '') + '">' + s.durationMinutes + '분</span>') + '</span>' +

            ? '별도 결제 ' + sepFeeLine(s) + (s.location ? ' · ' + s.location : '')
            : (s.location || '장소 미입력')) + '</span>' +

        /* 수정 = 상태는 그대로 두고 내용만 고치는 버튼 */
        '<button class="editbtn" data-act="lesson-edit" data-sid="' + s.id + '" aria-label="' + esc(sessionName(s)) + ' 레슨 수정">수정</button>' +
        '<button class="statetap" data-act="status-sheet" data-sid="' + s.id + '" aria-label="' + esc(sessionName(s)) + ' 상태 변경"><span class="st st-' + st.cls + '">' + st.label + '</span></button>' +
      '</span></div>';
  }).join('') + '</div>';
}

function timelineHTML(dateStr){
  var list = sessionsByDate(dateStr);
  if (!list.length) {
    return '<div class="empty"><div class="et">이 날은 예약이 없어요</div>' +
      '<div class="ed">레슨을 잡으면 시간표에 표시돼요.</div></div>';
  }

  var startH = 24, endH = 0;
  list.forEach(function(s){
    startH = Math.min(startH, Math.floor(minOf(s.startTime) / 60));
    endH = Math.max(endH, Math.ceil(sessionEnd(s) / 60));
  });
  /* 설정한 레슨 시간 범위가 시간표의 위·아래 여백을 정하고, 범위를 넘는 레슨은 잘리지 않게 끝까지 그립니다 */
  var rFrom = Math.floor(dayFromMin() / 60), rTo = Math.ceil(dayToMin() / 60);
  var firstH = startH, lastH = endH;
  startH = Math.max(0, Math.min(Math.max(rFrom, startH - 1), firstH));
  endH = Math.min(24, Math.max(Math.min(rTo, Math.max(endH + 1, startH + 4)), lastH));
  endH = Math.max(endH, Math.min(startH + 1, 24));
  var height = (endH - startH) * HOUR_H;

  var lines = '';
  for (var hh = startH; hh <= endH; hh++) {
    lines += '<div class="tlh" style="top:' + ((hh - startH) * HOUR_H) + 'px"><span>' + pad(hh) + ':00</span></div>';
  }
  var nowTop = (nowMin() - startH * 60) / 60 * HOUR_H;
  if (dateStr === todayISO() && nowTop >= 0 && nowTop <= height) {
    lines += '<div class="nowline" style="top:' + nowTop + 'px"></div>';
  }

  var items = list.map(function(s){
    return { s: s, a: minOf(s.startTime), b: sessionEnd(s), lane: 0, placed: false };
  });
  items.forEach(function(it){
    var lane = 0;
    while (lane < 12) {
      var clash = false;
      for (var i = 0; i < items.length; i++) {
        var o = items[i];
        if (!o.placed || o.lane !== lane) continue;
        if (!(it.b <= o.a || it.a >= o.b)) { clash = true; break; }
      }
      if (!clash) break;
      lane++;
    }
    it.lane = lane;
    it.placed = true;
  });
  var laneCount = 1;
  items.forEach(function(it){ laneCount = Math.max(laneCount, it.lane + 1); });
  /* 옆 레슨과 나란히 서면 블록 폭이 1/laneCount 로 좁아지므로, 한 줄 블록에서는 분 표시를 빼
     시간 · 이름 · 잔여 횟수가 들어가게 합니다 */
  var narrow = laneCount > 1;

  var blocks = items.map(function(it){
    var s = it.s;
    var span = (it.b - it.a) / 60 * HOUR_H;   /* 실제 길이(px) */
    var top = (it.a - startH * 60) / 60 * HOUR_H;
    /* 25분 레슨도 최소 높이까지 키워 누르기 쉽게 하되,
       같은 줄(lane)에서 다음 블록과 부딪치지 않는 선에서만 키웁니다 */
    var nextTop = null;
    for (var oi = 0; oi < items.length; oi++) {
      var o = items[oi];
      if (o === it || o.lane !== it.lane || o.a < it.b) continue;
      var ot = (o.a - startH * 60) / 60 * HOUR_H;
      if (nextTop === null || ot < nextTop) nextTop = ot;
    }
    var hgt = Math.max(TL_MIN_H, span - 3);
    if (nextTop !== null) hgt = Math.min(hgt, Math.max(span - 3, nextTop - top - 2));
    var w = 100 / laneCount;
    var st = STATUS[s.status] || STATUS.scheduled;
    var pkg = isSep(s) ? null : pkgById(s.packageId);
    var sep = isSep(s);
    var geo = 'top:' + top + 'px;height:' + hgt + 'px;left:' + (it.lane * w).toFixed(3) +
      '%;width:calc(' + w.toFixed(3) + '% - 5px)';
    var who = (sep ? sepIcon(s) + ' ' : '') + esc(sessionName(s));
    var durTxt = s.durationMinutes + '분';
    /* 남은 횟수: 수강권 레슨은 '잔여 N회', 별도 결제 레슨은 '별도', 수강권 없는 레슨은 표시 없음 */
    var remTxt = sep ? '별도' : (pkg ? '잔여 ' + pkg.remainingSessions + '회' : '');
    /* 두 줄이 들어가지 않는 낮은 블록: 시간 · 이름 · 분 · 잔여를 한 줄로, 세로 가운데 정렬.
       옆 레슨과 나란히 서 폭이 모자라면 이름이 먼저 줄임표로 줄고 잔여 횟수는 남깁니다. */
    if (hgt < 40) {
      return '<button class="ev ev-compact ev-' + st.cls + '" style="' + geo + '" data-act="status-sheet" data-sid="' + s.id +
        '" aria-label="' + esc(s.startTime + ' ' + sessionName(s) + ' ' + durTxt + (remTxt ? ' ' + remTxt : '')) + '">' +
        '<span class="ev-line"><span class="ev-lt">' + s.startTime + '</span>' +
        '<span class="ev-ln">' + who + '</span>' +
        (narrow ? '' : '<span class="ev-ld">' + durTxt + '</span>') +
        (remTxt ? '<span class="ev-lr">' + remTxt + '</span>' : '') +
        '</span></button>';
    }
    return '<button class="ev ev-' + st.cls + '" style="' + geo + '" data-act="status-sheet" data-sid="' + s.id + '">' +
      '<span class="ev-t">' + s.startTime + ' · ' + s.durationMinutes + '분' + (sep ? ' · 별도' : '') + '</span>' +
      '<span class="ev-n">' + who + '</span>' +
      (hgt >= 56 ? '<span class="ev-m">' + esc(sep
        ? '별도 ' + sepFeeLine(s) + (s.location ? ' · ' + s.location : '')
        : ((pkg ? '잔여 ' + pkg.remainingSessions + '회 · ' : '') + (s.location || st.label))) + '</span>' : '') +
    '</button>';
  }).join('');

  return '<div class="tl" style="height:' + height + 'px">' + lines + '<div class="tlbody">' + blocks + '</div></div>';
}

/* =========================================================
   레슨 예약
   ========================================================= */
var bookCtx = null;

function defaultTime(){
  var now = new Date();
  var m = Math.ceil((now.getHours() * 60 + now.getMinutes() + 30) / 30) * 30;
  return dayClampTime(m);
}

/* 지금 시각(분)을 30분 단위로 올린 뒤 설정한 레슨 시간 범위 안으로 넣습니다 */
function dayClampTime(m){
  var r = dayRange();
  if (m < r.from) m = r.from;
  if (m > r.to) m = r.to;
  if (m >= 1440) m = 1410;          /* 24:00 은 시작 시간이 될 수 없음 */
  return hhmm(m);
}

function openBookSheet(pre){
  pre = pre || {};
  var cur = pre.edit ? findSession(pre.edit) : null;
  if (pre.edit && !cur) { toast('수정할 레슨을 찾지 못했어요'); return; }
  var curSep = cur ? isSep(cur) : false;
  var date = cur ? cur.date : (pre.date || ui.date || todayISO());
  var memberId = cur ? (cur.memberId || '') : (pre.memberId || (state.members[0] ? state.members[0].id : ''));
  var mode = cur ? (curSep ? 'sep' : 'pass')
                 : ((!state.members.length || pre.mode === 'sep') ? 'sep' : 'pass');
  var dur = cur && !curSep ? cur.durationMinutes : (pre.durationMinutes || 0);
  if (!dur) {
    var aps = memberId ? activePkgs(memberId) : [];
    dur = aps.length ? aps[0].durationMinutes : 55;
  }
  var time = cur ? cur.startTime : (pre.startTime || defaultTime());
  var sh = openSheet({
    title: cur ? '레슨 수정' : '레슨 예약',
    sub: cur ? '날짜 · 시작 시간 · 소요시간 · 장소 · 메모를 고쳐요. 상태와 수강권 차감은 그대로 남아요.'
             : '수강권으로 하는 레슨과, 필드 · 숏게임 · 원포인트처럼 따로 결제받는 레슨을 한 곳에서 잡아요.'
  });
  bookCtx = { sh: sh, mode: mode, kind: cur ? normSepKind(cur.lessonKind) : 'field',
    target: cur ? (cur.memberId ? 'member' : 'guest') : (state.members.length ? 'member' : 'guest'),
    dur: dur, sepDur: cur && curSep ? cur.durationMinutes : 120,
    editing: cur ? cur.id : null,
    date: date, time: time, memberId: memberId, pkgId: cur ? (cur.packageId || '') : '',
    guest: cur ? (cur.guestName || '') : '',
    fee: cur && cur.fee ? String(cur.fee) : '',
    location: cur ? (cur.location || '') : '', memo: cur ? (cur.memo || '') : '' };
  paintBook();
}

/* 화면에서 고친 값을 기억해 두었다가 모드를 바꿔도 유지한다 */

  if ((el = document.getElementById('bkTime')) && el.value) bookCtx.time = el.value;

  if ((el = document.getElementById('bkLocation'))) bookCtx.location = el.value;

}

function paintBook(){

/* 필드 · 숏게임 별도 결제 폼 (예약 시트 · 빠른 추가 시트 공용)
   p = 'bk' | 'qa' — 입력칸 id 접두사 */

  h += '<div class="field"><label>대상</label><div class="seg" id="' + p + 'Target">' +
    '<button class="' + (target === 'member' ? 'on' : '') + '" data-act="' + p + '-target" data-v="member">회원</button>' +
    '<button class="' + (target === 'guest' ? 'on' : '') + '" data-act="' + p + '-target" data-v="guest">비회원 · 팀</button>' +

    });
    h += '<div class="field"><label>회원</label>' +

      '<div class="hint">회원이어도 이 레슨은 수강권에서 차감하지 않아요.</div></div>';
  } else {
    h += '<div class="field"><label>비회원 이름 / 팀명</label>' +
      '<input class="input" id="' + p + 'Guest" value="' + esc(cx.guest || '') + '" placeholder="예: 홍길동, 한빛상사 팀">' +
      '<div class="hint">회원목록에는 저장되지 않아요.</div></div>';
  }

  h += '<div class="row2">' +
    '<div class="field"><label>날짜</label>' + dateFieldHTML(p + 'Date', cx.date) + '</div>' +
    '<div class="field"><label>시작 시간</label>' + timeFieldHTML(p + 'Time', cx.time) + '</div>' +

  var dur = cx.sepDur || 120;
  /* 프리셋(60·90·120·180·240)을 고른 상태면 직접 입력칸은 비워 두고 placeholder 만 보인다 */
  var typed = SEP_DURS.indexOf(dur) >= 0 ? '' : String(dur);
  h += '<div class="field"><label>소요시간</label><div class="chips durchips">' +
    SEP_DURS.map(function(d){
      return '<button class="chip' + (dur === d ? ' on' : '') + '" data-act="' + p + '-sepdur" data-v="' + d + '">' +
        d + '분' + (d === 180 ? ' (반일)' : '') + '</button>';

      'value="' + typed + '" placeholder="직접 입력" aria-label="소요시간 직접 입력 (분)">' +
  '</div><div class="hint">분 단위로 직접 적어도 돼요. 180분은 반일 필드로 잡아요.</div></div>';

    '<input class="input" id="' + p + 'Fee" inputmode="numeric" value="' + esc(cx.fee || '') + '" placeholder="예: 150000">' +
    '<div class="hint" id="' + p + 'FeeHint">' + feeHintHTML(cx.fee) + '</div></div>';
  if (p === 'bk') h += '<div class="field"><label>메모 (선택)</label><input class="input" id="bkMemo" value="' + esc(cx.memo || '') + '" placeholder="예: 벙커샷 · 어프로치 위주"></div>';
  h += '<div id="' + p + 'Warn"></div>';

}

/* 소요시간: 직접 입력칸에 숫자가 있으면 그 값, 칸이 비어 있으면 고른 프리셋 값을 쓴다 */
function sepDurNow(p, cx){
  var el = document.getElementById(p + 'SepDur');
  var typed = el ? parseInt(String(el.value).replace(/[^0-9]/g, ''), 10) : 0;
  if (typed > 0) return typed;
  var base = parseInt(cx ? cx.sepDur : 0, 10);
  return base > 0 ? base : 0;
}
function bookSepDurNow(){ return sepDurNow('bk', bookCtx); }

/* 직접 입력값에 맞춰 프리셋 칩 하이라이트를 맞춘다 (같은 값이면 그 칩만 켜짐) */
function syncSepDurChips(p, v){
  var inp = document.getElementById(p + 'SepDur');
  if (!inp || !inp.parentNode || !inp.parentNode.children) return;
  var row = inp.parentNode;
  for (var i = 0; i < row.children.length; i++) {
    var b = row.children[i];
    if (b.getAttribute && b.getAttribute('data-act') === p + '-sepdur') {
      b.classList.toggle('on', parseInt(b.getAttribute('data-v'), 10) === v);
    }
  }
}

function refreshBkPkgs(){
  if (bookCtx && bookCtx.mode === 'sep') { validateBook(); return; }
  var mEl = document.getElementById('bkMember');
  if (!mEl || !bookCtx) return;
  var list = activePkgs(mEl.value).filter(function(p){ return p.durationMinutes === bookCtx.dur; });
  var opts = list.map(function(p){
    var exp = p.expiryDate && p.expiryDate < todayISO();
    return { v: p.id, label: p.durationMinutes + '분 · 잔여 ' + p.remainingSessions + '/' + p.totalSessions + '회',
      sub: fmtDot(p.expiryDate) + (exp ? ' · 만료됨' : ' 만료') };
  });
  var pEl = document.getElementById('bkPkg');
  var prev = pEl ? pEl.value : '', keep = '';
  for (var i = 0; i < opts.length; i++) if (opts[i].v === prev) keep = prev;
  if (!keep && opts.length) keep = opts[0].v;
  setPickOptions('bkPkg', opts, keep);
  if (!opts.length) {
    var lbl = document.getElementById('bkPkgLbl');
    if (lbl) lbl.innerHTML = '<span class="ph">사용 가능한 ' + bookCtx.dur + '분 수강권이 없어요</span>';
  }
  var hint = document.getElementById('bkPkgHint');
  if (hint) hint.innerHTML = list.length
    ? '예약해 두고, 정산에서 완료·당일취소·노쇼로 확정할 때 이 수강권에서 차감돼요.'
    : '회원 정보창에서 ' + bookCtx.dur + '분 수강권을 먼저 추가해 주세요.';
  validateBook();
}

function validateBook(){
  if (!bookCtx) return;
  var w = document.getElementById('bkWarn');
  if (!w) return;
  var dEl = document.getElementById('bkDate'), tEl = document.getElementById('bkTime');
  var msgs = [];
  var date = dEl ? dEl.value : (bookCtx.date || '');
  var time = tEl ? tEl.value : (bookCtx.time || '');
  var sep = bookCtx.mode === 'sep';
  var dur = sep ? bookSepDurNow() : bookCtx.dur;
  var who = '';
  if (!date) msgs.push('날짜를 골라주세요.');
  if (!time) msgs.push('시작 시간을 골라주세요.');
  if (sep) {
    if (bookCtx.target === 'guest') {
      var g = document.getElementById('bkGuest');
      who = g ? g.value.trim() : '';
      if (!who) msgs.push('비회원 이름이나 팀명을 적어주세요.');
    } else {
      var mm = document.getElementById('bkMember');
      var mid = mm ? mm.value : bookCtx.memberId;
      if (!mid) msgs.push('회원을 골라주세요.');
      who = mid ? memberName(mid) : '';
    }
    if (!dur || dur < 15) msgs.push('소요시간을 15분 이상으로 넣어주세요.');
    else if (dur > 720) msgs.push('소요시간은 720분 이하로 넣어주세요.');
  } else {
    var mEl = document.getElementById('bkMember');
    if (!mEl || !mEl.value) msgs.push('회원을 골라주세요.');
    else who = memberName(mEl.value);
    var pSel = document.getElementById('bkPkg');
    if (pSel && !pSel.value) msgs.push('수강권을 골라주세요.');
  }
  if (date && time && dur) {
    var a = minOf(time), b = a + dur;
    var clash = sessionsByDate(date).filter(function(s){
      if (bookCtx.editing && s.id === bookCtx.editing) return false;   /* 수정 중인 레슨 자신은 빼고 본다 */
      if (s.status === 'excused_cancel' || s.status === 'same_day_cancel' || s.status === 'no_show') return false;
      return a < sessionEnd(s) && minOf(s.startTime) < b;
    });
    if (clash.length) msgs.push(clash[0].startTime + '~' + hhmm(sessionEnd(clash[0])) + '에 ' + sessionName(clash[0]) + ' 레슨이 있어요.');
  }
  if (msgs.length) {
    w.innerHTML = '<div class="err">' + esc(msgs.join(' ')) + '</div>';
  } else if (sep) {
    var feeEl = document.getElementById('bkFee');
    var fee = feeNum(feeEl ? feeEl.value : bookCtx.fee);
    w.innerHTML = '<div class="ok">' + sepIcon({ lessonKind: bookCtx.kind }) + ' ' + esc(sepKindName(bookCtx.kind)) + ' · ' +
      esc(who) + ' · ' + fmtShort(date) + ' ' + time + ' · ' + dur + '분 · ' + (fee ? money(fee) : '금액 미입력') + '</div>';
  } else {
    w.innerHTML = '<div class="ok">' + fmtShort(date) + ' ' + time + ' · ' + bookCtx.dur + '분 예약할 수 있어요.</div>';
  }
  var btn = bookCtx.sh.footer.querySelector('[data-act="book-save"]');
  if (btn) btn.disabled = msgs.length > 0;
}

function saveBooking(){
  if (!bookCtx) return;
  var dEl = document.getElementById('bkDate'), tEl = document.getElementById('bkTime');
  if (!dEl || !tEl || !dEl.value || !tEl.value) { toast('날짜와 시간을 골라주세요'); return; }
  var date = dEl.value, time = tEl.value, s = null, label = '';
  var cur = bookCtx.editing ? findSession(bookCtx.editing) : null;
  if (bookCtx.editing && !cur) { toast('수정할 레슨을 찾지 못했어요'); return; }
  var sep = bookCtx.mode === 'sep';
  var mid = null, guest = '', fee = 0, kind = 'field', loc = '', memo = '', pkgId = '', dur = 0;
  var addedName = '';   /* 이름만 적어 온 비회원을 새 회원으로 남겼을 때 */

  if (sep) {
    dur = bookSepDurNow();
    if (!dur || dur < 15) { toast('소요시간을 넣어주세요'); return; }
    if (bookCtx.target === 'guest') {
      var gEl = document.getElementById('bkGuest');
      guest = gEl ? gEl.value.trim() : '';
      if (!guest) { toast('비회원 이름이나 팀명을 적어주세요'); return; }
      /* 별도 결제로 온 사람은 회원목록에 남겨 둔다 — 나중에 수강권을 끊을 수 있으니
         (이미 정산된 레슨은 회원 연결을 바꾸지 않는다) */
      var knownGuest = !!findMemberByName(guest);
      var gm = (!cur || !(cur.deducted || cur.charged)) ? ensureMemberForGuest(guest) : null;
      if (gm) { mid = gm.id; if (!knownGuest) addedName = gm.name; guest = ''; }
    } else {
      var mEl = document.getElementById('bkMember');
      mid = mEl ? mEl.value : '';
      if (!mid) { toast('회원을 골라주세요'); return; }
    }
    var feeEl = document.getElementById('bkFee'), locEl = document.getElementById('bkLocation'), memoEl = document.getElementById('bkMemo');
    fee = feeNum(feeEl ? feeEl.value : bookCtx.fee);
    kind = normSepKind(bookCtx.kind);
    loc = locEl ? locEl.value.trim() : '';
    memo = memoEl ? memoEl.value.trim() : '';
  } else {
    var mEl2 = document.getElementById('bkMember'), pEl = document.getElementById('bkPkg');
    var memoEl2 = document.getElementById('bkMemo'), locEl2 = document.getElementById('bkLocation');
    if (!mEl2 || !pEl || !mEl2.value || !pEl.value) { toast('회원과 수강권을 골라주세요'); return; }
    var pkg = pkgById(pEl.value);
    mid = mEl2.value; pkgId = pkg ? pkg.id : ''; dur = bookCtx.dur;
    loc = locEl2 ? locEl2.value.trim() : '';
    memo = memoEl2 ? memoEl2.value.trim() : '';
  }

  /* 수정: 이미 정산(차감·수입)된 레슨은 모드·회원·수강권을 바꾸면 횟수가 어긋나므로 막는다 */
  if (cur && (cur.deducted || cur.charged)) {
    var lockMsg = '';
    if (isSep(cur) !== sep) lockMsg = '이미 정산된 레슨이라 수강권/별도 결제 모드는 바꿀 수 없어요.';
    else if (String(cur.memberId || '') !== String(mid || '')) lockMsg = '이미 정산된 레슨이라 회원은 바꿀 수 없어요.';
    else if (!sep && String(cur.packageId || '') !== String(pkgId || '')) lockMsg = '이미 차감된 레슨이라 수강권은 바꿀 수 없어요.';
    if (lockMsg) {
      toast(lockMsg + ' 상태를 [예정]으로 되돌린 뒤 수정해 주세요');
      return;
    }
  }

  if (cur) {
    s = cur;                     /* 새로 만들지 않고 그 자리에서 고친다 (상태·차감 유지) */
  } else if (sep) {
    s = {
      id: uid('lsn'), memberId: mid || null, packageId: '',
      guestName: guest, lessonKind: kind,
      separatePay: true, fee: fee,
      date: date, startTime: time, durationMinutes: dur,
      location: loc,
      status: 'scheduled', deducted: false, charged: false,
      memo: memo, settledAt: '', source: 'manual'
    };
  } else {
    s = {
      id: uid('lsn'), memberId: mid, packageId: pkgId,
      date: date, startTime: time, durationMinutes: dur,
      location: loc,
      status: 'scheduled', deducted: false, memo: memo, settledAt: '',
      source: 'manual'
    };
  }

  if (sep) {
    s.memberId = mid || null;
    s.packageId = '';
    s.guestName = mid ? '' : guest;
    s.lessonKind = kind;
    s.separatePay = true;
    s.fee = fee;
    s.durationMinutes = dur;
    label = sepIcon({ lessonKind: kind }) + ' ' + sepKindName(kind) + ' · ' + (guest || memberName(mid));
  } else {
    s.memberId = mid;
    s.packageId = pkgId;
    s.guestName = '';
    s.lessonKind = '';
    s.separatePay = false;
    s.fee = 0;
    s.durationMinutes = dur;
    label = sessionName(s) || '레슨';
  }
  s.date = date;
  s.startTime = time;
  s.location = loc;
  s.memo = memo;

  var isNew = !cur;
  if (isNew) state.sessions.push(s);
  save();
  if (isNew) ui.tab = 'calendar';    /* 수정할 때는 지금 보던 탭을 그대로 둔다 */
  ui.date = s.date;
  var sh = bookCtx.sh;
  bookCtx = null;
  if (sh) sh.close();
  if (memberCtx) paintMemberSheet();
  render();
  if (isNew) {
    toast(label + ' · ' + fmtDot(s.date) + ' ' + s.startTime + ' ' + s.durationMinutes + '분 추가' +
      (addedName ? ' · ' + addedName + ' 회원목록에 저장' : ''));
    calendarAfterAdd(s);
  } else {
    toast(label + ' 수정 · ' + fmtDot(s.date) + ' ' + s.startTime + ' ' + s.durationMinutes + '분');
  }
}

var GOLF_TAGS = [
  { key:'드라이버', cls:'t-driver',   words:['드라이버','티샷','우드','유틸','하이브리드','비거리','슬라이스','훅'] },
  { key:'아이언',   cls:'t-iron',     words:['아이언','7번','8번','9번','피칭','다운블로','임팩트','핸드퍼스트'] },
  { key:'어프로치', cls:'t-approach', words:['어프로치','웨지','칩샷','피치샷','벙커','로브','거리감'] },
  { key:'퍼팅',     cls:'t-putt',     words:['퍼팅','퍼터','그린','스트로크','라인','숏퍼트'] },
  { key:'필드',     cls:'t-field',    words:['필드','라운딩','코스','트러블','파3'] }
];

function isArr(v){ return Object.prototype.toString.call(v) === '[object Array]'; }
function golfTagIndex(name){
  for (var i = 0; i < GOLF_TAGS.length; i++) if (GOLF_TAGS[i].key === name) return i;
  return 99;
}
function golfTagInfo(name){
  var i = golfTagIndex(name);
  return i < GOLF_TAGS.length ? GOLF_TAGS[i] : null;
}
function sortTags(list){
  return (list || []).slice().sort(function(a, b){ return golfTagIndex(a) - golfTagIndex(b); });
}

/* 본문에서 골프 키워드를 찾아 태그를 붙입니다 (고정된 순서) */
function detectGolfTags(text){
  var src = String(text || '').toLowerCase().replace(/\s+/g, ' ');
  var out = [];
  GOLF_TAGS.forEach(function(t){
    for (var i = 0; i < t.words.length; i++) {
      if (src.indexOf(t.words[i].toLowerCase()) >= 0) { out.push(t.key); return; }
    }
  });
  return out;
}

/* 예전에 저장된 기록(태그 없음)은 본문에서 바로 계산합니다 */
function noteTags(n){
  if (n && isArr(n.tags)) return n.tags.slice();
  return detectGolfTags(n ? n.text : '');
}
function noteTagHTML(name){
  var t = golfTagInfo(name);
  if (!t) return '';
  return '<span class="gtag ' + t.cls + '">#' + esc(name) + '</span>';
}
function tagFilterCounts(notes){
  var c = {};
  GOLF_TAGS.forEach(function(t){ c[t.key] = 0; });
  notes.forEach(function(n){
    noteTags(n).forEach(function(k){ if (c[k] !== undefined) c[k]++; });
  });
  return c;
}

/* 입력칸 위 태그 칩 — 본문에서 자동으로 켜지고, 눌러서 직접 고칠 수 있습니다 */
function noteTagChipsHTML(){
  var sel = (memberCtx && isArr(memberCtx.tagSel)) ? memberCtx.tagSel : [];

}

/* 타이핑·음성으로 본문이 바뀔 때 칩만 다시 칠합니다(입력 포커스 유지) */

/* =========================================================
   카톡 복사용 1초 리포트
   ========================================================= */
function kakaoMD(date){
  var d = parseISO(date);
  return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEK[d.getDay()] + ')';
}

/* 그 날짜의 최신 차트 기록 → 없으면 수업 메모 → 없으면 회원의 최근 기록 */
function kakaoPointText(s, m){
  var mid = s ? s.memberId : (m ? m.id : '');
  var text = '';
  if (mid && s && s.date) {
    var hits = notesByMember(mid).filter(function(n){ return n.date === s.date; });
    if (hits.length) text = hits[0].text;
  }
  if (!text && s && s.memo) text = s.memo;
  if (!text && mid) {
    var all = notesByMember(mid);
    if (all.length) text = all[0].text;
  }
  text = String(text || '').replace(/\s+/g, ' ').trim();
  if (text.length > 160) text = text.slice(0, 159) + '…';
  return text;
}

function kakaoReport(o){
  o = o || {};
  var lines = ['[' + (o.pro || '프로') + ' 프로 레슨 노트]'];
  var when = [];
  if (o.date) when.push(kakaoMD(o.date));
  if (o.time) when.push(o.time);
  if (o.duration) when.push('(' + (o.kindLabel ? o.kindLabel + ' ' : '') + o.duration + '분)');
  var head = (o.name || '') + (o.guest ? '' : '님');
  if (when.length) head += ' · ' + when.join(' ');
  lines.push(head);
  if (o.total > 0 && o.remaining !== null && o.remaining !== undefined) {
    lines.push('잔여 횟수: ' + o.remaining + '/' + o.total + '회');
  }
  if (o.fee) lines.push('별도 결제: ' + money(o.fee));
  else if (o.sep) lines.push('별도 결제: 금액 미입력');
  if (o.point) lines.push('오늘 포인트: ' + o.point);
  return lines.join('\n');
}

function kakaoReportForSession(sid){
  var s = findSession(sid);
  if (!s) return '';
  var sep = isSep(s);
  var m = s.memberId ? memberById(s.memberId) : null;
  var pkg = sep ? null : (pkgById(s.packageId) || (m ? activePkgs(m.id)[0] : null));
  return kakaoReport({
    pro: (state.pro && state.pro.name) || '프로',
    name: sep ? sessionName(s) : (m ? m.name : ''),
    guest: sep && !s.memberId,
    date: s.date, time: s.startTime, duration: s.durationMinutes,
    kindLabel: sep ? sepKindName(s.lessonKind) : '',
    remaining: pkg ? pkg.remainingSessions : null,
    total: pkg ? pkg.totalSessions : 0,
    sep: sep, fee: sep ? sepFee(s) : 0,

  });
}

/* 가장 최근에 진행한 레슨 (없으면 가장 가까운 예정 레슨) */
function latestLessonFor(mid){
  var list = state.sessions.filter(function(s){ return s.memberId === mid && s.status !== 'excused_cancel'; })
    .sort(function(a, b){
      if (a.date === b.date) return minOf(b.startTime) - minOf(a.startTime);
      return a.date < b.date ? 1 : -1;
    });
  var t = todayISO();
  for (var i = 0; i < list.length; i++) if (list[i].date <= t) return list[i];
  return list.length ? list[list.length - 1] : null;
}

function kakaoReportForMember(mid){
  var m = memberById(mid);
  if (!m) return '';
  var s = latestLessonFor(mid);
  if (s) return kakaoReportForSession(s.id);
  var lp = lastPkgOf(mid);
  return kakaoReport({
    pro: (state.pro && state.pro.name) || '프로',
    name: m.name, date: todayISO(), time: '', duration: lp ? lp.durationMinutes : '',
    remaining: lp ? lp.remainingSessions : null, total: lp ? lp.totalSessions : 0,
    point: kakaoPointText(null, m)
  });
}

/* iOS 사파리: clipboard API → 안 되면 textarea + execCommand */
function copyText(text, done){
  function fallback(){
    var ok = false, ta = null;
    try {
      ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand('copy');
    } catch(e){ ok = false; }
    if (ta && ta.parentNode) ta.parentNode.removeChild(ta);
    done(!!ok);
  }
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function(){ done(true); }, fallback);
    return;
  }
  fallback();
}

  }
