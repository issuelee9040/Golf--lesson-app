<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>레슨 관리 · 프로토타입</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#0B0F14; --ink2:#3C434D; --muted:#8A9099;
  --line:#E3E6EB; --line2:#EFF1F4;
  --green:#0F7B4A; --green-d:#0A5C37; --green-soft:#E6F4EC; --green-mid:#CFE9DA;
  --amber:#A05F00; --amber-soft:#FFF3DF; --amber-line:#F1D9A8;
  --red:#B3352A; --red-soft:#FDECEA; --red-line:#F3C7C1;
  --blue:#2F6FED; --blue-soft:#EAF1FF;
  --gray-soft:#F1F2F5;
  --radius:18px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
body{
  background:#DFE3E9; color:var(--ink); font-size:15px; line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:inherit;border-radius:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
#app{
  position:relative;display:flex;flex-direction:column;width:100%;max-width:430px;
  margin:0 auto;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;
  box-shadow:0 0 0 1px rgba(16,24,40,.06),0 24px 70px rgba(16,24,40,.14);
}
/* ---------- header ---------- */
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 16px 8px;background:linear-gradient(180deg,#F2F2F7 72%,rgba(242,242,247,0))}
.hd h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.hd .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.hd-left{display:flex;align-items:center;gap:10px;min-width:0}
.hd-left>div{min-width:0}
.iconbtn{width:34px;height:34px;flex:none;border-radius:11px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);box-shadow:var(--shadow)}
.iconbtn svg{width:18px;height:18px}
/* ---------- main ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{width:0}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid rgba(16,24,40,.035)}
.card+.card{margin-top:10px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
.sec .aside{font-size:12px;color:var(--muted);font-weight:700}
.sec .link{font-size:12.5px;color:var(--green);font-weight:800}
.link{font-size:12.5px;color:var(--green);font-weight:800}
.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}
.muted{color:var(--muted)}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;color:#fff;
  background:linear-gradient(152deg,#128A53 0%,#0C6B41 52%,#08492C 100%);
  box-shadow:0 12px 26px rgba(8,73,44,.24)}
.hero:after{content:"";position:absolute;right:-56px;top:-70px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
.hero:before{content:"";position:absolute;right:-10px;bottom:-70px;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.05)}
.hero .k{position:relative;font-size:12px;font-weight:700;opacity:.82;letter-spacing:.2px}
.hero .big{position:relative;font-size:31px;font-weight:800;letter-spacing:-1.1px;line-height:1.15;margin-top:5px}
.hero .row{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pillstat{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.17);border-radius:999px;
  padding:4px 9px;font-size:11.5px;font-weight:700}
.herobtn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  margin-top:15px;padding:13px 15px;border-radius:15px;background:#fff;color:var(--green-d);
  font-size:14.5px;font-weight:800;letter-spacing:-.2px;box-shadow:0 6px 14px rgba(0,0,0,.14)}
.herobtn .hb-sub{display:block;font-size:11px;font-weight:700;color:#6B7A72;letter-spacing:0;margin-top:1px}
.herobtn .hb-go{flex:none;width:26px;height:26px;border-radius:50%;background:var(--green-soft);
  display:flex;align-items:center;justify-content:center;color:var(--green)}
.herobtn .hb-go svg{width:15px;height:15px}
/* ---------- alerts ---------- */
.alert{display:flex;gap:10px;background:var(--amber-soft);border:1px solid var(--amber-line);
  border-radius:15px;padding:12px 13px;margin-top:12px;color:#6B4400}
.alert.blue{background:var(--blue-soft);border-color:#CFE0FF;color:#1F4EA8}
.alert .ai{flex:none;margin-top:1px}
.alert .at{font-size:13px;font-weight:800}
.alert .ad{font-size:11.5px;font-weight:600;opacity:.86;margin-top:2px}
/* ---------- lesson card ---------- */
.lesson-card{padding:14px 15px}
.lesson{display:flex;gap:12px}
.timecol{flex:none;width:50px}
.timecol .t{font-size:15.5px;font-weight:800;letter-spacing:-.4px}
.timecol .d{font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}
.lesson .body{flex:1;min-width:0}
.nameline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.name{font-size:15.5px;font-weight:800;letter-spacing:-.25px}
.meta{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta b{color:var(--ink2);font-weight:800}
.bar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#17A466,#0F7B4A)}
.bar>i.low{background:linear-gradient(90deg,#E8A33C,#D07C12)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* ---------- status pill ---------- */
.st{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:8px;font-size:11.5px;font-weight:800;white-space:nowrap}
.st-completed{background:var(--green-soft);color:var(--green-d)}
.st-same_day_cancel{background:var(--amber-soft);color:var(--amber)}
.st-no_show{background:var(--red-soft);color:var(--red)}
.st-excused_cancel{background:var(--gray-soft);color:#6B7280}
.st-makeup{background:var(--blue-soft);color:var(--blue)}
.st-scheduled{background:#fff;color:var(--green);border:1px solid var(--green-mid)}
.dur{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.dur.d55{background:var(--green-soft);color:var(--green-d)}
.tagwarn{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--red-soft);color:var(--red)}
.tagnone{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--gray-soft);color:#6B7280}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:44px;padding:0 16px;
  border-radius:14px;font-size:14.5px;font-weight:800;letter-spacing:-.2px;border:1px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(15,123,74,.26)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:var(--gray-soft);color:var(--ink2)}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn-danger{background:#fff;border-color:var(--red-line);color:var(--red)}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:10px}
.btn-block{display:flex;width:100%}
.btn:disabled{opacity:.42;box-shadow:none}
/* ---------- segmented / chips ---------- */
.seg{display:flex;background:#E4E8EE;border:1px solid rgba(16,24,40,.045);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:800;color:var(--ink2);text-align:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.16)}
.seg.mini{max-width:210px}
.statsseg button.on,.rvunit button.on{color:var(--green-d)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;background:var(--gray-soft);font-size:12.5px;font-weight:800;color:var(--ink2);border:1px solid transparent}
.chip.on{background:var(--green-soft);color:var(--green-d);border-color:var(--green-mid)}
.sortbtn{flex:none;display:inline-flex;align-items:center;gap:2px;height:27px;padding:0 7px 0 10px;border-radius:9px;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);white-space:nowrap;
  font-size:11.5px;font-weight:800;color:var(--ink2);letter-spacing:-.3px}
.sortbtn svg{width:13px;height:13px;flex:none;color:#A8ADB5;margin-top:1px}
.sortbtn:active{background:var(--gray-soft)}
.sec h2 .sec-cnt{font-size:12px;font-weight:700;color:var(--muted);margin-left:1px;letter-spacing:-.1px}
/* ---------- calendar ---------- */
.monhdr{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
.monhdr .m{font-size:17px;font-weight:800;letter-spacing:-.4px}
.monhdr .navs{display:flex;align-items:center;gap:6px}
.cal{background:#fff;border-radius:18px;padding:8px 6px 10px;border:1px solid var(--line2);box-shadow:var(--shadow)}
.cal .wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.cal .wk div{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day{position:relative;height:46px;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink2)}
.day.out{color:#C7CBD2}
.day.sun{color:#C4553F}
.day.sat{color:#3C6FBF}
.day.today{box-shadow:inset 0 0 0 1.5px var(--green);color:var(--green-d);font-weight:800}
.day.sel{background:var(--green);color:#fff;box-shadow:0 5px 12px rgba(15,123,74,.3)}
.day.sel.sun,.day.sel.sat{color:#fff}
.dots{display:flex;gap:2px;height:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:#0F7B4A}
.dots i.a{background:#E0A33E}.dots i.r{background:#D9614F}.dots i.g{background:#C7CBD2}
.day.sel .dots i{background:rgba(255,255,255,.9)}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:18px 2px 8px}
.dayhead .dh{font-size:16px;font-weight:800;letter-spacing:-.3px}
.dayhead .ds{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.tl{position:relative;margin:6px 0 0;padding-left:42px}
.tlh{position:absolute;left:0;right:0;height:0;border-top:1px solid #ECEEF2}
.tlh span{position:absolute;left:0;top:-8px;font-size:10px;font-weight:800;color:#B4B9C1;background:var(--bg);padding-right:6px}
.tlbody{position:absolute;left:42px;right:0;top:0;bottom:0}
.ev{position:absolute;overflow:hidden;border-radius:10px;padding:4px 7px;border-left:3px solid #0F7B4A;
  display:block;text-align:left;font-weight:700;line-height:1.25}
.ev-scheduled{background:#fff;border-color:#0F7B4A;color:var(--ink);box-shadow:0 1px 4px rgba(16,24,40,.1)}
.ev-completed{background:var(--green-soft);border-color:#0F7B4A;color:var(--green-d)}
.ev-same_day_cancel{background:var(--amber-soft);border-color:#E0A33E;color:#7A4800}
.ev-no_show{background:var(--red-soft);border-color:#D9614F;color:#96271D}
.ev-excused_cancel{background:var(--gray-soft);border-color:#C7CBD2;color:#7A8088}
.ev-makeup{background:var(--blue-soft);border-color:#2F6FED;color:#2359C4}
.ev-t{display:block;font-size:9.5px;font-weight:800;opacity:.85;white-space:nowrap}
.ev-n{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-m{display:block;font-size:10px;font-weight:700;opacity:.8;white-space:nowrap}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;color:var(--muted)}
.empty .et{font-size:14px;font-weight:800;color:var(--ink2)}
.empty .ed{font-size:12px;font-weight:600;margin-top:4px}
/* ---------- members ---------- */
.search{position:relative;margin:2px 0 10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#A9AEB6}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;
  padding:0 12px 0 34px;font-size:14px;font-weight:600}
.search input::placeholder{color:#B4B9C1;font-weight:600}
.mrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px 12px;
  box-shadow:var(--shadow);border:1px solid rgba(16,24,40,.035);width:100%}
.mrow+.mrow{margin-top:6px}
.av{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;background:var(--green-soft);color:var(--green-d)}
.av.b{background:var(--blue-soft);color:#2359C4}
.av.a{background:var(--amber-soft);color:#8A5200}
.av.r{background:var(--red-soft);color:#96271D}
.mrow .mi{flex:1;min-width:0}
.mrow .mn{font-size:14.5px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mrow .mm{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mr{flex:none;text-align:right}
.mrow .rem{font-size:16px;font-weight:800;letter-spacing:-.5px}
.mrow .rem small{font-size:11px;font-weight:700;color:var(--muted);margin-left:1px}
.mrow .rem.low{color:var(--red)}
.chev{flex:none;color:#C3C8CF}
.chev svg{width:16px;height:16px;display:block}
.pcard{border:1px solid var(--line2);border-radius:15px;padding:14px}
.pcard+.pcard{margin-top:9px}
.pcard.dead{background:#FAFAFB;opacity:.72}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnum{font-size:20px;font-weight:800;letter-spacing:-.6px}
.pnum small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;padding:7px 0;border-bottom:1px solid var(--line2)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-weight:700;font-size:12px}
.kv .v{font-weight:800}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.hist:last-child{border-bottom:0}
.hist .hd-t{width:52px;flex:none}
.hist .hd-t b{font-size:12.5px;font-weight:800;display:block}
.hist .hd-t span{font-size:10.5px;color:var(--muted);font-weight:700}
.hist .hd-b{flex:1;min-width:0}
.hist .hd-b .hm{font-size:11.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{background:#fff;border-radius:16px;padding:13px 14px;border:1px solid rgba(16,24,40,.035);box-shadow:var(--shadow)}
.kpi .n{font-size:22px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
.kpi .n small{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}
.kpi.green .n{color:var(--green-d)}
.kpi.amber .n{color:var(--amber)}
.kpi.red .n{color:var(--red)}
.kpi.blue .n{color:var(--blue)}
.wchart{display:flex;align-items:flex-end;gap:8px;height:112px;margin-top:12px}
.wcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.wbar{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#19A76A,#0F7B4A);min-height:4px}
.wbar.zero{background:var(--line2)}
.wval{font-size:11px;font-weight:800;color:var(--ink2)}
.wlab{font-size:10.5px;font-weight:700;color:var(--muted)}
.tpl{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.tpl:last-child{border-bottom:0}
.tpl .ti{flex:1;min-width:0}
.tpl .tn{font-size:13.5px;font-weight:800}
.tpl .ts{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.rm{position:relative;padding-left:24px;margin-top:6px}
.rm .step{position:relative;padding-bottom:16px}
.rm .step:last-child{padding-bottom:2px}
.rm .step:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;
  background:#D6DAE0;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #D6DAE0}
.rm .step.done:before{background:var(--green);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--green)}
.rm .step.cur:before{background:#fff;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--green)}
.rm .step:after{content:"";position:absolute;left:-15.2px;top:15px;bottom:0;width:1.5px;background:var(--line)}
.rm .step:last-child:after{display:none}
.rm .rt{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rm .rd{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.5}
.rnow{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--green-soft);color:var(--green-d)}
/* ---------- 수입 정산 ---------- */
.statsseg{margin:2px 0 14px}
.rvhero .big{font-size:29px;letter-spacing:-1px}
.rvhero .big small{font-size:15px;font-weight:800;opacity:.8;margin-left:2px;letter-spacing:0}
.rvunit{margin:0 0 2px}
.rvchart{margin-top:14px}
.rvchart .wcol{padding:0;background:none;display:flex}
.rvchart .wval,.rvchart .wlab,.rvchart .wbar{display:block}
.rvchart .wval.on,.rvchart .wlab.on{color:var(--green-d)}
.rvlist{background:#fff;border-radius:18px;border:1px solid rgba(16,24,40,.035);box-shadow:var(--shadow);padding:0 15px}
.rvitem{border-bottom:1px solid var(--line2)}
.rvitem:last-child{border-bottom:0}
.rvrow{display:flex;align-items:center;gap:9px;width:100%;padding:12px 0}
.rvrow .rvmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rvtitle{font-size:13.5px;font-weight:800;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvmeta{font-size:11.5px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.rvamt{font-size:14px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.rvcnt{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.rvchev{flex:none;display:flex;color:#C2C7CF}
.rvchev svg{width:15px;height:15px;transition:transform .18s}
.rvrow[data-open="1"] .rvchev svg{transform:rotate(90deg)}
.rvdetail{padding:0 0 12px}
.rvline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:700;padding:5px 0 5px 9px;border-left:2px solid var(--green-mid);margin:0 0 4px 2px}
.rvline .n{font-size:12px;font-weight:800;min-width:0}
.rvline .n .t{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:1px}
.rvline .a{flex:none;color:var(--ink2);white-space:nowrap}

/* ---------- 선택 필드 · 피커 ---------- */

.pklist{display:flex;flex-direction:column;gap:8px}

.pkempty{padding:22px 4px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.tslotwrap{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tslot{height:40px;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:13px;
  font-weight:800;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.tslot.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 10px rgba(15,123,74,.24)}
.dpcal{margin-top:2px}
.dpcal .day{width:100%;height:42px;font-size:13px}
.dpcal .day.sel{color:#fff}
.dplabel{font-size:12px;font-weight:700;color:var(--muted);margin:2px 3px 8px}
/* ---------- tabbar ---------- */
.tabbar{flex:none;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:6px 0 4px;border-radius:12px;color:#9AA0A8;font-size:10.5px;font-weight:800;letter-spacing:-.2px}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--green)}
/* ---------- sheet ---------- */
.sheetwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(9,13,18,.4);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:430px;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  max-height:92vh;box-shadow:0 -10px 40px rgba(0,0,0,.24);animation:sheetup .24s cubic-bezier(.2,.9,.2,1)}

.sheet .grab{flex:none;width:38px;height:5px;border-radius:3px;background:#D3D7DD;margin:8px auto 2px}
.sheet .sh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px 6px}
.sheet .sh h3{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sheet .sub{padding:0 17px 8px;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.5}
.sheet .sb{flex:1;overflow-y:auto;padding:4px 16px 14px}
.sheet .sf{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}

.sf .sumline b{font-weight:800}

/* ---------- forms ---------- */
.field{margin-bottom:12px}
.field>label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin:0 0 5px 3px;letter-spacing:.1px}
.input{width:100%;height:45px;border-radius:13px;border:1px solid var(--line);background:#fff;padding:0 12px;
  font-size:15px;font-weight:600;-webkit-appearance:none;appearance:none}
.input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(15,123,74,.12)}
textarea.input{height:auto;min-height:86px;padding:11px 12px;line-height:1.5;resize:vertical}
.row2{display:flex;gap:9px}
.row2>*{flex:1;min-width:0}
.hint{font-size:11px;font-weight:600;color:var(--muted);margin:6px 3px 0;line-height:1.45}
.err{font-size:11.5px;font-weight:800;color:var(--red);margin:7px 3px 0;line-height:1.45}
.ok{font-size:11.5px;font-weight:700;color:var(--green-d);margin:7px 3px 0}
.formnote{background:#fff;border:1px solid var(--line2);border-radius:13px;padding:11px 12px;font-size:11.5px;
  font-weight:600;color:var(--ink2);line-height:1.5;margin-bottom:12px}
/* ---------- settle sheet ---------- */
.srow{border:1px solid var(--line2);background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px}
.srow.pend{border-color:var(--amber-line);background:#FFFDF8}
.srowh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sname{font-size:14px;font-weight:800;letter-spacing:-.2px}

.sproj{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted)}

.sproj.dim{color:#B4B9C1}
.sopts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:9px}
.sopt{height:31px;border-radius:8px;background:var(--gray-soft);font-size:10.5px;font-weight:800;color:#5C636D;
  text-align:center;letter-spacing:-.3px;display:flex;align-items:center;justify-content:center}

.sr-b{flex:1;min-width:0}
.sr-t{font-size:13.5px;font-weight:800;letter-spacing:-.2px}
.sr-d{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:0;line-height:1.3}
/* ---------- 시트 하단 초록 CTA ---------- */
.cta-hero{position:relative;overflow:hidden;display:flex;width:100%;align-items:center;justify-content:center;
  height:50px;border-radius:15px;color:#fff;font-size:15px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;
  background:linear-gradient(152deg,#128A53 0%,#0C6B41 52%,#08492C 100%);
  box-shadow:0 10px 22px rgba(8,73,44,.26),inset 0 1px 0 rgba(255,255,255,.18)}
.cta-hero:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;

.cta-hero:active{transform:translateY(1px)}
.cta-hero .cta-go{position:absolute;right:13px;top:50%;transform:translateY(-50%);display:flex;opacity:.85}
.cta-hero .cta-go svg{width:16px;height:16px}
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:rgba(15,20,26,.94);color:#fff;font-size:13px;font-weight:700;padding:11px 16px;border-radius:14px;
  z-index:90;opacity:0;transition:opacity .18s,transform .18s;max-width:84vw;text-align:center;pointer-events:none;
  box-shadow:0 10px 24px rgba(0,0,0,.24)}

  padding:7px 11px;border-radius:10px}

/* ---------- misc ---------- */
.fab{position:absolute;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;
  background:linear-gradient(160deg,#12975A,#0B6A42);color:#fff;display:none;align-items:center;justify-content:center;

.quick{background:linear-gradient(180deg,#F5F9FF,#EDF4FF);border:1px solid #D3E2FF;border-radius:16px;padding:12px;margin-bottom:14px}

.parsebar{margin-top:8px;font-size:11.5px;font-weight:700;color:var(--ink2);background:#fff;border:1px dashed #C9D8F0;border-radius:10px;padding:8px 10px;line-height:1.5}

.mrow .mi{display:flex;flex-direction:column;justify-content:center}

.crow{display:flex;gap:6px;align-items:center;margin-top:8px}

/* ---------- 날짜 / 숫자 유틸 ---------- */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseISO(s){ var p = String(s).split('-'); return new Date(+p[0], (+p[1]) - 1, +p[2]); }
function addDays(s, n){ var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function addMonths(s, n){
  var d = parseISO(s), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return iso(d);
}
function todayISO(){ return iso(new Date()); }
function dowOf(s){ return parseISO(s).getDay(); }
function minOf(t){ var p = String(t || '00:00').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m % 60); }
function nowMin(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function nowLocalISO(){
  var d = new Date();
  return iso(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function fmtLong(s){ var d = parseISO(s); return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')'; }
function fmtShort(s){ var d = parseISO(s); return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')'; }
function fmtDot(s){ var d = parseISO(s); return (d.getMonth()+1) + '.' + d.getDate(); }
function fmtNum(s){ var d = parseISO(s); return String(d.getFullYear()).slice(2) + '.' + (d.getMonth()+1) + '.' + d.getDate(); }
function monthLabel(ym){ var p = String(ym).split('-'); return p[0] + '년 ' + (+p[1]) + '월'; }
function hms(m){ if (!m) return '0분'; var h = Math.floor(m/60), r = m % 60; return (h ? h + '시간 ' : '') + (r ? r + '분' : (h ? '' : '0분')); }
function money(n){ if (n === '' || n === null || n === undefined) return '-'; return Number(n).toLocaleString('ko-KR') + '원'; }
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(p){ return (p || 'id') + '_' + Math.random().toString(36).slice(2, 9); }
function durName(d){ return d + '분'; }
function sum(arr, f){ var s = 0; for (var i = 0; i < arr.length; i++) s += f(arr[i]); return s; }

function calSync(){
  if (!state.calendarSync || typeof state.calendarSync !== 'object') state.calendarSync = {};
  var cs = state.calendarSync;
  cs.enabled = (cs.enabled === true);
  var ok = false;
  for (var i = 0; i < CAL_TARGETS.length; i++) if (CAL_TARGETS[i][0] === cs.target) ok = true;
  if (!ok) cs.target = 'both';
  return cs;
}
function calTargetLabel(v){
  for (var i = 0; i < CAL_TARGETS.length; i++) if (CAL_TARGETS[i][0] === v) return CAL_TARGETS[i][1];
  return '둘 다';
}

/* 레슨 하나 → 캘린더 내용 */
function calSummary(s){
  return '[골프 레슨] ' + memberName(s.memberId) + ' · ' + s.durationMinutes + '분';
}
function calDescLines(s){
  var m = memberById(s.memberId), pkg = pkgById(s.packageId), out = [];
  var rem = '';
  if (pkg) rem = ' · 잔여 ' + pkg.remainingSessions + '/' + pkg.totalSessions + '회';
  else { var tr = totalRemaining(s.memberId); if (tr) rem = ' · 잔여 ' + tr + '회'; }
  out.push('회원: ' + (m ? m.name : '회원') + rem);
  out.push('레슨: ' + s.durationMinutes + '분');
  if (s.location) out.push('장소: ' + s.location);
  if (s.memo) out.push('메모: ' + s.memo);
  out.push('레슨 관리 앱에서 추가');
  return out;
}
function calDescText(s){ return calDescLines(s).join('\n'); }

/* KST 벽시걸 → 20261124T150000 (기기 시간대와 무관하게 계산) */
function calStamp(date, time, addMin){
  var y = +String(date).slice(0,4), mo = +String(date).slice(5,7), d = +String(date).slice(8,10);
  var p = String(time || '00:00').split(':');
  var t = (+p[0]) * 60 + (+p[1] || 0) + (addMin || 0);
  var base = new Date(Date.UTC(y, mo - 1, d));
  base.setUTCDate(base.getUTCDate() + Math.floor(t / 1440));
  var m = ((t % 1440) + 1440) % 1440;
  return base.getUTCFullYear() + pad(base.getUTCMonth() + 1) + pad(base.getUTCDate()) +
    'T' + pad(Math.floor(m / 60)) + pad(m % 60) + '00';
}
function calUtcNow(){
  var d = new Date();
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
    pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
}

/* RFC 5545 문자 이스케이프 · 75옥텟 줄바꿈 */
function icsEsc(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
    .replace(/\r\n|\r|\n/g, '\\n');
}
function utf8Len(ch){
  var c = ch.charCodeAt(0);
  if (c < 0x80) return 1;
  if (c < 0x800) return 2;
  if (c < 0x10000) return 3;
  return 4;
}
function icsFold(line){
  var out = '', cur = '', n = 0;
  for (var i = 0; i < line.length; i++){
    var ch = line.charAt(i), len = utf8Len(ch);
    if (n + len > 73) { out += cur + '\r\n '; cur = ''; n = 1; }   /* 접힘 줄은 앞 공백 1옥텟 포함 */
    cur += ch; n += len;
  }
  return out + cur;
}
function icsUid(s){ return String(s.id) + '@golf-lesson-app'; }

function icsText(s){
  var L = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Golf Lesson App//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VTIMEZONE','TZID:Asia/Seoul',
    'BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0900','TZOFFSETTO:+0900','TZNAME:KST','END:STANDARD',
    'END:VTIMEZONE',
    'BEGIN:VEVENT','UID:' + icsEsc(icsUid(s)),'DTSTAMP:' + calUtcNow(),
    'DTSTART;TZID=Asia/Seoul:' + calStamp(s.date, s.startTime, 0),
    'DTEND;TZID=Asia/Seoul:' + calStamp(s.date, s.startTime, s.durationMinutes),
    'SUMMARY:' + icsEsc(calSummary(s))
  ];
  if (s.location) L.push('LOCATION:' + icsEsc(s.location));
  L.push('DESCRIPTION:' + icsEsc(calDescText(s)));
  L.push('SEQUENCE:0','STATUS:CONFIRMED','TRANSP:OPAQUE','END:VEVENT','END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function icsFileName(s){ return 'golf-lesson-' + String(s.date).replace(/-/g, '') + '-' + String(s.startTime).replace(':', '') + '.ics'; }

function addToAppleCalendar(s){
  try {
    var blob = new Blob([icsText(s)], { type:'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = icsFileName(s); a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ try { URL.revokeObjectURL(url); } catch(e){} }, 30000);
    return true;
  } catch(e){ return false; }
}

function gcalUrl(s){
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent(calSummary(s)) +
    '&dates=' + calStamp(s.date, s.startTime, 0) + '/' + calStamp(s.date, s.startTime, s.durationMinutes) +
    '&ctz=Asia/Seoul' +
    (s.location ? '&location=' + encodeURIComponent(s.location) : '') +
    '&details=' + encodeURIComponent(calDescText(s));
}
function addToGoogleCalendar(s){
  var u = gcalUrl(s), w = null;
  try { w = window.open(u, '_blank'); } catch(e){ w = null; }
  if (!w) { try { w = window.open(u); } catch(e2){ w = null; } }
  return !!w;
}

function paintCalSetting(){

/* ---------- 상태 ---------- */
var state = null;
var ui = { tab:'today', date: todayISO(), memberId: null, search:'', month: todayISO().slice(0,7),
  stats:'lesson', revUnit:'month', revOpen:'' };

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function load(){
  var fresh = false;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.members && s.packages && s.sessions) state = s;
    }
  } catch(e){}
  if (!state) { state = buildDemo(); fresh = true; }
  /* 일반취소는 일정에 남기지 않는다 — 예전 데이터에 남아 있던 일반취소 레슨은 한 번만 정리 */
  if (!state.migExcused) {
    var keep = state.sessions.filter(function(x){ return x.status !== 'excused_cancel'; });
    if (keep.length !== state.sessions.length) state.sessions = keep;
    state.migExcused = 1;
    fresh = true;
  }
  if (fresh) save();
}

/* ---------- 조회 ---------- */
function memberById(id){ for (var i=0;i<state.members.length;i++) if (state.members[i].id === id) return state.members[i]; return null; }
function pkgById(id){ for (var i=0;i<state.packages.length;i++) if (state.packages[i].id === id) return state.packages[i]; return null; }
function memberName(id){ var m = memberById(id); return m ? m.name : '(삭제된 회원)'; }
function memberPkgs(id){ return state.packages.filter(function(p){ return p.memberId === id; }); }
function activePkgs(id){ return memberPkgs(id).filter(function(p){ return p.remainingSessions > 0; }); }
function totalRemaining(id){ return sum(activePkgs(id), function(p){ return p.remainingSessions; }); }
function sessionsByDate(d){
  return state.sessions.filter(function(s){ return s.date === d; })
    .sort(function(a,b){ return minOf(a.startTime) - minOf(b.startTime); });
}
function sessionsByMember(id){
  return state.sessions.filter(function(s){ return s.memberId === id; })
    .sort(function(a,b){ if (a.date === b.date) return minOf(b.startTime) - minOf(a.startTime); return a.date < b.date ? 1 : -1; });
}
function settlementFor(d){ for (var i=0;i<state.settlements.length;i++) if (state.settlements[i].date === d) return state.settlements[i]; return null; }
function sessionEnd(s){ return minOf(s.startTime) + s.durationMinutes; }

/* 상태 변경 = 차감 반영의 유일한 통로 (정산·빠른 버튼·수정 모두 여기로) */
function applyStatus(s, status){
  var meta = STATUS[status];
  if (!meta) return false;
  var was = !!s.deducted, next = !!meta.deducted;
  var pkg = pkgById(s.packageId);
  if (pkg && was !== next) {
    if (next) pkg.remainingSessions = Math.max(0, pkg.remainingSessions - 1);
    else pkg.remainingSessions = Math.min(pkg.totalSessions, pkg.remainingSessions + 1);
  }
  s.status = status;
  s.deducted = next;
  return true;
}

/* 일반취소 = 차감 되돌림 + 일정에서 제거 (오늘·캘린더에서 바로 사라지고 그 시간이 비워짐) */
function cancelExcused(s){
  if (!s) return null;
  var pkg = pkgById(s.packageId);
  var snap = JSON.parse(JSON.stringify(s));       /* 되돌리기용 원본 */
  var remBefore = pkg ? pkg.remainingSessions : null;
  var wasDeducted = !!s.deducted;
  var mname = memberName(s.memberId);
  applyStatus(s, 'excused_cancel');               /* 차감됐던 회차는 여기서 +1 복구 */
  var removed = false;
  for (var i = state.sessions.length - 1; i >= 0; i--) {
    if (state.sessions[i].id === s.id) { state.sessions.splice(i, 1); removed = true; break; }
  }
  /* 통계용 기록만 남긴다(일정·차감에는 영향 없음) */
  if (!state.cancelLog) state.cancelLog = [];
  var log = { date: snap.date, memberId: snap.memberId, at: nowLocalISO() };
  state.cancelLog.push(log);
  return { snap: snap, wasDeducted: wasDeducted, removed: removed, memberName: mname,
           remaining: pkg ? pkg.remainingSessions : null, remBefore: remBefore, log: log };
}

/* 직전 일반취소 한 건 되돌리기 (토스트의 '되돌리기') */
function undoCancelExcused(ctx){
  if (!ctx || !ctx.snap) return false;
  var back = ctx.snap;
  if (findSession(back.id)) return false;         /* 이미 되살아났으면 중복 방지 */
  state.sessions.push(back);
  var pkg = pkgById(back.packageId);
  if (pkg && ctx.remBefore !== null && ctx.remBefore !== undefined) pkg.remainingSessions = ctx.remBefore;
  if (state.cancelLog && ctx.log) {
    for (var i = state.cancelLog.length - 1; i >= 0; i--) {
      if (state.cancelLog[i] === ctx.log) { state.cancelLog.splice(i, 1); break; }
    }
  }
  return true;
}

/* ---------- 데모 데이터 ---------- */
function pastDates(endISO, count, dows, fromISO){
  var out = [], d = endISO, guard = 0;
  while (out.length < count && guard < 500) {
    if (dows.indexOf(dowOf(d)) >= 0 && d >= fromISO) out.push(d);
    d = addDays(d, -1); guard++;
  }
  return out.reverse();
}

var STOP_WORDS = ['다음주','이번주','다다음주','다음','이번','오전','오후','아침','저녁','밤','낮','요일','시','분','때','쯤',

  '월요일','화요일','수요일','목요일','금요일','토요일','일요일'];
function isNameStopWord(v){ return STOP_WORDS.indexOf(v) >= 0; }

function isRegionWord(v){
  if (REGION_LIST.indexOf(v) >= 0) return true;
  if (!v || v.length < 3 || v.length > 6) return false;
  if (isNameStopWord(v)) return false;
  return /(특별시|광역시|시|군|구|읍|면)$/.test(v);
}
function isLevelWord(v){ return LEVEL_LIST.indexOf(v) >= 0; }

function parseMemberLine(text){
  var raw = String(text || '');
  var res = { name:'', duration:0, durationRaw:0, sessions:0, gender:'', region:'', phone:'', level:'', extra:'', found:{} };
  var t = ' ' + raw.replace(/[,/·|;\t\n]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';

  var m;
  if ((m = t.match(/0?1[016789][-\s]?\d{3,4}[-\s]?\d{4}/))) {
    res.phone = m[0].replace(/\s/g, '-');
    res.found.phone = true;
    t = t.replace(m[0], ' ');
  }
  if ((m = t.match(/(\d{2,3})\s*분/))) {
    var mm = parseInt(m[1], 10);
    if (mm >= 10 && mm <= 240) {
      res.durationRaw = mm;
      res.duration = (mm <= 35 ? 25 : 55);
      res.found.duration = true;
    }
    t = t.replace(m[0], ' ');
  }
  if ((m = t.match(/(\d{1,3})\s*(?:회권|회짜리|회분|회|번)/))) {
    var n = parseInt(m[1], 10);
    if (n > 0 && n <= 200) { res.sessions = n; res.found.sessions = true; }
    t = t.replace(m[0], ' ');
  }
  if ((m = t.match(/(남성|남자|여성|여자)/))) {
    res.gender = (m[1].charAt(0) === '남' ? 'male' : 'female');
    res.found.gender = true;
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/\s(남|여)(?=\s)/))) {
    res.gender = (m[1] === '남' ? 'male' : 'female');
    res.found.gender = true;
    t = t.replace(' ' + m[1] + ' ', ' ');
  }
  if ((m = t.match(/\s(왕초보|입문|초급|중급|상급|프로)(?=\s)/))) {
    res.level = (m[1] === '왕초보' ? '입문' : m[1]);
    res.found.level = true;
    t = t.replace(' ' + m[1] + ' ', ' ');
  }

  var toks = t.replace(/\s+/g, ' ').trim().split(' ').filter(function(x){ return !!x; });
  var rest = [];
  toks.forEach(function(tok){
    var v = tok.replace(/[()\[\]{}"'`~!@#$%^&*+=?_<>:;,.\u3000]/g, '')
               .replace(/(님|씨|회원)$/, '').trim();
    if (!v) return;
    if (!res.name && /^[가-힣]{2,4}$/.test(v) && !isRegionWord(v) && !isLevelWord(v) && !isNameStopWord(v)) { res.name = v; res.found.name = true; return; }
    if (!res.name && /^[A-Za-z][A-Za-z .]{1,14}$/.test(v)) { res.name = v; res.found.name = true; return; }
    if (!res.region && isRegionWord(v)) { res.region = v; res.found.region = true; return; }
    rest.push(v);
  });

  if (!res.region) {
    for (var i = 0; i < rest.length; i++) {
      if (isRegionWord(rest[i])) { res.region = rest[i]; rest.splice(i, 1); res.found.region = true; break; }
    }
  }
  res.extra = rest.join(' ').trim();
  return res;
}

function parseSummary(p){
  var bits = [];
  bits.push(p.found.name ? p.name : '이름 ?');
  bits.push((p.found.duration ? durName(p.duration) : '55분(기본)') + (p.found.duration && p.durationRaw && p.durationRaw !== p.duration ? ' ← ' + p.durationRaw + '분' : ''));
  bits.push(p.found.sessions ? p.sessions + '회' : '횟수 ?');
  if (p.found.gender) bits.push(p.gender === 'male' ? '남' : '여');
  if (p.found.region) bits.push(p.region);
  if (p.found.level) bits.push(p.level);
  return bits.join(' · ');
}

/* ---------- 토스트 ---------- */
var toastTimer = null;
function toast(msg, opt){
  var el = document.getElementById('toast');
  var ms = (opt && opt.ms) || 2400;
  if (opt && opt.act) {
    el.innerHTML = '<span class="ts-msg">' + esc(msg) + '</span>' +
      '<button class="ts-act" data-act="' + esc(opt.act) + '">' + esc(opt.label || '되돌리기') + '</button>';
    el.classList.add('act');
  } else {
    el.textContent = msg;
    el.classList.remove('act');
  }
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, ms);
}

/* ---------- 시트(바닥에서 올라오는 창) ---------- */
var sheetStack = [];
function openSheet(opts){
  var wrap = document.createElement('div');
  wrap.className = 'sheetwrap';
  var sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML =
    '<div class="grab"></div>' +
    '<div class="sh"><h3></h3><button class="iconbtn" data-act="sheet-close" aria-label="닫기">' + ICON.x + '</button></div>' +
    '<div class="sub" style="display:none"></div>' +
    '<div class="sb"></div>' +
    '<div class="sf" style="display:none"></div>';
  wrap.appendChild(sheet);
  sheet.querySelector('h3').textContent = opts.title || '';
  var subEl = sheet.querySelector('.sub');
  if (opts.sub) { subEl.innerHTML = opts.sub; subEl.style.display = ''; }
  var bodyEl = sheet.querySelector('.sb');
  var footEl = sheet.querySelector('.sf');
  if (opts.body !== undefined) bodyEl.innerHTML = opts.body;
  if (opts.footer) { footEl.innerHTML = opts.footer; footEl.style.display = ''; }
  document.getElementById('sheetRoot').appendChild(wrap);
  sheetStack.push(wrap);
  wrap.addEventListener('click', function(e){ if (e.target === wrap) closeSheetEl(wrap); });
  return { el: wrap, sheet: sheet, body: bodyEl, footer: footEl, close: function(){ closeSheetEl(wrap); } };
}

function closeSheetEl(wrap){
  if (!wrap) return;
  var i = sheetStack.indexOf(wrap);
  if (i >= 0) sheetStack.splice(i, 1);
  if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
  if (memberCtx && memberCtx.sh && memberCtx.sh.el === wrap) { stopVoice(); memberCtx = null; }
  if (settleCtx && settleCtx.sh && settleCtx.sh.el === wrap) settleCtx = null;
  if (addCtx && addCtx.sh && addCtx.sh.el === wrap) addCtx = null;
  if (bookCtx && bookCtx.sh && bookCtx.sh.el === wrap) bookCtx = null;
  if (pkgCtx && pkgCtx.sh && pkgCtx.sh.el === wrap) pkgCtx = null;
  if (qaCtx && qaCtx.sh && qaCtx.sh.el === wrap) { stopQaVoice(); qaCtx = null; }
  if (priceCtx && priceCtx.sh && priceCtx.sh.el === wrap) priceCtx = null;
  if (renewCtx && renewCtx.sh && renewCtx.sh.el === wrap) renewCtx = null;
  if (pickCtx && pickCtx.sh && pickCtx.sh.el === wrap) pickCtx = null;
  if (dpCtx && dpCtx.sh && dpCtx.sh.el === wrap) dpCtx = null;
  if (tpCtx && tpCtx.sh && tpCtx.sh.el === wrap) tpCtx = null;
}
function closeTopSheet(){
  if (!sheetStack.length) return;
  closeSheetEl(sheetStack[sheetStack.length - 1]);
}
function closeAllSheets(){
  sheetStack.slice().forEach(closeSheetEl);
}
function findSession(id){

      (d25 ? '<span class="pillstat">25분 ' + d25 + '</span>' : '') +
      '<span class="pillstat">' + (und ? '미정 ' + und + '건' : (list.length ? '전원 확인' : '레슨 없음')) + '</span>' +
    '</div>' +

        '<span class="hb-sub">' + (settled
          ? '차감 ' + settled.deducted + '회 반영 · ' + timeOfISO(settled.settledAt) + ' 정산'
          : '완료 · 당일취소 · 노쇼를 한 번에 차감 처리') + '</span></span>' +
      '<span class="hb-go">' + ICON.chev + '</span>' +
    '</button>' +
  '</div>';

  /* 알림 */
  var low = [], exp = [];
  state.members.forEach(function(m){
    var tr = totalRemaining(m.id);
    if (tr > 0 && tr <= LOW_LIMIT) low.push({ m: m, rem: tr });
  });
  low.sort(function(a, b){ return a.rem - b.rem; });
  state.packages.forEach(function(p){
    if (p.remainingSessions > 0 && p.expiryDate < addDays(t, 21)) {
      exp.push(memberName(p.memberId) + ' ' + fmtDot(p.expiryDate) + ' 만료');
    }
  });
  if (low.length) {
    h += '<div class="golden"><div class="golden-hd">' + ICON.flag +
      '재등록 골든타임 · 잔여 ' + LOW_LIMIT + '회 이하 ' + low.length + '명</div>' +
      low.slice(0, 4).map(function(x){
        return '<button class="golden-row" data-act="renew-open" data-id="' + x.m.id + '">' +
          '<span class="golden-n">' + esc(x.m.name) + '</span>' +
          '<span class="golden-r">잔여 ' + x.rem + '회</span>' +
          '<span class="golden-go">연장</span></button>';

      (low.length > 4 ? '<div class="golden-more">회원 탭에서 ' + (low.length - 4) + '명 더 볼 수 있어요</div>' : '') +
      '</div>';
  }
  if (exp.length) {
    h += '<div class="alert blue"><span class="ai">' + ICON.flag + '</span><div>' +
      '<div class="at">만료 예정 수강권</div><div class="ad">' + esc(exp.join(' · ')) + '</div></div></div>';
  }

  h += '<div class="sec"><h2>오늘 시간표</h2><span class="aside">' + (list.length ? '시간순' : '비어 있음') + '</span></div>';
  if (!list.length) {
    h += '<div class="empty"><div class="et">오늘은 예약이 없어요</div><div class="ed">캘린더에서 새 레슨을 잡아보세요.</div></div>';
  } else {
    h += list.map(lessonCard).join('');
  }

  if (settled) {
    h += '<div class="card mt10">' +
      '<div class="nameline"><span class="name" style="font-size:14px">오늘 정산 완료</span>' +
        '<span class="st st-completed">' + timeOfISO(settled.settledAt) + ' 마감</span></div>' +
      '<div class="chiprow mt10">' +
        '<span class="legend"><span class="lg">완료 ' + (settled.counts.completed || 0) + '</span>' +
        '<span class="lg">당일취소 ' + (settled.counts.same_day_cancel || 0) + '</span>' +
        '<span class="lg">노쇼 ' + (settled.counts.no_show || 0) + '</span>' +
        '<span class="lg">일반취소 ' + (settled.counts.excused_cancel || 0) + '</span>' +
        '<span class="lg">보강 ' + (settled.counts.makeup || 0) + '</span></span>' +
      '</div>' +
      '<div class="hint">차감 ' + settled.deducted + '회가 오늘 잔여 횟수에 반영됐어요. 잘못 찍었다면 위 버튼으로 다시 정산하면 차이가 자동으로 맞춰집니다.</div>' +
    '</div>';
  }

  h += '<div class="sguide">' +
    '<div class="sguide-hd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.4"/><circle cx="12" cy="8.1" r=".9" fill="currentColor" stroke="none"/></svg>' +
      '<h2 class="t">정산 기준</h2></div>' +
    '<div class="sguide-row"><span class="sguide-badge ded">1회 차감</span>' +
      '<span class="sguide-items">완료<span class="sep">·</span>당일취소<span class="sep">·</span>노쇼</span></div>' +
    '<div class="sguide-row"><span class="sguide-badge keep">미차감</span>' +
      '<span class="sguide-items">일반취소<span class="sep">·</span>보강</span></div>' +
    '<div class="sguide-note">하루가 끝나면 마감 정산에서 한 번에 확정해요.</div>' +
  '</div>';

  return h;
}

function lessonCard(s){
  var m = memberById(s.memberId), pkg = pkgById(s.packageId);
  var st = STATUS[s.status] || STATUS.scheduled;
  var rem = pkg ? pkg.remainingSessions : 0, tot = pkg ? pkg.totalSessions : 0;

              '<button class="btn btn-sm btn-outline" data-act="status-sheet" data-sid="' + s.id + '">취소·노쇼</button>';

  }

    '<div class="timecol"><div class="t">' + s.startTime + '</div><div class="d">' + s.durationMinutes + '분</div></div>' +
    '<div class="body">' +
      '<div class="nameline">' +

        '<span class="st st-' + st.cls + '">' + st.label + '</span>' +
      '</div>' +
      '<div class="meta">' + (pkg ? durName(pkg.durationMinutes) + ' 수강권 · 잔여 <b>' + rem + '</b>/' + tot + '회' : '수강권 없음') +
        (s.location ? ' · ' + esc(s.location) : '') + memo + '</div>' +
      '<div class="bar"><i class="' + (rem <= LOW_LIMIT ? 'low' : '') + '" style="width:' + pct + '%"></i></div>' +
      '<div class="chiprow mt10">' + actions +

      '<button class="btn btn-outline btn-block" data-act="cal-sheet" data-sid="' + s.id + '" style="margin-bottom:8px">📅 내 캘린더에 추가</button>' +

  });

/* =========================================================
   오늘 마감 정산
   ========================================================= */
var settleCtx = null;
var lastCancel = null;   /* 직전 일반취소 건 (토스트 '되돌리기'용) */

function openSettleSheet(dateStr){
  var list = sessionsByDate(dateStr);
  if (!list.length) { toast('이 날은 예약된 레슨이 없어요'); return; }
  var sel = { date: dateStr, decisions: {} };
  list.forEach(function(s){ if (s.status !== 'scheduled') sel.decisions[s.id] = s.status; });
  settleCtx = { sel: sel, list: list };
  var sh = openSheet({ title:'오늘 마감 정산', sub: fmtLong(dateStr) + ' · 레슨 ' + list.length + '건' });
  settleCtx.sh = sh;
  paintSettle();
}

function paintSettle(){
  if (!settleCtx || !settleCtx.sh) return;
  var sc = settleCtx.sh.body.scrollTop;
  settleCtx.sh.body.innerHTML = settleBodyHTML(settleCtx.sel, settleCtx.list);
  settleCtx.sh.footer.style.display = '';
  settleCtx.sh.footer.innerHTML = settleFooterHTML(settleCtx.sel, settleCtx.list);
  settleCtx.sh.body.scrollTop = sc;
}

function settleTally(sel, list){
  var ded = 0, keep = 0, und = 0;
  list.forEach(function(s){
    var c = sel.decisions[s.id];
    if (!c) { und++; return; }
    if (STATUS[c].deducted) ded++; else keep++;
  });
  return { ded: ded, keep: keep, und: und, total: list.length };
}

function settleBodyHTML(sel, list){
  var rows = list.map(function(s){
    var m = memberById(s.memberId), pkg = pkgById(s.packageId);
    var cur = sel.decisions[s.id];
    var rem = pkg ? pkg.remainingSessions : 0;
    var proj = rem;
    if (cur) proj = Math.max(0, rem - (STATUS[cur].deducted ? 1 : 0) + (s.deducted ? 1 : 0));
    var opts = STATUS_KEYS.map(function(k){
      return '<button class="sopt' + (cur === k ? ' on' : '') + (cur === k && STATUS[k].deducted ? ' opt-ded' : '') +
        '" data-act="settle-set" data-sid="' + s.id + '" data-status="' + k + '">' + STATUS[k].label + '</button>';
    }).join('');
    return '<div class="srow' + (cur ? '' : ' pend') + '">' +
      '<div class="srowh">' +
        '<span class="sname">' + esc(m ? m.name : '-') + '</span>' +
        '<span class="dur' + (s.durationMinutes === 55 ? ' d55' : '') + '">' + s.durationMinutes + '분</span>' +
        '<span class="stime">' + s.startTime + '</span>' +
        '<span class="sproj' + (cur ? '' : ' dim') + '">' + (cur ? '잔여 ' + rem + ' → <b>' + proj + '</b>' : '미정') + '</span>' +
      '</div>' +
      '<div class="sopts">' + opts + '</div>' +
    '</div>';
  }).join('');
  return '<div class="formnote">완료 · 당일취소 · 노쇼는 횟수를 <b>차감</b>하고, 일반취소 · 보강은 <b>차감하지 않아요</b>.<br>일반취소로 확정하면 그 레슨은 오늘·캘린더에서 지워지고, 이미 처리된 레슨을 바꿔 정산하면 차이가 잔여 횟수에 자동 반영됩니다.</div>' + rows;
}

function settleFooterHTML(sel, list){
  var t = settleTally(sel, list);
  var dis = t.und ? ' disabled' : '';
  var h = '<div class="sumline"><span>차감 <b>' + t.ded + '회</b> · 미차감 <b>' + t.keep + '회</b>' +
    (t.und ? ' · 미정 <b>' + t.und + '건</b>' : '') + '</span><span>' + t.total + '건</span></div>';
  if (t.und) {
    h += '<div class="hintline">미정 ' + t.und + '건을 고르면 정산할 수 있어요.</div>' +
      '<button class="btn btn-sm btn-ghost btn-block" data-act="settle-all">남은 레슨 모두 완료로</button>' +
      '<div style="height:8px"></div>';
  }
  h += '<button class="btn btn-primary btn-block" data-act="settle-apply"' + dis + '>정산 완료 · 차감 ' + t.ded + '회 반영</button>';
  return h;
}

function settleApply(){
  if (!settleCtx) return;
  var t = settleTally(settleCtx.sel, settleCtx.list);
  if (t.und) { toast('미정 ' + t.und + '건을 먼저 골라주세요'); return; }
  var counts = { completed:0, same_day_cancel:0, no_show:0, excused_cancel:0, makeup:0 };
  var deducted = 0, cleared = 0;
  settleCtx.list.forEach(function(s){
    var target = settleCtx.sel.decisions[s.id];
    if (!target) return;
    if (target === 'excused_cancel') {
      cancelExcused(s);                  /* 차감 복구 + 일정에서 제거 */
      cleared++;
    } else {
      applyStatus(s, target);
    }
    counts[target] = (counts[target] || 0) + 1;
    if (STATUS[target].deducted) deducted++;
    s.settledAt = nowLocalISO();
  });
  var rec = settlementFor(settleCtx.sel.date);
  if (!rec) { rec = { date: settleCtx.sel.date }; state.settlements.push(rec); }
  rec.settledAt = nowLocalISO();
  rec.counts = counts;
  rec.deducted = deducted;
  state.settlements.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  save();
  var sh = settleCtx.sh;
  settleCtx = null;
  if (sh) sh.close();
  render();
  toast('마감 정산 완료 · 차감 ' + deducted + '회 반영' + (cleared ? ' · 일반취소 ' + cleared + '건 일정에서 지움' : ''));
}

/* =========================================================
   캘린더 탭
   ========================================================= */
function viewCalendar(){
  var sel = ui.date;
  var d = parseISO(sel);
  var y = d.getFullYear(), m = d.getMonth();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var startPad = new Date(y, m, 1).getDay();
  var rows = Math.ceil((startPad + daysInMonth) / 7);
  var gridStart = new Date(y, m, 1 - startPad);

  var byDate = {};
  state.sessions.forEach(function(s){
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  });

  function dotsFor(key){
    var arr = byDate[key];
    if (!arr || !arr.length) return '<div class="dots"></div>';
    var hasR = false, hasA = false, hasG = false, hasS = false, hasGray = false;
    arr.forEach(function(s){
      if (s.status === 'no_show') hasR = true;
      else if (s.status === 'same_day_cancel') hasA = true;
      else if (s.status === 'completed') hasG = true;
      else if (s.status === 'excused_cancel' || s.status === 'makeup') hasGray = true;
      else hasS = true;
    });
    var out = '';
    if (hasR) out += '<i class="r"></i>';
    if (hasA) out += '<i class="a"></i>';
    if (hasG || hasS) out += '<i></i>';
    if (hasGray) out += '<i class="g"></i>';
    return '<div class="dots">' + out + '</div>';
  }

  var cells = '';
  for (var i = 0; i < rows * 7; i++) {
    var cd = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    var key = iso(cd);
    var out = cd.getMonth() !== m;
    var wd = cd.getDay();
    var cls = 'day' + (out ? ' out' : '') + (key === todayISO() ? ' today' : '') + (key === sel ? ' sel' : '') +
      (wd === 0 ? ' sun' : (wd === 6 ? ' sat' : ''));
    cells += '<button class="' + cls + '" data-act="day" data-date="' + key + '">' + cd.getDate() + dotsFor(key) + '</button>';
  }

  var list = sessionsByDate(sel);
  var d25 = list.filter(function(s){ return s.durationMinutes === 25; }).length;

  var h = '<div class="monhdr"><div class="m">' + y + '년 ' + (m + 1) + '월</div>' +
    '<div class="navs">' +
      '<button class="iconbtn" data-act="month" data-delta="-1" aria-label="이전 달">' + ICON.back + '</button>' +
      '<button class="btn btn-sm btn-outline" data-act="month" data-delta="0">오늘</button>' +
      '<button class="iconbtn" data-act="month" data-delta="1" aria-label="다음 달" style="transform:rotate(180deg)">' + ICON.back + '</button>' +
    '</div></div>';

  h += '<div class="cal"><div class="wk"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>' +
    '<div class="grid">' + cells + '</div></div>';

  h += '<div class="dayhead"><div><div class="dh">' + fmtShort(sel) + '</div>' +
    '<div class="ds">' + (list.length ? '레슨 ' + list.length + '건 · 25분 ' + d25 + ' · 55분 ' + (list.length - d25) : '예약 없음') + '</div></div>' +
    '<button class="btn btn-sm btn-primary" data-act="book-open">' + ICON.plus + ' 레슨 예약</button></div>';

  h += dayListHTML(sel);
  h += '<div class="sec" style="margin-top:16px"><h2>시간표</h2><span class="aside">레슨을 누르면 상태 변경</span></div>';
  h += timelineHTML(sel);
  h += '<div class="legend" style="margin-top:14px">' +    '<span class="lg">예정</span><span class="lg">완료</span><span class="lg">당일취소</span><span class="lg">노쇼</span><span class="lg">보강</span></div>';
  h += '<div class="hint">오른쪽 아래 <b>+</b> 버튼으로 한 줄 입력해 레슨을 바로 추가할 수 있어요.</div>';
  h += '<div style="height:60px"></div>';
  return h;
}

/* 선택한 날짜의 일정 목록 (시간 · 구분 · 회원 · 장소 · 상태) */
function dayListHTML(dateStr){
  var list = sessionsByDate(dateStr);
  if (!list.length) return '';
  return '<div class="card" style="padding:2px 14px;margin-top:10px">' + list.map(function(s){
    var st = STATUS[s.status] || STATUS.scheduled;
    return '<button class="drow" data-act="status-sheet" data-sid="' + s.id + '">' +
      '<span class="drow-t">' + s.startTime + '</span>' +
      '<span class="drow-b">' +
        '<span class="drow-n">' + esc(memberName(s.memberId)) +
          '<span class="dur' + (s.durationMinutes === 55 ? ' d55' : '') + '">' + s.durationMinutes + '분</span></span>' +
        '<span class="drow-m">' + esc(s.location || '장소 미입력') + '</span>' +
      '</span>' +
      '<span class="st st-' + st.cls + '">' + st.label + '</span></button>';
  }).join('') + '</div>';
}

function timelineHTML(dateStr){
  var list = sessionsByDate(dateStr);
  if (!list.length) {
    return '<div class="empty"><div class="et">이 날은 예약이 없어요</div>' +
      '<div class="ed">레슨을 잡으면 시간표에 표시됩니다.</div></div>';
  }

  var startH = 24, endH = 0;
  list.forEach(function(s){
    startH = Math.min(startH, Math.floor(minOf(s.startTime) / 60));
    endH = Math.max(endH, Math.ceil(sessionEnd(s) / 60));
  });
  startH = Math.max(DAY_START, startH - 1);
  endH = Math.min(DAY_END, Math.max(endH + 1, startH + 4));
  var height = (endH - startH) * HOUR_H;

  var lines = '';
  for (var hh = startH; hh <= endH; hh++) {
    lines += '<div class="tlh" style="top:' + ((hh - startH) * HOUR_H) + 'px"><span>' + pad(hh) + ':00</span></div>';
  }
  var nowTop = (nowMin() - startH * 60) / 60 * HOUR_H;
  if (dateStr === todayISO() && nowTop >= 0 && nowTop <= height) {
    lines += '<div class="nowline" style="top:' + nowTop + 'px"></div>';
  }

  var items = list.map(function(s){
    return { s: s, a: minOf(s.startTime), b: sessionEnd(s), lane: 0, placed: false };
  });
  items.forEach(function(it){
    var lane = 0;
    while (lane < 12) {
      var clash = false;
      for (var i = 0; i < items.length; i++) {
        var o = items[i];
        if (!o.placed || o.lane !== lane) continue;
        if (!(it.b <= o.a || it.a >= o.b)) { clash = true; break; }
      }
      if (!clash) break;
      lane++;
    }
    it.lane = lane;
    it.placed = true;
  });
  var laneCount = 1;
  items.forEach(function(it){ laneCount = Math.max(laneCount, it.lane + 1); });

  var blocks = items.map(function(it){
    var s = it.s;
    var top = (it.a - startH * 60) / 60 * HOUR_H;
    var hgt = Math.max(26, (it.b - it.a) / 60 * HOUR_H - 3);
    var w = 100 / laneCount;
    var st = STATUS[s.status] || STATUS.scheduled;
    var pkg = pkgById(s.packageId);
    return '<button class="ev ev-' + st.cls + '" style="top:' + top + 'px;height:' + hgt + 'px;left:' + (it.lane * w).toFixed(3) +
      '%;width:calc(' + w.toFixed(3) + '% - 5px)" data-act="status-sheet" data-sid="' + s.id + '">' +
      '<span class="ev-t">' + s.startTime + ' · ' + s.durationMinutes + '분</span>' +
      '<span class="ev-n">' + esc(memberName(s.memberId)) + '</span>' +
      (hgt >= 56 ? '<span class="ev-m">' + (pkg ? '잔여 ' + pkg.remainingSessions + '회 · ' : '') + esc(s.location || st.label) + '</span>' : '') +
    '</button>';
  }).join('');

  return '<div class="tl" style="height:' + height + 'px">' + lines + '<div class="tlbody">' + blocks + '</div></div>';
}

/* =========================================================

var bookCtx = null;

function defaultTime(){
  var now = new Date();
  var m = Math.ceil((now.getHours() * 60 + now.getMinutes() + 30) / 30) * 30;
  if (m < DAY_START * 60) m = DAY_START * 60;
  if (m > 21 * 60) m = 21 * 60;
  return hhmm(m);
}

function openBookSheet(pre){
  pre = pre || {};
  var date = pre.date || ui.date || todayISO();
  var memberId = pre.memberId || (state.members[0] ? state.members[0].id : '');
  var dur = pre.durationMinutes || 0;
  if (!dur) {
    var aps = activePkgs(memberId);
    dur = aps.length ? aps[0].durationMinutes : 55;
  }
  var time = pre.startTime || defaultTime();
  if (!state.members.length) { toast('먼저 회원을 등록해 주세요'); openAddMemberSheet(null); return; }

  var sh = openSheet({ title:'레슨 예약', sub:'회원 · 날짜 · 시간 · 25분/55분을 고르면 끝나요.' });
  bookCtx = { sh: sh, dur: dur };
  sh.body.innerHTML = bookBodyHTML(date, memberId, time);
  sh.footer.style.display = '';
  sh.footer.innerHTML = '<button class="btn btn-primary btn-block" data-act="book-save">예약 추가</button>';
  refreshBkPkgs();
}

function bookBodyHTML(date, memberId, time){
  var opts = state.members.map(function(m){
    return { v: m.id, label: m.name, sub: '잔여 ' + totalRemaining(m.id) + '회' };
  });
  return '<div class="field"><label>회원</label>' + pickFieldHTML('bkMember', opts, memberId) + '</div>' +
    '<div class="row2">' +
      '<div class="field"><label>날짜</label>' + dateFieldHTML('bkDate', date) + '</div>' +
      '<div class="field"><label>시작 시간</label>' + timeFieldHTML('bkTime', time) + '</div>' +
    '</div>' +
    '<div class="field"><label>수업 시간</label><div class="seg" id="bkDur">' +
      '<button class="' + (bookCtx.dur === 25 ? 'on' : '') + '" data-act="bk-dur" data-v="25">25분</button>' +
      '<button class="' + (bookCtx.dur === 55 ? 'on' : '') + '" data-act="bk-dur" data-v="55">55분</button>' +
    '</div><div class="hint">25분은 짧은 스윙 체크, 55분은 정규 레슨이에요. 다른 단위도 나중에 추가할 수 있습니다.</div></div>' +
    '<div class="field"><label>차감할 수강권</label>'+ pickFieldHTML('bkPkg', [], '') + '<div class="hint" id="bkPkgHint"></div></div>' +
    '<div class="field"><label>메모 (선택)</label><input class="input" id="bkMemo" placeholder="예: 드라이버 위주"></div>' +
    '<div class="field"><label>장소 (선택)</label><input class="input" id="bkLocation" placeholder="예: 분당 실내연습장"></div>' +
    '<div id="bkWarn"></div>';
}

function refreshBkPkgs(){
  var mEl = document.getElementById('bkMember');
  if (!mEl || !bookCtx) return;
  var list = activePkgs(mEl.value).filter(function(p){ return p.durationMinutes === bookCtx.dur; });
  var opts = list.map(function(p){
    var exp = p.expiryDate && p.expiryDate < todayISO();
    return { v: p.id, label: p.durationMinutes + '분 · 잔여 ' + p.remainingSessions + '/' + p.totalSessions + '회',
      sub: fmtDot(p.expiryDate) + (exp ? ' · 만료됨' : ' 만료') };
  });
  var pEl = document.getElementById('bkPkg');
  var prev = pEl ? pEl.value : '', keep = '';
  for (var i = 0; i < opts.length; i++) if (opts[i].v === prev) keep = prev;
  if (!keep && opts.length) keep = opts[0].v;
  setPickOptions('bkPkg', opts, keep);
  if (!opts.length) {
    var lbl = document.getElementById('bkPkgLbl');
    if (lbl) lbl.innerHTML = '<span class="ph">사용 가능한 ' + bookCtx.dur + '분 수강권이 없어요</span>';
  }
  var hint = document.getElementById('bkPkgHint');
  if (hint) hint.innerHTML = list.length
    ? '예약해 두고, 정산에서 완료·당일취소·노쇼로 확정할 때 이 수강권에서 차감돼요.'
    : '회원 정보창에서 ' + bookCtx.dur + '분 수강권을 먼저 추가해 주세요.';
  validateBook();
}

function validateBook(){
  if (!bookCtx) return;
  var dEl = document.getElementById('bkDate'), tEl = document.getElementById('bkTime'), mEl = document.getElementById('bkMember');
  var w = document.getElementById('bkWarn');
  if (!dEl || !tEl || !w) return;
  var msgs = [];
  var date = dEl.value, time = tEl.value;
  if (!mEl || !mEl.value) msgs.push('회원을 골라주세요.');
  if (!date) msgs.push('날짜를 골라주세요.');
  if (!time) msgs.push('시작 시간을 골라주세요.');
  if (date && time) {
    var a = minOf(time), b = a + bookCtx.dur;
    var clash = sessionsByDate(date).filter(function(s){
      if (s.status === 'excused_cancel' || s.status === 'same_day_cancel' || s.status === 'no_show') return false;
      return a < sessionEnd(s) && minOf(s.startTime) < b;
    });
    if (clash.length) msgs.push(clash[0].startTime + '~' + hhmm(sessionEnd(clash[0])) + '에 ' + memberName(clash[0].memberId) + ' 레슨이 있어요.');
  }
  var pSel = document.getElementById('bkPkg');
  if (pSel && !pSel.value) msgs.push('수강권을 골라주세요.');
  w.innerHTML = msgs.length
    ? '<div class="err">' + esc(msgs.join(' ')) + '</div>'
    : '<div class="ok">' + fmtShort(date) + ' ' + time + ' · ' + bookCtx.dur + '분 예약할 수 있어요.</div>';
  var btn = bookCtx.sh.footer.querySelector('[data-act="book-save"]');
  if (btn) btn.disabled = msgs.length > 0;
}

function saveBooking(){
  if (!bookCtx) return;
  var mEl = document.getElementById('bkMember'), dEl = document.getElementById('bkDate'), tEl = document.getElementById('bkTime');
  var pEl = document.getElementById('bkPkg'), memoEl = document.getElementById('bkMemo');
  var locEl = document.getElementById('bkLocation');
  if (!mEl || !dEl || !tEl || !pEl) return;
  if (!mEl.value || !dEl.value || !tEl.value || !pEl.value) return;
  var pkg = pkgById(pEl.value);
  var s = {
    id: uid('lsn'), memberId: mEl.value, packageId: pkg ? pkg.id : '',
    date: dEl.value, startTime: tEl.value, durationMinutes: bookCtx.dur,
    location: locEl ? locEl.value.trim() : '',
    status: 'scheduled', deducted: false, memo: memoEl ? memoEl.value.trim() : '', settledAt: '',
    source: 'manual'
  };
  state.sessions.push(s);
  save();
  ui.tab = 'calendar';
  ui.date = s.date;
  var sh = bookCtx.sh;
  bookCtx = null;
  if (sh) sh.close();
  if (memberCtx) paintMemberSheet();
  render();
  toast(memberName(s.memberId) + ' · ' + fmtDot(s.date) + ' ' + s.startTime + ' ' + s.durationMinutes + '분 예약 추가');
  calendarAfterAdd(s);
}

function filteredMembers(){

/* =========================================================
   골프 전용 레슨 차트 — 클럽/영역 자동 태그
   ========================================================= */
var GOLF_TAGS = [
  { key:'드라이버', cls:'t-driver',   words:['드라이버','티샷','우드','유틸','하이브리드','비거리','슬라이스','훅'] },
  { key:'아이언',   cls:'t-iron',     words:['아이언','7번','8번','9번','피칭','다운블로','임팩트','핸드퍼스트'] },
  { key:'어프로치', cls:'t-approach', words:['어프로치','웨지','칩샷','피치샷','벙커','로브','거리감'] },
  { key:'퍼팅',     cls:'t-putt',     words:['퍼팅','퍼터','그린','스트로크','라인','숏퍼트'] },
  { key:'필드',     cls:'t-field',    words:['필드','라운딩','코스','트러블','파3'] }
];

function isArr(v){ return Object.prototype.toString.call(v) === '[object Array]'; }
function golfTagIndex(name){
  for (var i = 0; i < GOLF_TAGS.length; i++) if (GOLF_TAGS[i].key === name) return i;
  return 99;
}
function golfTagInfo(name){
  var i = golfTagIndex(name);
  return i < GOLF_TAGS.length ? GOLF_TAGS[i] : null;
}
function sortTags(list){
  return (list || []).slice().sort(function(a, b){ return golfTagIndex(a) - golfTagIndex(b); });
}

/* 본문에서 골프 키워드를 찾아 태그를 붙입니다 (고정된 순서) */
function detectGolfTags(text){
  var src = String(text || '').toLowerCase().replace(/\s+/g, ' ');
  var out = [];
  GOLF_TAGS.forEach(function(t){
    for (var i = 0; i < t.words.length; i++) {
      if (src.indexOf(t.words[i].toLowerCase()) >= 0) { out.push(t.key); return; }
    }
  });
  return out;
}

/* 예전에 저장된 기록(태그 없음)은 본문에서 바로 계산합니다 */
function noteTags(n){
  if (n && isArr(n.tags)) return n.tags.slice();
  return detectGolfTags(n ? n.text : '');
}
function noteTagHTML(name){
  var t = golfTagInfo(name);
  if (!t) return '';
  return '<span class="gtag ' + t.cls + '">#' + esc(name) + '</span>';
}
function tagFilterCounts(notes){
  var c = {};
  GOLF_TAGS.forEach(function(t){ c[t.key] = 0; });
  notes.forEach(function(n){
    noteTags(n).forEach(function(k){ if (c[k] !== undefined) c[k]++; });
  });
  return c;
}

/* 입력칸 위 태그 칩 — 본문에서 자동으로 켜지고, 눌러서 직접 고칠 수 있습니다 */
function noteTagChipsHTML(){
  var sel = (memberCtx && isArr(memberCtx.tagSel)) ? memberCtx.tagSel : [];
  return '<div class="tagchips" id="noteTags">' + GOLF_TAGS.map(function(t){
    return '<button class="tagchip' + (sel.indexOf(t.key) >= 0 ? ' on' : '') + '" data-act="note-tag" data-v="' + t.key + '">#' + t.key + '</button>';
  }).join('') + '</div>' +
    '<div class="hint" id="noteTagHint">말하거나 적으면 클럽·영역 태그가 자동으로 붙어요. 잘못 붙으면 눌러서 끄세요.</div>';
}

/* 타이핑·음성으로 본문이 바뀔 때 칩만 다시 칠합니다(입력 포커스 유지) */

/* =========================================================
   카톡 복사용 1초 리포트
   ========================================================= */
function kakaoMD(date){
  var d = parseISO(date);
  return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEK[d.getDay()] + ')';
}

/* 그 날짜의 최신 차트 기록 → 없으면 레슨 메모 → 없으면 회원의 최근 기록 */
function kakaoPointText(s, m){
  var mid = s ? s.memberId : (m ? m.id : '');
  var text = '';
  if (mid && s && s.date) {
    var hits = notesByMember(mid).filter(function(n){ return n.date === s.date; });
    if (hits.length) text = hits[0].text;
  }
  if (!text && s && s.memo) text = s.memo;
  if (!text && mid) {
    var all = notesByMember(mid);
    if (all.length) text = all[0].text;
  }
  text = String(text || '').replace(/\s+/g, ' ').trim();
  if (text.length > 160) text = text.slice(0, 159) + '…';
  return text;
}

function kakaoReport(o){
  o = o || {};
  var lines = ['[' + (o.pro || '프로') + ' 프로 레슨 노트]'];
  var when = [];
  if (o.date) when.push(kakaoMD(o.date));
  if (o.time) when.push(o.time);
  if (o.duration) when.push('(' + o.duration + '분)');
  var head = (o.name || '') + '님';
  if (when.length) head += ' · ' + when.join(' ');
  lines.push(head);
  if (o.total > 0 && o.remaining !== null && o.remaining !== undefined) {
    lines.push('잔여 횟수: ' + o.remaining + '/' + o.total + '회');
  }
  if (o.point) lines.push('오늘 포인트: ' + o.point);
  return lines.join('\n');
}

function kakaoReportForSession(sid){
  var s = findSession(sid);
  if (!s) return '';
  var m = memberById(s.memberId);
  var pkg = pkgById(s.packageId) || (m ? activePkgs(m.id)[0] : null);
  return kakaoReport({
    pro: (state.pro && state.pro.name) || '프로',
    name: m ? m.name : '',
    date: s.date, time: s.startTime, duration: s.durationMinutes,
    remaining: pkg ? pkg.remainingSessions : null,
    total: pkg ? pkg.totalSessions : 0,
    point: kakaoPointText(s, m)
  });
}

/* 가장 최근에 진행한 레슨 (없으면 가장 가까운 예정 레슨) */
function latestLessonFor(mid){
  var list = state.sessions.filter(function(s){ return s.memberId === mid && s.status !== 'excused_cancel'; })
    .sort(function(a, b){
      if (a.date === b.date) return minOf(b.startTime) - minOf(a.startTime);
      return a.date < b.date ? 1 : -1;
    });
  var t = todayISO();
  for (var i = 0; i < list.length; i++) if (list[i].date <= t) return list[i];
  return list.length ? list[list.length - 1] : null;
}

/* iOS 사파리: clipboard API → 안 되면 textarea + execCommand */
function copyText(text, done){
  function fallback(){
    var ok = false, ta = null;
    try {
      ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand('copy');
    } catch(e){ ok = false; }
    if (ta && ta.parentNode) ta.parentNode.removeChild(ta);
    done(!!ok);
  }
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function(){ done(true); }, fallback);
    return;
  }
  fallback();
}

/* ---------- 날짜 자동 인식 ---------- */
function safeYMD(y, mo, d){
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  var dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return '';
  return iso(dt);
}

function parseDateFromText(text){
  var src = String(text || '');
  var res = { date:'', matched:'', matchedRaw:'', cleaned: src.trim() };
  if (!src.trim()) return res;
  var t = src;
  var today = todayISO();
  var thisYear = parseISO(today).getFullYear();
  var rawHit = '';

  function grab(re, fn){
    var m = t.match(re);
    if (!m) return false;
    var d = fn(m);
    if (!d) return false;
    rawHit = m[0];
    res.date = d;
    res.matchedRaw = m[0];
    res.matched = m[0].replace(/\s+/g, ' ').trim();
    t = t.replace(m[0], ' ');
    return true;
  }

  /* 1) 2026-11-20 / 2026.11.20 / 2026년 11월 20일 */
  if (!res.date) grab(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})\s*일?\s*(?:에|날|은|는|의)?/, function(m){
    return safeYMD(+m[1], +m[2], +m[3]);
  });

  /* 2) 11월 20일 */
  if (!res.date) grab(/(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(?:에|날|은|는|의)?/, function(m){
    var d = safeYMD(thisYear, +m[1], +m[2]);
    if (!d) return '';
    if (d > addDays(today, 60)) d = safeYMD(thisYear - 1, +m[1], +m[2]);
    return d;
  });

  /* 3) 11/20, 11.20 */
  if (!res.date) grab(/(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\d)/, function(m){
    var d = safeYMD(thisYear, +m[1], +m[2]);
    if (!d) return '';
    if (d > addDays(today, 60)) d = safeYMD(thisYear - 1, +m[1], +m[2]);
    return d;
  });

  /* 3-1) 11-20 : 앞뒤가 비어 있을 때만 (점수 오인 방지) */
  if (!res.date) grab(/(?:^|\s)(\d{1,2})\s*-\s*(\d{1,2})(?=\s|$|[,.]|에|날)/, function(m){
    var mm = +m[1], dd = +m[2];
    if (mm < 1 || mm > 12) return '';
    var d = safeYMD(thisYear, mm, dd);
    if (!d) return '';
    if (d > addDays(today, 60)) d = safeYMD(thisYear - 1, mm, dd);
    return d;
  });

  /* 3-2) 다음주 화요일 / 수요일 / 일요일 */
  if (!res.date) grab(/(다다음주|다음주|이번주|다음|이번)?\s*(월|화|수|목|금|토|일)\s*요일\s*(?:에|날|은|는|의)?/, function(m){
    var idx = ['일','월','화','수','목','금','토'].indexOf(m[2]);
    if (idx < 0) return '';
    var base = parseISO(today);
    var diff = idx - base.getDay();
    var mod = m[1] || '';
    if (mod === '다음주' || mod === '다음') diff += 7;
    else if (mod === '다다음주') diff += 14;
    else if (diff < 0) diff += 7;
    return iso(new Date(base.getFullYear(), base.getMonth(), base.getDate() + diff));
  });

  /* 4) 오늘 · 어제 · 그제 · 내일 · 모레 */
  if (!res.date) {
    var rels = [
      { re:/(그저께|그제)(?:은|는|에|의|날)?/, off:-2 },
      { re:/(어제)(?:은|는|에|의|날)?/, off:-1 },
      { re:/(오늘)(?:은|는|에|의|날)?/, off:0 },
      { re:/(내일)(?:은|는|에|의|날)?/, off:1 },
      { re:/(모레)(?:은|는|에|의|날)?/, off:2 }
    ];
    for (var i = 0; i < rels.length; i++) {
      if (grab(rels[i].re, function(){ return addDays(today, rels[i].off); })) break;
    }
  }

  if (res.matched) {
    var cleaned = src.replace(rawHit, ' ');
    cleaned = cleaned.replace(/^[\s,·、~\-–—:;.]+/, '').replace(/[\s,·、~\-–—:;.]+$/, '').replace(/\s{2,}/g, ' ').trim();
    res.cleaned = cleaned || src.trim();
  }
  return res;
}

function refreshNoteDate(){
  if (!memberCtx) return;
  var ta = document.getElementById('noteText');
  var dEl = document.getElementById('noteDate');
  var badge = document.getElementById('noteDateBadge');
  var hint = document.getElementById('noteHint');
  if (!ta || !dEl) return;
  var p = parseDateFromText(ta.value);
  if (p.date) { dEl.value = p.date; memberCtx.noteDate = p.date; }
  var eff = dEl.value || todayISO();
  if (badge) badge.textContent = fmtShort(eff);
  if (hint) {
