/* ---------- 날짜 자동 인식 ---------- */
function safeYMD(y, mo, d){
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  var dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return '';
  return iso(dt);
}

function parseDateFromText(text){
  var src = String(text || '');
  var res = { date:'', matched:'', matchedRaw:'', cleaned: src.trim() };
  if (!src.trim()) return res;
  var t = src;
  var today = todayISO();
  var thisYear = parseISO(today).getFullYear();
  var rawHit = '';

  function grab(re, fn){
    var m = t.match(re);
    if (!m) return false;
    var d = fn(m);
    if (!d) return false;
    rawHit = m[0];
    res.date = d;
    res.matchedRaw = m[0];
    res.matched = m[0].replace(/\s+/g, ' ').trim();
    t = t.replace(m[0], ' ');
    return true;
  }

  /* 1) 2026-11-20 / 2026.11.20 / 2026년 11월 20일 */
  if (!res.date) grab(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})\s*일?\s*(?:에|날|은|는|의)?/, function(m){
    return safeYMD(+m[1], +m[2], +m[3]);
  });

  /* 2) 11월 20일 */
  if (!res.date) grab(/(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(?:에|날|은|는|의)?/, function(m){
    var d = safeYMD(thisYear, +m[1], +m[2]);
    if (!d) return '';
    if (d > addDays(today, 60)) d = safeYMD(thisYear - 1, +m[1], +m[2]);
    return d;
  });

  /* 3) 11/20, 11.20 */
  if (!res.date) grab(/(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\d)/, function(m){
    var d = safeYMD(thisYear, +m[1], +m[2]);
    if (!d) return '';
    if (d > addDays(today, 60)) d = safeYMD(thisYear - 1, +m[1], +m[2]);
    return d;
  });

  /* 3-1) 11-20 : 앞뒤가 비어 있을 때만 (점수 오인 방지) */
  if (!res.date) grab(/(?:^|\s)(\d{1,2})\s*-\s*(\d{1,2})(?=\s|$|[,.]|에|날)/, function(m){
    var mm = +m[1], dd = +m[2];
    if (mm < 1 || mm > 12) return '';
    var d = safeYMD(thisYear, mm, dd);
    if (!d) return '';
    if (d > addDays(today, 60)) d = safeYMD(thisYear - 1, mm, dd);
    return d;
  });

  /* 3-2) 다음주 화요일 / 수요일 / 일요일 */
  if (!res.date) grab(/(다다음주|다음주|이번주|다음|이번)?\s*(월|화|수|목|금|토|일)\s*요일\s*(?:에|날|은|는|의)?/, function(m){
    var idx = ['일','월','화','수','목','금','토'].indexOf(m[2]);
    if (idx < 0) return '';
    var base = parseISO(today);
    var diff = idx - base.getDay();
    var mod = m[1] || '';
    if (mod === '다음주' || mod === '다음') diff += 7;
    else if (mod === '다다음주') diff += 14;
    else if (diff < 0) diff += 7;
    return iso(new Date(base.getFullYear(), base.getMonth(), base.getDate() + diff));
  });

  /* 4) 오늘 · 어제 · 그제 · 내일 · 모레 */
  if (!res.date) {
    var rels = [
      { re:/(그저께|그제)(?:은|는|에|의|날)?/, off:-2 },
      { re:/(어제)(?:은|는|에|의|날)?/, off:-1 },
      { re:/(오늘)(?:은|는|에|의|날)?/, off:0 },
      { re:/(내일)(?:은|는|에|의|날)?/, off:1 },
      { re:/(모레)(?:은|는|에|의|날)?/, off:2 }
    ];
    for (var i = 0; i < rels.length; i++) {
      if (grab(rels[i].re, function(){ return addDays(today, rels[i].off); })) break;
    }
  }

  if (res.matched) {
    var cleaned = src.replace(rawHit, ' ');
    cleaned = cleaned.replace(/^[\s,·、~\-–—:;.]+/, '').replace(/[\s,·、~\-–—:;.]+$/, '').replace(/\s{2,}/g, ' ').trim();
    res.cleaned = cleaned || src.trim();
  }
  return res;
}

function refreshNoteDate(){
  if (!memberCtx) return;
  var ta = document.getElementById('noteText');
  var dEl = document.getElementById('noteDate');
  var hint = document.getElementById('noteHint');
  if (!ta || !dEl) return;
  var p = parseDateFromText(ta.value);
  /* 날짜를 자동으로 알아냈으면 옆 날짜 버튼도 같은 날짜로 맞춥니다 —
     화면과 저장될 날짜가 서로 다른 말을 하지 않도록 */
  if (p.date) { dEl.value = p.date; memberCtx.noteDate = p.date; syncDateLabel('noteDate'); }
  var eff = dEl.value || todayISO();
  if (hint) {
    if (!ta.value.trim()) hint.innerHTML = NOTE_HINT_IDLE;
    else if (p.matched) hint.innerHTML = '“' + esc(p.matched) + '” → <b>' + fmtShort(p.date) + '</b> 기록으로 잡았어요.';
    else hint.innerHTML = '날짜가 없어 <b>' + fmtShort(eff) + '</b> 기록으로 저장돼요. 옆 날짜 칸에서 바꿀 수 있어요.';
  }
}

/* =========================================================
   음성 입력 엔진 (레슨 차트 · 캘린더 빠른 추가 공용)
   iOS 사파리는 stop()만 하면 마이크 세션이 남아 다음 start()가
   조용히 먹통이 됩니다. 그래서
     · 멈출 때는 abort()로 확실히 놓아 주고
     · 시작할 때마다 완전히 새 SpeechRecognition 객체를 만들고
     · 늦게 도착한 이전 객체의 콜백은 세대(gen) 번호로 무시하며
     · start()가 실패하거나 조용히 안 되면 새 객체로 몇 번 다시 시도합니다.
   ========================================================= */
var voice = {
  want: false,        /* 사용자가 듣기를 켜 둔 상태 */
  kind: null,         /* 'note' | 'qa' */
  inst: null,         /* 현재 SpeechRecognition 객체 */
  gen: 0,             /* 세대 번호(이전 콜백 무시용) */
  started: false,
  base: '',           /* 듣기 시작할 때 이미 있던 글 */
  committed: '',      /* 확정된 음성 문장 */
  lastWritten: '',    /* 앱이 마지막으로 넣은 값(사용자가 고쳤는지 판별) */
  fails: 0,           /* 연속으로 켜지지 못한 횟수 */
  pauses: 0,
  retryTimer: null,
  watchTimer: null,
  quietUntil: 0
};

function vrSR(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }

function vrEls(kind){
  if (kind === 'qa') return { ta: document.getElementById('qaLine'), btn: document.getElementById('qaVoiceBtn'), hint: document.getElementById('qaBar') };
  if (kind === 'am') return { ta: document.getElementById('quickLine'), btn: document.getElementById('amVoiceBtn'), hint: document.getElementById('parseBar') };
  if (kind === 'tm') return { ta: document.getElementById('tmText'), btn: document.getElementById('tmVoiceBtn'), hint: document.getElementById('tmHint') };
  return { ta: document.getElementById('noteText'), btn: document.getElementById('voiceBtn'), hint: document.getElementById('noteHint') };
}

/* 음성 버튼 하나를 '듣는 중' 으로 칠하고/되돌립니다 */
function vrPaintBtn(btn, on){
  if (!btn) return;
  if (on) btn.classList.add('rec'); else btn.classList.remove('rec');
  btn.textContent = on ? '듣는 중…' : '🎤 음성 입력';
}

function vrPaint(){
  var on = !!voice.want, kind = voice.kind;
  vrPaintBtn(document.getElementById('voiceBtn'), on && kind === 'note');
  vrPaintBtn(document.getElementById('qaVoiceBtn'), on && kind === 'qa');
  vrPaintBtn(document.getElementById('amVoiceBtn'), on && kind === 'am');
  vrPaintBtn(document.getElementById('tmVoiceBtn'), on && kind === 'tm');
  /* 멈춘 뒤에도 입력칸은 항상 열려 있어야 합니다 */
  ['noteText', 'qaLine', 'quickLine', 'tmText'].forEach(function(id){
    var t = document.getElementById(id);
    if (t) { t.disabled = false; t.readOnly = false; }
  });
}

/* 인식기에서 손을 떼고 마이크 세션을 반납합니다 */
function vrDetach(r){
  if (!r) return;
  try { r.onstart = null; r.onresult = null; r.onerror = null; r.onend = null; } catch(e){}
  try { r.abort(); } catch(e){}
  try { r.stop(); } catch(e){}
  voice.quietUntil = Date.now() + 250;   /* iOS가 마이크를 놓을 짧은 틈 */
}

function vrJoin(a, b){
  a = String(a == null ? '' : a);
  b = String(b == null ? '' : b);
  if (!a) return b.replace(/^[ \t]+/, '');
  if (!b) return a;
  var sep = (/\s$/.test(a) || /^\s/.test(b)) ? '' : ' ';
  return (a + sep + b).replace(/[ \t]{2,}/g, ' ');
}

function vrRefresh(kind){
  try {
    if (kind === 'qa') applyQuickParse();
    else if (kind === 'am') applyQuickLine();
    else if (kind === 'tm') paintTodayMemoTags();
    else { refreshNoteDate(); refreshNoteTags(); }
  } catch(e){}
}

function vrTakeResult(e){
  var kind = voice.kind;
  var els = vrEls(kind);
  if (!els.ta) return;
  var ta = els.ta;
  /* 듣는 동안 사용자가 직접 고쳤다면 그 글을 새 기준으로 삼습니다(덮어쓰지 않음) */
  if (ta.value !== voice.lastWritten) {
    voice.base = ta.value.replace(/\s+$/, '');
    voice.committed = '';
  }
  var finals = '', interim = '';
  var res = (e && e.results) ? e.results : [];
  var from = (e && typeof e.resultIndex === 'number') ? e.resultIndex : 0;
  for (var i = from; i < res.length; i++) {
    var r = res[i];
    if (!r) continue;
    var txt = (r[0] && r[0].transcript) ? r[0].transcript : '';
    if (!txt) continue;
    if (r.isFinal) finals += txt; else interim += txt;
  }
  if (finals) {
    voice.committed = vrJoin(voice.committed, finals);
    if (kind === 'note' && memberCtx) memberCtx.voiceUsed = true;
    if (kind === 'tm' && tmCtx) tmCtx.voiceUsed = true;
  }
  var next = vrJoin(vrJoin(voice.base, voice.committed), interim);
  if (ta.value !== next) ta.value = next;
  voice.lastWritten = ta.value;
  vrRefresh(kind);
}

function vrRetry(gen, reason){
  if (!voice.want || gen !== voice.gen) return;
  var delay;
  if (reason === 'end' || reason === 'no-speech') {
    voice.pauses++;
    if (voice.pauses > 400) { vrStop(); return; }
    delay = 200;
  } else {
    voice.fails++;
    if (voice.fails > 3) {
      var els = vrEls(voice.kind);
      if (els.hint) els.hint.innerHTML = '음성 인식을 다시 켜지 못했어요. 타이핑으로 적으신 뒤 잠시 뒤 🎤를 다시 눌러 주세요.';
      vrStop();
      return;
    }
    delay = 300 * voice.fails;
  }
  clearTimeout(voice.retryTimer);
  voice.retryTimer = setTimeout(function(){
    if (voice.want && gen === voice.gen) vrAttempt(gen);
  }, delay);
}

/* 매 시도마다 완전히 새 인식기를 만듭니다 */
function vrAttempt(gen){
  if (!voice.want || gen !== voice.gen) return;
  var SR = vrSR();
  if (!SR) { vrStop(); return; }
  var els = vrEls(voice.kind);
  if (!els.ta) { vrStop(); return; }          /* 창이 닫혔으면 조용히 정리 */
  var wait = voice.quietUntil - Date.now();
  if (wait > 0) {
    clearTimeout(voice.retryTimer);
    voice.retryTimer = setTimeout(function(){ vrAttempt(gen); }, wait + 20);
    return;
  }
  var rec;
  try { rec = new SR(); } catch (err0) { vrRetry(gen, 'new'); return; }
  voice.inst = rec;
  voice.started = false;
  try {
    rec.lang = 'ko-KR';
    rec.interimResults = true;
    rec.continuous = true;
    rec.maxAlternatives = 1;
  } catch(e){}

  rec.onstart = function(){
    if (voice.inst !== rec) return;
    voice.started = true;
    voice.fails = 0;
    clearTimeout(voice.watchTimer); voice.watchTimer = null;
    vrPaint();
  };
  rec.onresult = function(e){
    if (voice.inst !== rec || !voice.want) return;
    vrTakeResult(e);
  };
  rec.onerror = function(e){
    if (voice.inst !== rec) return;
    var err = (e && e.error) ? String(e.error) : 'error';
    if (err === 'aborted') return;            /* 우리가 멈춘 경우: onend가 정리합니다 */
    if (err === 'no-speech') {                /* 잠깐 조용했을 뿐 — 계속 듣습니다 */
      var h1 = vrEls(voice.kind).hint;
      if (h1) h1.innerHTML = '잘 안 들렸어요. 다시 말씀해 주세요. (🎤를 다시 누르면 멈춰요)';
      voice.inst = null;
      vrDetach(rec);
      vrRetry(gen, 'no-speech');
      return;
    }
    if (err === 'not-allowed' || err === 'service-not-allowed') {
      var h2 = vrEls(voice.kind).hint;
      if (h2) h2.innerHTML = '마이크 사용이 허용되지 않았어요. 브라우저 설정에서 마이크를 허용한 뒤 🎤를 다시 눌러 주세요.';
      vrStop();
      return;
    }
    if (err === 'audio-capture') {
      var h3 = vrEls(voice.kind).hint;
      if (h3) h3.innerHTML = '마이크를 찾지 못했어요. 다른 앱이 마이크를 쓰고 있지 않은지 확인한 뒤 🎤를 다시 눌러 주세요.';
      vrStop();
      return;
    }
    var h4 = vrEls(voice.kind).hint;
    if (h4) h4.innerHTML = '음성 인식이 잠시 멈췄어요(' + esc(err) + '). 🎤를 다시 누르거나 타이핑으로 계속 적어 주세요.';
    vrStop();
  };
  rec.onend = function(){
    if (voice.inst !== rec) return;
    voice.inst = null;
    if (!voice.want) { vrPaint(); return; }
    /* 사용자가 멈추지 않았는데 끝난 경우(iOS는 문장마다 스스로 끝냅니다) 이어서 듣기 */
    vrRetry(gen, 'end');
  };

  try {
    rec.start();
  } catch (err1) {
    /* InvalidStateError 등: 이전 세션이 남아 있을 때 */
    voice.inst = null;
    vrDetach(rec);
    vrRetry(gen, 'start');
    return;
  }
  clearTimeout(voice.watchTimer);
  voice.watchTimer = setTimeout(function(){
    if (!voice.want || voice.inst !== rec || voice.started) return;
    /* start()가 조용히 실패한 경우 — 새 객체로 다시 */
    voice.inst = null;
    vrDetach(rec);
    vrRetry(gen, 'silent');
  }, 2500);
}

function vrStart(kind){
  var els = vrEls(kind);
  if (!els.ta) return;
  if (!vrSR()) {
    if (els.hint) els.hint.innerHTML = '이 브라우저는 음성 인식을 지원하지 않아요. 타이핑으로 입력해 주세요. (아이폰 사파리·크롬에서는 동작해요)';
    toast('음성 인식을 지원하지 않는 브라우저예요');
    return;
  }
  if (voice.want) vrStop();
  var left = voice.inst;
  voice.inst = null;
  if (left) vrDetach(left);
  voice.want = true;
  voice.kind = kind;
  voice.gen++;
  voice.started = false;
  voice.fails = 0;
  voice.pauses = 0;
  voice.base = els.ta.value.replace(/\s+$/, '');
  voice.committed = '';
  voice.lastWritten = els.ta.value;
  if (kind === 'note' && memberCtx) memberCtx.voiceUsed = false;
  if (kind === 'tm' && tmCtx) tmCtx.voiceUsed = false;
  vrPaint();
  toast('말씀하세요 · 다시 누르면 멈춰요');
  vrAttempt(voice.gen);
}

function vrStop(){
  var kind = voice.kind;
  var r = voice.inst;
  voice.want = false;
  voice.kind = null;
  voice.gen++;
  voice.inst = null;
  voice.started = false;
  voice.fails = 0;
  voice.pauses = 0;
  clearTimeout(voice.retryTimer); clearTimeout(voice.watchTimer);
  voice.retryTimer = null; voice.watchTimer = null;
  if (r) vrDetach(r);
  voice.base = '';
  voice.committed = '';
  voice.lastWritten = '';
  vrPaint();
  return kind;
}

function toggleVoice(){
  if (!document.getElementById('noteText')) return;
  if (voice.want) {
    var wasNote = (voice.kind === 'note');
    vrStop();
    if (wasNote) {
      var h = document.getElementById('noteHint');
      if (h) h.innerHTML = '음성 입력을 멈췄어요. 🎤를 다시 누르면 이어서 들을 수 있어요.';
    }
    return;
  }
  vrStart('note');
}

function saveNote(){
  if (!memberCtx) return;
  var ta = document.getElementById('noteText');
  var dEl = document.getElementById('noteDate');
  var raw = ta ? ta.value.trim() : '';
  if (!raw) { toast('레슨 내용을 먼저 적어주세요'); if (ta) ta.focus(); return; }
  var p = parseDateFromText(raw);
  var date = (dEl && dEl.value) ? dEl.value : (p.date || todayISO());
  var text = p.cleaned || raw;
  var wasVoice = !!(memberCtx.voiceUsed || (voice.want && voice.kind === 'note'));
  /* 손대지 않았으면 본문에서 자동 태그, 칩을 눌렀으면 그 선택을 그대로 */
  var tags = memberCtx.tagTouched ? sortTags(memberCtx.tagSel || []) : detectGolfTags(text);
  state.notes.push({
    id: uid('note'), memberId: memberCtx.memberId, date: date, text: text,
    createdAt: nowLocalISO(), source: wasVoice ? 'voice' : 'text', raw: raw, tags: tags
  });
  save();
  memberCtx.draft = '';
  memberCtx.noteDate = todayISO();
  memberCtx.voiceUsed = false;
  memberCtx.tagSel = [];
  memberCtx.tagTouched = false;
  memberCtx.tagFilter = '전체';
  /* 입력칸을 먼저 비워야 paintMemberSheet의 임시저장(captureNoteDraft)이
     방금 저장한 글을 다시 채우지 않습니다 */
  if (ta) ta.value = '';

  stopVoice();
  paintMemberSheet();
  render(true);

function quickRowMeta(p){
  var bits = [];
  bits.push(p.found.duration ? durName(p.duration) : '55분');
  if (p.total > 0) bits.push(p.total + '회' + (p.rem > 0 && p.rem < p.total ? ' · 잔여 ' + p.rem + '회' : ''));
  else bits.push('횟수 ?');
  if (p.gender) bits.push(p.gender === 'male' ? '남' : '여');
  if (p.region) bits.push(p.region);
  if (p.price > 0) bits.push(money(p.price) + (p.perLesson > 0 ? ' (회당 ' + money(p.perLesson) + ')' : ''));
  return bits.join(' · ');
}

function applyQuickLine(){
  var ta = document.getElementById('quickLine');
  var bar = document.getElementById('parseBar');
  if (!ta || !addCtx) return;
  var text = ta.value;
  var rows = parseMemberLines(text);
  var bulk = rows.length > 1;
  var p = rows[0] || null;
  addCtx.rows = rows;
  addCtx.bulk = bulk;

  var form = document.getElementById('addForm');
  if (form) form.style.display = bulk ? 'none' : '';
  var listEl = document.getElementById('quickList');
  if (listEl) {
    listEl.style.display = bulk ? '' : 'none';
    listEl.innerHTML = bulk ? quickPreviewHTML(rows) : '';
  }
  var saveBtn = addCtx.sh && addCtx.sh.footer ? addCtx.sh.footer.querySelector('[data-act="member-save"]') : null;
  if (saveBtn) {
    var okN = quickValidRows(rows).length;
    var namedN = rows.filter(function(p){ return p.found.name; }).length;
    saveBtn.textContent = bulk
      ? (okN ? okN + '명 한꺼번에 추가' : (namedN ? '새로 등록할 줄이 없어요' : '이름을 적어 주세요'))
      : '회원 추가';
  }

  /* 자동으로 채운 칸을 기억합니다 (addCtx.auto).
     · 사용자가 직접 고친 칸은 건드리지 않고
     · 인식 결과에서 사라진 값은 다시 비웁니다.
     예) '정'만 있을 때 이름 대신 메모로 잡혔다가 '정하윤'이 완성되면, 메모의 '정'을 지웁니다. */
  var auto = addCtx.auto || (addCtx.auto = {});
  function autoFill(id, val){
    var el = document.getElementById(id);
    if (!el) return;
    var v = String(val === undefined || val === null ? '' : val);
    if (el.value !== '' && el.value !== auto[id]) return;   /* 사용자가 적은 값은 그대로 */
    if (el.value !== v) el.value = v;
    auto[id] = v;
  }
  if (!bulk) {
    var p2 = (text.trim() && p) ? p : null;
    var el;
    autoFill('mfName', p2 && p2.found.name ? p2.name : '');
    autoFill('mfRegion', p2 && p2.found.region ? p2.region : '');
    autoFill('mfPhone', p2 && p2.found.phone ? p2.phone : '');
    autoFill('mfSessions', p2 && p2.total > 0 ? p2.total : '');
    autoFill('mfRemain', p2 && p2.total > 0 && p2.rem > 0 && p2.rem < p2.total ? p2.rem : '');
    autoFill('mfPrice', p2 && p2.price > 0 ? p2.price : '');
    autoFill('mfMemo', p2 && p2.extra ? p2.extra : '');
    if (p2) {
      if (p2.found.gender) setGenderUI(p2.gender);
      if (p2.found.level && (el = document.getElementById('mfLevel'))) { el.value = p2.level; syncPickLabel('mfLevel'); }
      if (p2.found.duration) { addCtx.duration = p2.duration; setDurUI(p2.duration); }
    }
    updateUnit();
  }
  if (bar) bar.innerHTML = !text.trim()
    ? '한 줄이면 아래 칸을 채우고, 여러 줄을 붙여넣으면 한 번에 등록해요.'
    : (bulk
        ? '<b>' + rows.length + '줄</b>을 읽었어요 · 등록 <b>' + quickValidRows(rows).length + '명</b> · 아래를 확인하고 버튼 한 번이면 끝나요.'
        : '인식 결과 · <b>' + esc(parseSummary(p)) + '</b><br><span style="font-weight:600;color:var(--subink)">아래 항목에서 고칠 수 있어요.</span>');
}

/* 여러 줄 일괄 등록 — 미리보기에서 '등록'으로 표시된 줄만 한 번에 저장 */
function saveMembersBulk(){
  if (!addCtx) return;
  var rows = addCtx.rows || [];
  var added = [], skipped = 0;
  rows.forEach(function(p){
    if (!p.found.name || findMemberByName(p.name)) { skipped++; return; }
    var total = p.total > 0 ? p.total : 10;
    var rem = p.rem > 0 ? Math.min(p.rem, total) : total;
    var nm = {
      id: uid('mem'), name: p.name, gender: p.gender || '', region: p.region || '',
      phone: p.phone || '', level: p.level || '', memo: p.extra || '', since: todayISO()
    };
    state.members.push(nm);
    state.packages.push({
      id: uid('pkg'), memberId: nm.id, durationMinutes: p.duration || 55,
      totalSessions: total, remainingSessions: rem, startDate: todayISO(),
      expiryDate: addMonths(todayISO(), 6), price: p.price || 0, note: ''
    });
    added.push(p.name);
  });
  if (!added.length) { toast('새로 등록할 줄이 없어요 · 이름을 확인해 주세요'); return; }
  save();
  addCtx.sh.close(); addCtx = null;
  ui.tab = 'members';
  render();
  toast(added.length + '명 한꺼번에 등록했어요' + (skipped ? ' · ' + skipped + '줄은 건너뜀' : ''));
}

function saveMember(){
  if (!addCtx) return;
  if (addCtx.bulk && !addCtx.editing) { saveMembersBulk(); return; }
  var nameEl = document.getElementById('mfName');
  var name = nameEl ? nameEl.value.trim() : '';
  if (!name) { toast('이름을 적어주세요'); if (nameEl) nameEl.focus(); return; }
  function val(id){ var e = document.getElementById(id); return e ? e.value : ''; }
  var region = val('mfRegion').trim();
  var phone = val('mfPhone').trim();
  var level = val('mfLevel');
  var memo = val('mfMemo').trim();

  if (addCtx.editing) {
    var m = memberById(addCtx.memberId);
    if (!m) return;
    m.name = name; m.gender = addCtx.gender || ''; m.region = region; m.phone = phone; m.level = level; m.memo = memo;
    save();
    addCtx.sh.close(); addCtx = null;
    if (memberCtx) paintMemberSheet();
    render(true);
    toast('회원 정보를 저장했어요');
    return;
  }

  var sessions = parseInt(val('mfSessions'), 10);
  var hasPass = sessions > 0;          /* 횟수는 선택 — 비우면 수강권 없이 회원만 */
  /* 이미 차감된 회원은 '남은 횟수'로 등록 — 비우면 전체 개수 */
  var remain = hasPass ? parseInt(val('mfRemain'), 10) : 0;
  if (hasPass && (!(remain > 0) || remain > sessions)) remain = sessions;
  var start = val('mfStart') || todayISO();
  var months = parseInt(val('mfMonths'), 10);
  if (isNaN(months)) months = 6;
  var price = parseInt(val('mfPrice'), 10);
  if (isNaN(price)) price = 0;
  var dur = addCtx.duration || 55;

  var nm = {
    id: uid('mem'), name: name, gender: addCtx.gender || '', region: region,
    phone: phone, level: level, memo: memo, since: todayISO()
  };
  state.members.push(nm);
  if (hasPass) {
    state.packages.push({
      id: uid('pkg'), memberId: nm.id, durationMinutes: dur,
      totalSessions: sessions, remainingSessions: remain,
      startDate: start, expiryDate: months > 0 ? addMonths(start, months) : '9999-12-31',
      price: price, note: ''
    });
  }
  save();
  addCtx.sh.close(); addCtx = null;
  ui.tab = 'members';
  render();
  openMemberSheet(nm.id);
  toast(hasPass
    ? (name + ' 회원 추가 · ' + dur + '분 ' + sessions + '회' + (remain < sessions ? ' (잔여 ' + remain + '회)' : ''))
    : (name + ' 회원 추가 · 수강권 없이'));
}

var RENEW_PRESETS = [8, 10, 20];
var renewCtx = null;

/* 가장 최근에 산 수강권 */
function lastPkgOf(mid){
  var list = memberPkgs(mid).slice().sort(function(a, b){
    if (String(a.startDate) !== String(b.startDate)) return String(a.startDate) < String(b.startDate) ? 1 : -1;
    return 0;
  });
  return list.length ? list[0] : null;
}

/* 지난 수강권의 회당 금액 × 추가 횟수 (금액 미입력 수강권만 있으면 빈 값) */
function renewalDefaultAmount(mid, n, dur){
  n = +n || 0;
  if (n <= 0) return '';
  var paid = memberPkgs(mid).filter(function(p){ return +p.price > 0; });
  if (!paid.length) return '';
  var same = paid.filter(function(p){ return p.durationMinutes === dur; });
  var pool = same.length ? same : paid;
  var p = pool.slice().sort(function(a, b){ return String(a.startDate) < String(b.startDate) ? 1 : -1; })[0];
  var unit = perSessionPrice(p);
  return unit > 0 ? Math.round(unit * n) : '';
}

function renewUnitHint(){
  if (!renewCtx) return '';
  var n = +renewCtx.sessions || 0;
  var amount = parseInt(renewCtx.amount, 10) || 0;
  if (amount > 0 && n > 0) return '회당 약 <b>' + money(Math.round(amount / n)) + '</b> · 총 ' + money(amount);
  return '금액을 넣으면 회당 금액을 계산해 드려요.';
}

function renewSummaryHTML(m){
  if (!renewCtx) return '';

      '<span>' + (amount ? ' · ' + money(amount) : '') + (unit ? ' · 회당 ' + money(unit) : '') + '</span></div>' +
    '<div class="hint" style="margin-top:7px;padding:0">기존 레슨 차트·지난 수강권 기록은 그대로 남고, 새 수강권은 오늘부터 시작해요.</div>';

/* =========================================================
   통계 탭
   ========================================================= */
function monthStats(ym){
  var r = { completed:0, same_day_cancel:0, no_show:0, excused_cancel:0, makeup:0, deducted:0, total:0 };
  state.sessions.forEach(function(s){
    if (s.date.slice(0, 7) !== ym) return;
    if (s.status === 'scheduled') return;
    r[s.status] = (r[s.status] || 0) + 1;
    r.total++;
    if (s.deducted) r.deducted++;
    if (isSep(s)) r.sep = (r.sep || 0) + 1;
  });
  /* 일반취소는 일정에서 지워지므로 남겨 둔 기록(state.cancelLog)으로 집계한다 */
  (state.cancelLog || []).forEach(function(c){
    if (String(c.date || '').slice(0, 7) !== ym) return;
    r.excused_cancel++;
    r.total++;
  });
  return r;
}

function weekBars(ym){
  var p = ym.split('-'), y = +p[0], mo = +p[1];
  var days = new Date(y, mo, 0).getDate();
  var weeks = Math.ceil(days / 7);
  var out = [];
  for (var w = 0; w < weeks; w++) {
    var from = iso(new Date(y, mo - 1, w * 7 + 1));
    var to = iso(new Date(y, mo - 1, Math.min(days, w * 7 + 7)));
    var list = state.sessions.filter(function(s){ return s.date >= from && s.date <= to && s.status !== 'scheduled'; });
    out.push({
      label: (w * 7 + 1) + '일',
      total: list.length,
      done: list.filter(function(s){ return s.status === 'completed'; }).length
    });
  }
  return out;
}

function kpi(cls, n, label, unit){
  return '<div class="kpi ' + (cls || '') + '"><div class="n">' + n + (unit ? '<small>' + unit + '</small>' : '') + '</div><div class="l">' + label + '</div></div>';
}

function statsMonthNav(){
  return '<div class="monhdr"><div class="m">' + monthLabel(ui.month) + '</div><div class="navs">' +
    '<button class="iconbtn" data-act="stats-month" data-delta="-1" aria-label="이전 달">' + ICON.back + '</button>' +
    '<button class="btn btn-sm btn-outline" data-act="stats-month" data-delta="0">이번 달</button>' +
    '<button class="iconbtn" data-act="stats-month" data-delta="1" aria-label="다음 달" style="transform:rotate(180deg)">' + ICON.back + '</button>' +
  '</div></div>';
}

/* 통계 탭 = 수업 현황 · 수입 정산 두 화면 */
function viewStats(){
  var seg = '<div class="seg statsseg">' +
    '<button class="' + (ui.stats === 'revenue' ? '' : 'on') + '" data-act="stats-view" data-v="lesson">수업 현황</button>' +
    '<button class="' + (ui.stats === 'revenue' ? 'on' : '') + '" data-act="stats-view" data-v="revenue">수입 정산</button>' +
  '</div>';
  return seg + (ui.stats === 'revenue' ? viewRevenue() : viewLessonStats());
}

function viewLessonStats(){
  var ym = ui.month;
  var ms = monthStats(ym);
  var bars = weekBars(ym);
  var maxBar = 1;
  bars.forEach(function(b){ maxBar = Math.max(maxBar, b.total); });

  var h = statsMonthNav();

  h += '<div class="kpis">' +
    kpi('green', ms.completed, '완료 레슨', '건') +
    kpi('amber', ms.same_day_cancel, '당일취소', '건') +
    kpi('red', ms.no_show, '노쇼', '건') +
    kpi('blue', ms.deducted, '차감된 횟수', '회') +
  '</div>';
  h += '<div class="kpis mt10">' +
    kpi('', state.members.filter(function(m){ return totalRemaining(m.id) > 0; }).length, '활성 회원', '명') +
    kpi('', sum(state.packages, function(p){ return p.remainingSessions; }), '남은 수강 횟수', '회') +

/* ---------- 수입 정산 (차감된 레슨 × 회당 금액) ---------- */
function perSessionPrice(p){
  if (!p) return 0;
  var price = +p.price || 0, n = +p.totalSessions || 0;
  return (price > 0 && n > 0) ? Math.round(price / n) : 0;
}

function monthFromTo(ym){
  var p = String(ym).split('-'), y = +p[0], mo = +p[1];
  var last = new Date(y, mo, 0).getDate();
  return { from: ym + '-01', to: ym + '-' + pad(last), last: last };
}

/* 레슨에 붙은 수강권 (연결이 없으면 같은 시간 단위 수강권으로 추정) */
function sessionPkg(s){
  var p = pkgById(s.packageId);
  if (p) return p;
  var list = memberPkgs(s.memberId);
  for (var i = 0; i < list.length; i++) if (list[i].durationMinutes === s.durationMinutes) return list[i];
  return list.length ? list[0] : null;
}

function revenueRange(from, to){
  var all = [], total = 0, missing = 0, mmap = {}, rows = [];
  var sepRows = [], sepTotal = 0, sepMissing = 0, sepCount = 0;
  state.sessions.forEach(function(s){
    if (s.date < from || s.date > to) return;
    /* 필드 · 숏게임 = 별도 결제 수입 (수강권과 무관하게 따로 집계) */
    if (isSep(s)) {
      if (!s.charged) return;
      var fee = sepFee(s);
      sepCount++;
      if (!fee) sepMissing++; else sepTotal += fee;
      sepRows.push({ id: s.id, date: s.date, time: s.startTime, status: s.status,
        memberId: s.memberId || '', name: sessionName(s), guest: !s.memberId,
        kind: sepKind(s), dur: s.durationMinutes, unit: fee, missing: !(fee > 0), sep: true });
      return;
    }
    if (!s.deducted) return;
    var unit = perSessionPrice(sessionPkg(s));
    all.push({ id: s.id, date: s.date, time: s.startTime, status: s.status,
      memberId: s.memberId, name: memberName(s.memberId), dur: s.durationMinutes,
      unit: unit, missing: !(unit > 0) });
  });
  all.sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return minOf(b.time) - minOf(a.time);
  });
  all.forEach(function(r){
    if (r.missing) {
      missing++;
      if (r.memberId) mmap[r.memberId] = (mmap[r.memberId] || 0) + 1;
      return;
    }
    total += r.unit;
    rows.push(r);
  });
  sepRows.sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return minOf(b.time) - minOf(a.time);
  });
  return { all: all, rows: rows, passTotal: total, total: total + sepTotal, count: rows.length,
    deducted: all.length, missing: missing, missingByMember: mmap,
    sepRows: sepRows, sepTotal: sepTotal, sepCount: sepCount, sepMissing: sepMissing };
}

function revenueByMember(rows){
  var map = {}, list = [];
  rows.forEach(function(r){
    var k = r.memberId || '-';
    if (!map[k]) { map[k] = { memberId: r.memberId, name: r.name, count: 0, amount: 0 }; list.push(map[k]); }
    map[k].count++; map[k].amount += r.unit;
  });
  list.sort(function(a, b){ return b.amount - a.amount; });
  return list;
}

/* 450000 → 45만 · 1230000 → 123만 (막대 그래프 라벨용) */
function wonShort(n){
  n = Math.round(n || 0);
  if (n >= 100000000) { var e = n / 100000000; return (e >= 10 ? Math.round(e) : Math.round(e * 10) / 10) + '억'; }
  if (n >= 10000) { var m = n / 10000; return (m >= 100 ? Math.round(m) : Math.round(m * 10) / 10) + '만'; }
  return n ? String(n) : '0';
}

function revDetailMembers(rows, mmap){
  var parts = revenueByMember(rows).map(function(x){
    return '<div class="rvline"><span class="n">' + esc(x.name) + '</span>' +
      '<span class="a">' + x.count + '회 · ' + money(x.amount) + '</span></div>';
  });
  var miss = Object.keys(mmap || {}).map(function(mid){
    var m = memberById(mid);
    return '<div class="rvline miss"><span class="n">' + esc(m ? m.name : '(삭제된 회원)') + '</span>' +
      '<span class="a miss">미입력 ' + mmap[mid] + '건</span></div>';
  });
  if (!parts.length && !miss.length) return '<div class="rvdetail"><div class="hint" style="margin:2px 0 6px">이 기간에 차감된 레슨이 없어요.</div></div>';
  return '<div class="rvdetail">' + parts.join('') + miss.join('') + '</div>';
}

function revDetailSessions(rows){
  if (!rows.length) return '<div class="rvdetail"><div class="hint" style="margin:2px 0 6px">이 날 차감된 레슨이 없어요.</div></div>';
  return '<div class="rvdetail">' + rows.map(function(r){
    var st = STATUS[r.status] ? STATUS[r.status].label : '';
    return '<div class="rvline' + (r.missing ? ' miss' : '') + '"><span class="n">' + esc(r.name) +
      '<span class="t">' + r.time + ' · ' + r.dur + '분 · ' + st + '</span></span>' +
      '<span class="a' + (r.missing ? ' miss' : '') + '">' + (r.missing ? '금액 미입력' : money(r.unit)) + '</span></div>';
  }).join('') + '</div>';
}

/* 필드 · 숏게임 별도 결제 상세 줄 */
function revDetailSep(rows){
  if (!rows || !rows.length) return '';
  return '<div class="rvdetail">' + rows.map(function(r){
    var st = STATUS[r.status] ? STATUS[r.status].label : '';
    return '<div class="rvline sep' + (r.missing ? ' miss' : '') + '"><span class="n">' +
      SEP_KINDS[normSepKind(r.kind)].icon + ' ' + esc(r.name) +
      '<span class="t">' + r.time + ' · ' + r.dur + '분 · ' + sepKindShort(r.kind) + ' · ' + st + '</span></span>' +
      '<span class="a' + (r.missing ? ' miss' : '') + '">' + (r.missing ? '금액 미입력' : money(r.unit)) + '</span></div>';
  }).join('') + '</div>';
}

function revMonthBody(ym, cur){
  var months = [], max = 1;
  for (var i = 5; i >= 0; i--) {
    var k = addMonths(ym + '-01', -i).slice(0, 7);
    var rg = monthFromTo(k);
    var t = revenueRange(rg.from, rg.to).total;
    months.push({ key: k, total: t });
    max = Math.max(max, t);
  }
  var h = '<div class="sec" style="margin-top:16px"><h2>최근 6개월</h2><span class="aside">막대를 눌러 이동</span></div>' +
    '<div class="card"><div class="wchart rvchart">' + months.map(function(x){
      var hh = Math.max(4, Math.round(x.total / max * 84));
      var on = x.key === ym;
      return '<button class="wcol" data-act="rev-month" data-ym="' + x.key + '" aria-label="' + monthLabel(x.key) + ' 수입">' +
        '<span class="wval' + (on ? ' on' : '') + '">' + wonShort(x.total) + '</span>' +
        '<span class="wbar' + (x.total ? '' : ' zero') + '" style="height:' + hh + 'px"></span>' +
        '<span class="wlab' + (on ? ' on' : '') + '">' + (+x.key.slice(5, 7)) + '월</span></button>';
    }).join('') + '</div></div>';

  var list = revenueByMember(cur.rows);
  var shareBase = cur.passTotal || 0;
  h += '<div class="sec"><h2>회원별 기여</h2><span class="aside">수강권 ' + list.length + '명 · 금액순</span></div>';
  h += '<div class="rvlist">' + (list.length ? list.map(function(x){
    var share = shareBase ? Math.round(x.amount / shareBase * 100) : 0;
    return '<button class="rvmem" data-act="member-open" data-id="' + x.memberId + '">' +
      '<span class="rvmemhead"><span class="n">' + esc(x.name) + '</span>' +
        '<span class="c">' + x.count + '회 · ' + share + '%</span>' +
        '<span class="a">' + money(x.amount) + '</span></span>' +
      '<span class="rvshare"><i style="width:' + Math.max(3, share) + '%"></i></span></button>';
  }).join('') : '<div class="hint" style="margin:12px 2px">이 달에는 차감된 레슨이 없어요.</div>') + '</div>';

  /* 필드 · 숏게임 별도 수입을 회원/비회원별로 따로 */
  if (cur.sepCount) {
    var smap = {}, slist = [];
    cur.sepRows.forEach(function(r){
      var k = r.name;
      if (!smap[k]) { smap[k] = { name: r.name, kind: r.kind, count: 0, amount: 0 }; slist.push(smap[k]); }
      smap[k].count++; smap[k].amount += r.unit;
    });
    slist.sort(function(a, b){ return b.amount - a.amount; });
    h += '<div class="sec"><h2>별도 결제 수입</h2><span class="aside">필드·숏게임·원포인트 ' + cur.sepCount + '건 · ' + money(cur.sepTotal) + '</span></div>';
    h += '<div class="rvlist">' + slist.map(function(x){
      return '<div class="rvmem" style="cursor:default">' +
        '<span class="rvmemhead"><span class="n">' + SEP_KINDS[normSepKind(x.kind)].icon + ' ' + esc(x.name) + '</span>' +
          '<span class="c">' + x.count + '건</span>' +
          '<span class="a">' + money(x.amount) + '</span></span></div>';
    }).join('') + '</div>';
  }
  return h;
}

function revWeekBody(ym){
  var rng = monthFromTo(ym), weeks = [], max = 1;
  for (var d = 1; d <= rng.last; d += 7) {
    var to = Math.min(rng.last, d + 6);
    var g = revenueRange(ym + '-' + pad(d), ym + '-' + pad(to));
    weeks.push({ key: 'w' + d, idx: weeks.length + 1, from: d, to: to, total: g.total,
      passTotal: g.passTotal, sepTotal: g.sepTotal, deducted: g.deducted, sepCount: g.sepCount,
      missing: g.missing, rows: g.rows, missingByMember: g.missingByMember, sepRows: g.sepRows });
    max = Math.max(max, g.total);
  }
  return '<div class="rvlist" style="margin-top:16px">' + weeks.map(function(w){
    var open = ui.revOpen === w.key;
    var share = w.total ? Math.max(4, Math.round(w.total / max * 100)) : 0;
    return '<div class="rvitem">' +
      '<button class="rvrow" data-act="rev-open" data-key="' + w.key + '" data-open="' + (open ? 1 : 0) + '">' +
        '<span class="rvmain"><span class="rvtitle">' + w.idx + '주차</span>' +
          '<span class="rvmeta">' + fmtDot(ym + '-' + pad(w.from)) + '~' + fmtDot(ym + '-' + pad(w.to)) + ' · 차감 ' + w.deducted + '회' +
            (w.sepCount ? ' · 별도 ' + w.sepCount + '건' : '') + '</span>' +
          '<span class="rvshare"><i style="width:' + share + '%"></i></span></span>' +
        '<span class="rvright"><span class="rvamt">' + money(w.total) + '</span>' +
          (w.missing ? '<span class="rvcnt">미입력 ' + w.missing + '건</span>' : '') + '</span>' +
        '<span class="rvchev">' + ICON.chev + '</span>' +
      '</button>' +
      (open ? revDetailMembers(w.rows, w.missingByMember) + revDetailSep(w.sepRows) : '') +
    '</div>';
  }).join('') + '</div>';
}

function revDayBody(cur){
  var map = {}, days = [];
  function bucket(date){
    if (!map[date]) { map[date] = { key: 'd' + date, date: date, pass: 0, sep: 0, total: 0, count: 0, sepCount: 0, missing: 0, rows: [], sepRows: [] }; days.push(map[date]); }
    return map[date];
  }
  cur.all.forEach(function(r){
    var d = bucket(r.date);
    d.count++;
    d.rows.push(r);
    if (r.missing) d.missing++;
    else d.pass += r.unit;
  });
  cur.sepRows.forEach(function(r){
    var d = bucket(r.date);
    d.sepCount++;
    d.sepRows.push(r);
    if (!r.missing) d.sep += r.unit;
  });
  days.forEach(function(d){ d.total = d.pass + d.sep; });
  days.sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  var max = 1;
  days.forEach(function(d){ max = Math.max(max, d.total); });

  var h = '<div class="sec" style="margin-top:16px"><h2>일별 수입</h2><span class="aside">' + days.length + '일 · 최근순</span></div>';
  if (!days.length) return h + '<div class="empty" style="background:var(--card)"><div class="et">이 달에는 수입이 없어요</div><div class="ed">차감된 레슨이 생기면 날짜별로 쌓여요.</div></div>';
  return h + '<div class="rvlist">' + days.map(function(d){
    var open = ui.revOpen === d.key;
    var dow = WEEK[parseISO(d.date).getDay()];
    var share = d.total ? Math.max(4, Math.round(d.total / max * 100)) : 0;
    return '<div class="rvitem">' +
      '<button class="rvrow" data-act="rev-open" data-key="' + d.key + '" data-open="' + (open ? 1 : 0) + '">' +
        '<span class="rvmain"><span class="rvtitle">' + fmtDot(d.date) + ' (' + dow + ')</span>' +
          '<span class="rvmeta">차감 ' + d.count + '회' + (d.sepCount ? ' · 별도 ' + d.sepCount + '건' : '') +
            ' · 회원 ' + revenueByMember(d.rows).length + '명</span>' +
          '<span class="rvshare"><i style="width:' + share + '%"></i></span></span>' +
        '<span class="rvright"><span class="rvamt">' + money(d.total) + '</span>' +
          (d.missing ? '<span class="rvcnt">미입력 ' + d.missing + '건</span>' : '') + '</span>' +
        '<span class="rvchev">' + ICON.chev + '</span>' +
      '</button>' +
      (open ? revDetailSessions(d.rows) + revDetailSep(d.sepRows) : '') +
    '</div>';
  }).join('') + '</div>';
}

function viewRevenue(){
  var ym = ui.month;
  var rng = monthFromTo(ym);
  var cur = revenueRange(rng.from, rng.to);
  var prevYm = addMonths(ym + '-01', -1).slice(0, 7);

          : '이번 달 없음') + '</span></div>' +
    '</div>';

  if (cur.sepMissing > 0) {
    h += '<div class="rvmiss" style="margin-top:10px"><div class="t">별도 결제 금액 미입력 ' + cur.sepMissing + '건</div>' +
      '<div class="d">레슨을 열어 <b>별도 레슨비</b>를 넣으면 그만큼 수입에 더해져요.</div></div>';
  }

  if (cur.missing > 0) {
    h += '<div class="rvmiss"><div class="t">금액 미입력 ' + cur.missing + '건은 수입에서 빠졌어요</div>' +

      Object.keys(cur.missingByMember).map(function(mid){

  h += '<div class="sec"><h2>기간별 수입</h2><span class="aside">' + monthLabel(ym) + '</span></div>' +
    '<div class="seg rvunit">' +
      [['month', '월별'], ['week', '주별'], ['day', '일별']].map(function(t){
        return '<button class="' + (unit === t[0] ? 'on' : '') + '" data-act="rev-unit" data-v="' + t[0] + '">' + t[1] + '</button>';
      }).join('') +
    '</div>';

  if (unit === 'week') h += revWeekBody(ym);
  else if (unit === 'day') h += revDayBody(cur);
  else h += revMonthBody(ym, cur);

  return h;
}

var qaCtx = null;

var QA_EXAMPLES = [
  '내일 오후 3시 김민준 55분 분당',
  '11월 25일 14:30 박서연 판교연습장',
  '내일 오전 9시 필드 홍길동팀 120분 15만',
  '오늘 저녁 7시 원포인트 이서연 60분 8만'
];

function parseQuickLesson(text){
  var raw = String(text || '').trim();
  var res = { date:'', time:'', location:'', memberName:'', memberId:'', duration:0, minutes:0,
              gender:'', separate:false, kind:'', fee:0, found:{} };
  if (!raw) return res;
  var t = raw;
  var dp = parseDateFromText(raw);
  if (dp.date) {
    res.date = dp.date;
    res.found.date = true;
    if (dp.matchedRaw) t = t.replace(dp.matchedRaw, ' ');
  }
  var m;

  /* 필드 · 숏게임 · 원포인트 = 별도 결제 레슨 */
  if ((m = t.match(/원\s*포인트/))) {
    res.separate = true; res.kind = 'onepoint'; res.found.separate = true;
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/숏\s*게임/))) {
    res.separate = true; res.kind = 'shortgame'; res.found.separate = true;
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/필드(?:\s*레슨)?/))) {
    res.separate = true; res.kind = 'field'; res.found.separate = true;
    t = t.replace(m[0], ' ');
  }
  if (res.separate) {
    if ((m = t.match(/(\d+)\s*만\s*원?/))) { res.fee = (+m[1]) * 10000; res.found.fee = true; t = t.replace(m[0], ' '); }
    else if ((m = t.match(/(\d{4,7})\s*원/))) { res.fee = +m[1]; res.found.fee = true; t = t.replace(m[0], ' '); }
  }

  /* 시간 */
  if ((m = t.match(/(오전|오후|아침|저녁|밤)\s*(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/))) {
    var hh = +m[2], mi = m[3] ? +m[3] : 0;
    var pm = (m[1] === '오후' || m[1] === '저녁' || m[1] === '밤');
    if (pm && hh < 12) hh += 12;
    if (!pm && hh === 12) hh = 0;
    if (hh < 24 && mi < 60) { res.time = pad(hh) + ':' + pad(mi); res.found.time = true; }
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/(\d{1,2})\s*:\s*(\d{2})/))) {
    if ((+m[1]) < 24 && (+m[2]) < 60) { res.time = pad(+m[1]) + ':' + m[2]; res.found.time = true; }
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/))) {
    var h2 = +m[1], m2 = m[2] ? +m[2] : 0;
    if (h2 >= 1 && h2 <= 6) h2 += 12;
    if (h2 < 24 && m2 < 60) { res.time = pad(h2) + ':' + pad(m2); res.found.time = true; }
    t = t.replace(m[0], ' ');
  }

  /* 수업 시간 25분 / 55분 (필드 · 숏게임은 적힌 분을 그대로 쓴다) */
  if ((m = t.match(/(\d{2,3})\s*분/))) {
    var v = +m[1];
    if (v >= 10 && v <= 720) {
      res.minutes = v;
      res.duration = (v <= 35 ? 25 : 55);
      res.durationRaw = v; res.found.duration = true;
    }
    t = t.replace(m[0], ' ');
  }

  /* 성별 */
  if ((m = t.match(/(남성|남자|여성|여자)/))) {
    res.gender = (m[1].charAt(0) === '남' ? 'male' : 'female');
    t = t.replace(m[0], ' ');
  } else if ((m = t.match(/\s(남|여)(?=\s)/))) {
    res.gender = (m[1] === '남' ? 'male' : 'female');
    t = t.replace(' ' + m[1] + ' ', ' ');
  }

  /* 남은 토큰: 회원 이름 / 장소 */
  var toks = t.replace(/[,·、]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').filter(function(x){ return !!x; });
  var loc = [];
  toks.forEach(function(tok){
    var v = tok.replace(/[()\[\]"]/g, '').replace(/(님|씨|회원)$/, '').trim();
    if (!v) return;
    if (!res.memberName && /^[가-힣]{2,5}$/.test(v) && !isRegionWord(v) && !isLevelWord(v) && !isNameStopWord(v)) { res.memberName = v; res.found.member = true; return; }
    if (!res.memberName && /^[A-Za-z][A-Za-z.]{1,14}$/.test(v)) { res.memberName = v; res.found.member = true; return; }
    if (isLevelWord(v)) { res.level = v; return; }
    loc.push(v);
  });
  res.location = loc.join(' ').trim();
  if (res.location) res.found.location = true;

  if (res.memberName) {
    for (var i = 0; i < state.members.length; i++) {
      if (state.members[i].name === res.memberName) { res.memberId = state.members[i].id; break; }
    }
  }
  return res;
}

    opts.push({ v:'__new__', label:'＋ 새 회원으로 추가', sub: parsed.memberName });
  }
  if (!opts.length) opts.push({ v:'__new__', label:'＋ 새 회원으로 추가' });

  var cur = keep || (hidden ? hidden.value : '') || (opts[0] ? opts[0].v : '');

function validateQuick(){
  if (!qaCtx) return;
  var w = document.getElementById('qaWarn');
  if (!w) return;
  var dEl = document.getElementById('qaDate'), tEl = document.getElementById('qaTime');
  var msgs = [];
  var date = dEl ? dEl.value : (qaCtx.date || '');
  var time = tEl ? tEl.value : (qaCtx.time || '');
  var sep = qaCtx.mode === 'sep';
  var dur = sep ? qaSepDurNow() : (qaCtx.duration || 55);
  var who = '';
  if (!date) msgs.push('날짜를 골라주세요.');
  if (!time) msgs.push('시간을 골라주세요.');
  if (sep) {
    if (qaCtx.target === 'guest') {
      var g = document.getElementById('qaGuest');
      who = g ? g.value.trim() : (qaCtx.guest || '');
      if (!who) msgs.push('비회원 이름이나 팀명을 적어주세요.');
    } else {
      var mm = document.getElementById('qaMember');
      var mid = mm ? mm.value : qaCtx.memberId;
      if (!mid) msgs.push('회원을 골라주세요.');
      who = mid ? memberName(mid) : '';
    }
    if (!dur || dur < 15) msgs.push('소요시간을 15분 이상으로 넣어주세요.');
    else if (dur > 720) msgs.push('소요시간은 720분 이하로 넣어주세요.');
  } else {
    var sel = document.getElementById('qaMember');
    var mid2 = sel ? sel.value : '';
    if (!mid2) msgs.push('회원을 골라주세요.');
    if (mid2 === '__new__' && !qaCtx.parsedName) msgs.push('새 회원 이름을 적어주세요.');
    who = mid2 === '__new__' ? qaCtx.parsedName : (mid2 ? memberName(mid2) : '');
  }
  if (date && time && dur) {
    var a = minOf(time), b = a + dur;
    var clash = sessionsByDate(date).filter(function(s){
      if (s.status === 'excused_cancel' || s.status === 'same_day_cancel' || s.status === 'no_show') return false;
      return a < sessionEnd(s) && minOf(s.startTime) < b;
    });
    if (clash.length) msgs.push(clash[0].startTime + '에 ' + sessionName(clash[0]) + ' 레슨이 있어요.');
  }
  if (msgs.length) {
    w.innerHTML = '<div class="err">' + esc(msgs.join(' ')) + '</div>';
  } else if (sep) {
    var fEl = document.getElementById('qaFee');
    var fee = feeNum(fEl ? fEl.value : qaCtx.fee);
    w.innerHTML = '<div class="ok">' + sepIcon({ lessonKind: qaCtx.kind }) + ' ' + esc(sepKindName(qaCtx.kind)) + ' · ' +
      esc(who) + ' · ' + fmtShort(date) + ' ' + time + ' · ' + dur + '분 · ' + (fee ? money(fee) : '금액 미입력') + '</div>';
  } else {
    w.innerHTML = '<div class="ok">' + fmtShort(date) + ' ' + time + ' · ' + esc(who) + ' ' + (qaCtx.duration || 55) + '분</div>';
  }
  var btn = qaCtx.sh.footer.querySelector('[data-act="qa-save"]');
  if (btn) btn.disabled = msgs.length > 0;
}

function saveQuickLesson(){
  if (!qaCtx) return;
  var dEl = document.getElementById('qaDate'), tEl = document.getElementById('qaTime');
  if (!dEl || !tEl || !dEl.value || !tEl.value) { toast('날짜 · 시간을 채워주세요'); return; }
  var date = dEl.value, time = tEl.value, s = null, label = '';

  if (qaCtx.mode === 'sep') {
    var dur = qaSepDurNow();
    if (!dur || dur < 15) { toast('소요시간을 넣어주세요'); return; }
    var mid = null, guest = '', addedName = '';
    if (qaCtx.target === 'guest') {
      var gEl = document.getElementById('qaGuest');
      guest = gEl ? gEl.value.trim() : (qaCtx.guest || '');
      if (!guest) { toast('비회원 이름이나 팀명을 적어주세요'); return; }
      /* 별도 결제로 온 사람은 회원목록에 남긴다 — 나중에 수강권으로 전환 가능 */
      var knownGuest = !!findMemberByName(guest);
      var gm = ensureMemberForGuest(guest);
      if (gm) { mid = gm.id; if (!knownGuest) addedName = gm.name; guest = ''; }
    } else {
      var mSel = document.getElementById('qaMember');
      mid = mSel ? mSel.value : qaCtx.memberId;
      if (!mid || mid === '__new__') { toast('회원을 골라주세요'); return; }
    }
    var lEl = document.getElementById('qaLocation'), fEl = document.getElementById('qaFee');
    s = {
      id: uid('lsn'), memberId: mid || null, packageId: '',
      guestName: guest, lessonKind: normSepKind(qaCtx.kind),
      separatePay: true, fee: feeNum(fEl ? fEl.value : qaCtx.fee),
      date: date, startTime: time, durationMinutes: dur,
      location: lEl ? lEl.value.trim() : '',
      status: 'scheduled', deducted: false, charged: false,
      memo: '', settledAt: '', source: 'quick'
    };
    label = sepIcon({ lessonKind: s.lessonKind }) + ' ' + sepKindName(s.lessonKind) + ' · ' + (guest || memberName(mid));
  } else {
    var sel = document.getElementById('qaMember'), lEl2 = document.getElementById('qaLocation');
    var mid3 = sel ? sel.value : '';
    if (!mid3) { toast('회원을 골라주세요'); return; }
    if (mid3 === '__new__') {
      var name = (qaCtx.parsedName || '').trim();
      if (!name) { toast('새 회원 이름을 적어주세요'); return; }
      var nm = { id: uid('mem'), name: name, gender: qaCtx.gender || '', region: '', phone: '', level: '', memo: '', since: todayISO() };
      state.members.push(nm);
      mid3 = nm.id;
    }
    var dur2 = qaCtx.duration || 55;
    var pkg = null;
    activePkgs(mid3).forEach(function(p){
      if (p.durationMinutes === dur2 && !pkg && !(p.expiryDate && p.expiryDate < todayISO())) pkg = p;
    });
    if (!pkg) activePkgs(mid3).forEach(function(p){ if (p.durationMinutes === dur2 && !pkg) pkg = p; });
    s = {
      id: uid('lsn'), memberId: mid3, packageId: pkg ? pkg.id : '', date: date, startTime: time,
      durationMinutes: dur2, location: lEl2 ? lEl2.value.trim() : '',
      status:'scheduled', deducted:false, memo:'', settledAt:'', source:'quick'
    };
    label = memberName(mid3) + ' ' + dur2 + '분';
  }

  state.sessions.push(s);
  save();
  ui.tab = 'calendar'; ui.date = date; ui.month = date.slice(0, 7);
  var sh = qaCtx.sh;
  qaCtx = null;
  stopQaVoice();
  if (sh) sh.close();
  render();
  toast(fmtShort(date) + ' ' + time + ' · ' + label + ' 추가' + (addedName ? ' · ' + addedName + ' 회원목록에 저장' : ''));
  calendarAfterAdd(s);
}

function onClick(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act');
  var i, w;

  switch (act) {
    case 'tab':
      closeAllSheets();
      ui.tab = el.getAttribute('data-tab');
      render();
      break;

    case 'theme':
      setTheme(el.getAttribute('data-v'));
      break;

    case 'member-sort': {
      var sm = el.getAttribute('data-v') || 'remaining';
      if (memberSortMode() === sm) break;
      state.memberSort = sm;
      save();
      render(true);
      toast('회원 목록 · ' + memberSortLabel(sm));
      break;
    }

    case 'day':
      ui.date = el.getAttribute('data-date');
      render();
      break;

    case 'month': {
      var delta = parseInt(el.getAttribute('data-delta'), 10) || 0;
      if (!delta) { ui.date = todayISO(); }
      else {
        var d0 = parseISO(ui.date);
        ui.date = iso(new Date(d0.getFullYear(), d0.getMonth() + delta, 1));
      }
      render();
      break;
    }

    case 'stats-month': {
      var dl = parseInt(el.getAttribute('data-delta'), 10) || 0;
      if (!dl) ui.month = todayISO().slice(0, 7);
      else {
        var p = ui.month.split('-');
        var d1 = new Date(+p[0], (+p[1]) - 1 + dl, 1);
        ui.month = d1.getFullYear() + '-' + pad(d1.getMonth() + 1);
      }
      ui.revOpen = '';
      render();
      break;
    }

    /* ---------- 통계 하위 메뉴 · 수입 정산 ---------- */
    case 'stats-view':
      ui.stats = el.getAttribute('data-v') === 'revenue' ? 'revenue' : 'lesson';
      ui.revOpen = '';
      render();
      break;

    case 'rev-unit':
      ui.revUnit = el.getAttribute('data-v') || 'month';
      ui.revOpen = '';
      render(true);
      break;

    case 'rev-month': {
      var ymv = el.getAttribute('data-ym');
      if (ymv) { ui.month = ymv; ui.revOpen = ''; render(true); }
      break;
    }

    case 'rev-open': {
      var rk = el.getAttribute('data-key');
      ui.revOpen = (ui.revOpen === rk) ? '' : rk;
      render(true);
      break;
    }

    case 'pkg-price':
      openPriceSheet(el.getAttribute('data-mid'));
      break;

    case 'price-save':
      savePrice();
      break;

    /* ---------- 앱 안 피커 ---------- */
    case 'pick':
      openPick(el.getAttribute('data-field'));
      break;

    case 'pick-set': {
      if (!pickCtx) break;
      var pf = pickCtx.field, pv = el.getAttribute('data-v');
      pickCtx.sh.close();
      pickCtx = null;
      applyPick(pf, pv);
      break;
    }

    case 'datepick':
      openDatePick(el.getAttribute('data-field'));
      break;

    case 'dpmon': {
      if (!dpCtx) break;
      var dmd = parseInt(el.getAttribute('data-delta'), 10) || 0;
      var dmp = dpCtx.ym.split('-');
      var dmd2 = new Date(+dmp[0], (+dmp[1]) - 1 + dmd, 1);
      dpCtx.ym = dmd2.getFullYear() + '-' + pad(dmd2.getMonth() + 1);
      paintDatePick();
      break;
    }

    case 'dpday':
      if (!dpCtx) break;
      var dpf = dpCtx.field, dpv = el.getAttribute('data-date');
      dpCtx.sh.close();
      dpCtx = null;
      applyDate(dpf, dpv);
      break;

    case 'dp-today':
      if (!dpCtx) break;
      var dpf2 = dpCtx.field;
      dpCtx.sh.close();
      dpCtx = null;
      applyDate(dpf2, todayISO());
      break;

    case 'timepick':
      openTimePick(el.getAttribute('data-field'));
      break;

    case 'tpick':
      if (!tpCtx) break;
      var tpf = tpCtx.field, tpv = el.getAttribute('data-v');
      tpCtx.sh.close();
      tpCtx = null;
      applyTime(tpf, tpv);
      break;

    case 'sheet-close':
      /* X · 취소도 바깥 탭과 같은 길로 — 적어 둔 글이 있으면 확인 시트를 먼저 띄웁니다 */
      requestSheetClose(el.closest('.sheetwrap'));
      break;

    case 'confirm-yes': {
      var fn = confirmFn;
      confirmFn = null;
      closeSheetEl(el.closest('.sheetwrap'));
      if (fn) fn();
      break;
    }

    /* 적어 둔 글 보호 — 계속 작성 / 그래도 닫기 */
    case 'discard-stay':
      discardStay();
      closeSheetEl(el.closest('.sheetwrap'));
      break;

    case 'discard-close':
      discardAndClose(el.closest('.sheetwrap'));
      break;

    /* ---------- 레슨 상태 ---------- */
    case 'status-sheet':
      openStatusSheet(el.getAttribute('data-sid'));
      break;

    /* 수정 = 상태는 그대로 두고 예약 내용만 고치는 폼을 연다 */
    case 'lesson-edit': {
      var eid = el.getAttribute('data-sid');
      w = el.closest('.sheetwrap');
      if (w) closeSheetEl(w);
      openBookSheet({ edit: eid });
      break;
    }

    case 'status-set': {
      var s = findSession(el.getAttribute('data-sid'));
      if (!s) break;
      var st = el.getAttribute('data-status');
      var pkg = pkgById(s.packageId);
      w = el.closest('.sheetwrap');
      if (st === 'excused_cancel') {
        /* 일반취소 = 차감 되돌리고 일정에서 삭제 (오늘·캘린더에서 사라짐) */
        var cx = cancelExcused(s);
        save();
        if (w) closeSheetEl(w);
        render(true);
        lastCancel = cx;
        var cmsg = cx.memberName + ' 일반취소 · 일정에서 지웠어요';
        if (cx.wasDeducted) cmsg += ' · 잔여 ' + cx.remaining + '회로 복구';
        toast(cmsg, { label:'되돌리기', act:'status-undo', ms:6000 });
        break;
      }
      applyStatus(s, st);
      save();
      if (w) closeSheetEl(w);
      render(true);
      if (isSep(s)) toast(STATUS[st].label + ' 처리 · ' + sessionName(s) + ' · 별도 수입 ' + (CHARGED[st] ? '포함' : '없음'));
      else toast(STATUS[st].label + ' 처리' + (pkg ? ' · ' + memberName(s.memberId) + ' 잔여 ' + pkg.remainingSessions + '회' : ''));
      break;
    }

    case 'status-undo': {
      var uc = lastCancel;
      lastCancel = null;
      var tel = document.getElementById('toast');
      if (tel) tel.classList.remove('on');
      if (!uc) break;
      if (undoCancelExcused(uc)) {
        save();
        render(true);
        var bs = uc.snap;
        toast(sessionName(bs) + ' ' + fmtDot(bs.date) + ' ' + bs.startTime + ' · ' +
          (STATUS[bs.status] ? STATUS[bs.status].label : '예정') + ' 상태로 되돌렸어요' +
          (uc.wasDeducted ? ' · 차감도 원래대로' : ''));
      }
      break;
    }

    /* ---------- 외부 캘린더 ---------- */
    case 'cal-toggle': {
      var cst = calSync();
      cst.enabled = !cst.enabled;
      save();
      calSaved = true;
      paintCalSetting();
      toast(cst.enabled ? '캘린더 연동 켜짐 · ' + calTargetLabel(cst.target) : '캘린더 연동 꺼짐');
      break;
    }

    case 'cal-target': {
      var csg = calSync();
      if (!csg.enabled) { toast('캘린더 연동 스위치를 먼저 켜 주세요'); break; }
      var cv = el.getAttribute('data-v');
      if (csg.target === cv) break;
      csg.target = cv;
      save();
      calSaved = true;
      paintCalSetting();
      toast('연동 캘린더 · ' + calTargetLabel(cv) + ' 저장됨');
      break;
    }

    case 'cal-sheet':
      openCalSheet(el.getAttribute('data-sid'));
      break;

    case 'cal-apple': {
      var sa = findSession(el.getAttribute('data-sid'));
      if (!sa) break;
      toast(addToAppleCalendar(sa)
        ? '.ics 파일을 만들었어요 · 열어서 "캘린더에 추가"를 누르면 끝'
        : '캘린더 파일을 만들지 못했어요 · 다시 시도해 주세요', { ms: 3600 });
      break;
    }

    case 'cal-google': {
      var sg = findSession(el.getAttribute('data-sid'));
      if (!sg) break;
      if (addToGoogleCalendar(sg)) {
        w = el.closest('.sheetwrap');
        if (w) closeSheetEl(w);
      } else {
        calPendingSid = sg.id;
        toast('팝업이 막혔어요 · 구글 캘린더로 열기', { act:'cal-google-retry', label:'열기', ms: 8000 });
      }
      break;
    }

    case 'cal-google-retry': {
      var sp = calPendingSid ? findSession(calPendingSid) : null;
      calPendingSid = null;
      var tel = document.getElementById('toast');
      if (tel) tel.classList.remove('on');
      if (sp) { try { window.open(gcalUrl(sp), '_blank'); } catch(e){} }
      break;
    }

    /* ---------- 마감 정산 ---------- */
    case 'settle-open':
      openSettleSheet(todayISO());
      break;

    case 'settle-set':
      if (!settleCtx) break;
      settleCtx.sel.decisions[el.getAttribute('data-sid')] = el.getAttribute('data-status');
      paintSettle();
      break;

    case 'settle-all':
      if (!settleCtx) break;
      settleCtx.list.forEach(function(x){
        if (!settleCtx.sel.decisions[x.id]) settleCtx.sel.decisions[x.id] = 'completed';
      });
      paintSettle();
      break;

    case 'settle-apply':
      settleApply();
      break;

    /* ---------- 수업 메모 ---------- */
    case 'note-open':
      openSessionMemoSheet(el.getAttribute('data-sid'));
      break;

    /* ---------- 오늘 차트 메모 (오늘 탭 카드의 [레슨 차트]) ---------- */
    case 'tm-open':
      openTodayMemoSheet(el.getAttribute('data-sid'));
      break;

    case 'tm-voice':
      toggleTmVoice();
      break;

    case 'tm-save':
      saveTodayMemo();
      break;

    case 'tm-kakao': {
      var tmk = kakaoReportForSession(el.getAttribute('data-sid'));
      if (!tmk) { toast('복사할 레슨 정보가 없어요'); break; }
      copyText(tmk, function(ok){
        toast(ok ? '카톡용 레슨 요약이 복사됐어요' : '복사가 안 됐어요 · 다시 눌러 주세요', { ms: ok ? 2200 : 3000 });
      });
      break;
    }

    /* ---------- 카톡 요약 복사 ---------- */
    case 'kakao-copy': {
      var ksid = el.getAttribute('data-sid');
      var kmid = el.getAttribute('data-mid');
      var ktxt = ksid ? kakaoReportForSession(ksid) : (kmid ? kakaoReportForMember(kmid) : '');
      if (!ktxt) { toast('복사할 레슨 정보가 없어요'); break; }
      copyText(ktxt, function(ok){
        toast(ok ? '카톡용 레슨 요약이 복사됐어요' : '복사가 안 됐어요 · 다시 눌러 주세요', { ms: ok ? 2200 : 3000 });
      });
      break;
    }

    /* ---------- 수강권 연장 (재등록) ---------- */
    case 'renew-open':
      openRenewSheet(el.getAttribute('data-id'));
      break;

    case 'renew-preset': {
      if (!renewCtx) break;
      renewCtx.sessions = parseInt(el.getAttribute('data-v'), 10) || 0;
      var rqEl = document.getElementById('rqSessions');
      if (rqEl) rqEl.value = renewCtx.sessions;
      if (!renewCtx.amountTouched) renewCtx.amount = renewalDefaultAmount(renewCtx.memberId, renewCtx.sessions, renewCtx.duration);
      paintRenew();
      break;
    }

    case 'renew-direct': {
      var rqEl2 = document.getElementById('rqSessions');
      if (rqEl2) { rqEl2.focus(); try { rqEl2.select(); } catch(e){} }
      break;
    }

    case 'renew-dur': {
      if (!renewCtx) break;
      renewCtx.duration = parseInt(el.getAttribute('data-v'), 10) || 55;
      for (i = 0; i < el.parentNode.children.length; i++) {
        el.parentNode.children[i].classList.toggle('on', el.parentNode.children[i] === el);
      }
      if (!renewCtx.amountTouched) renewCtx.amount = renewalDefaultAmount(renewCtx.memberId, renewCtx.sessions, renewCtx.duration);
      paintRenew();
      break;
    }

    case 'renew-apply':
      saveRenewal();
      break;

    /* ---------- 골프 태그 ---------- */
    case 'note-tag': {
      if (!memberCtx) break;
      var tkey = el.getAttribute('data-v');
      var sel = isArr(memberCtx.tagSel) ? memberCtx.tagSel : [];
      var at = sel.indexOf(tkey);
      if (at >= 0) sel.splice(at, 1); else sel.push(tkey);
      memberCtx.tagSel = sortTags(sel);
      memberCtx.tagTouched = true;
      el.classList.toggle('on', memberCtx.tagSel.indexOf(tkey) >= 0);
      break;
    }

    case 'tag-filter': {
      if (!memberCtx) break;
      memberCtx.tagFilter = el.getAttribute('data-v') || '전체';
      paintMemberSheet();
      break;
    }

    case 'sm-save': {
      var ss = findSession(el.getAttribute('data-sid'));
      var ta = document.getElementById('smMemo');
      if (ss && ta) { ss.memo = ta.value.trim(); save(); }
      closeSheetEl(el.closest('.sheetwrap'));
      render(true);
      toast('수업 메모를 저장했어요');
      break;
    }

    /* ---------- 회원 ---------- */
    case 'member-open':
      openMemberSheet(el.getAttribute('data-id'));
      break;

    case 'member-add':
      openAddMemberSheet(null);
      break;

    case 'member-edit':
      openAddMemberSheet(memberById(el.getAttribute('data-id')));
      break;

    case 'member-save':
      saveMember();
      break;

    case 'memo-save': {
      if (!memberCtx) break;
      var mm = memberById(memberCtx.memberId);
      var mt = document.getElementById('swingMemo');
      if (mm && mt) { mm.memo = mt.value.trim(); save(); toast('회원 메모를 저장했어요'); }
      break;
    }

    /* ---------- 수강권 ---------- */
    case 'pkg-add':
      openPackageSheet(el.getAttribute('data-id'));
      break;

    case 'pkg-save':
      savePackage();
      break;

    case 'pk-dur':
      if (!pkgCtx) break;
      pkgCtx.duration = parseInt(el.getAttribute('data-v'), 10) || 55;
      for (i = 0; i < el.parentNode.children.length; i++) {
        el.parentNode.children[i].classList.toggle('on', el.parentNode.children[i] === el);
      }
      break;

    case 'pk-count': {
      var pc = document.getElementById('pkSessions');
      if (pc) pc.value = el.getAttribute('data-v');
      updatePkUnit();
      var chips = el.parentNode.children;
      for (i = 0; i < chips.length; i++) chips[i].classList.toggle('on', chips[i] === el);
      break;
    }

    /* ---------- 레슨 차트 ---------- */
    case 'voice':
      toggleVoice();
      break;

    case 'note-save':
      saveNote();
      break;

    case 'note-del': {
      var nid = el.getAttribute('data-nid');
      askConfirm('기록 삭제', '이 레슨 기록을 지울까요? 되돌릴 수 없어요.', '기록 삭제', function(){
        state.notes = (state.notes || []).filter(function(n){ return n.id !== nid; });
        save();
        if (memberCtx) paintMemberSheet();
        render(true);
        toast('기록을 삭제했어요');
      });
      break;
    }

    /* ---------- 한 줄 회원 추가 ---------- */
    case 'quick-example': {
      var q = document.getElementById('quickLine');
      if (q) { q.value = el.getAttribute('data-v'); applyQuickLine(); }
      break;
    }

    case 'quick-focus': {
      /* 안내 배지를 누르면 새 창을 열지 않고, 여러 줄을 붙여넣을 입력칸으로 커서만 보냅니다 */
      var qf = document.getElementById('quickLine');
      if (qf) { qf.focus(); }
      toast('한 줄에 한 명씩 여러 줄을 붙여넣으면 한꺼번에 등록돼요', { ms: 2600 });
      break;
    }

    case 'mf-gender':
      setGenderUI(el.getAttribute('data-v'));
      renderGenderChips(el);
      break;

    case 'mf-dur':
      if (!addCtx) break;
      addCtx.duration = parseInt(el.getAttribute('data-v'), 10) || 55;
      setDurUI(addCtx.duration);
      break;

    case 'mf-count': {
      var sc = document.getElementById('mfSessions');
      if (sc) sc.value = el.getAttribute('data-v');
      updateUnit();
      break;
    }

    /* ---------- 예약 ---------- */
    case 'book-open':
      openBookSheet({
        date: ui.tab === 'calendar' ? ui.date : todayISO(),
        memberId: el.getAttribute('data-member') || null
      });
      break;

    case 'bk-dur':
      if (!bookCtx) break;
      bookCtx.dur = parseInt(el.getAttribute('data-v'), 10) || 55;
      for (i = 0; i < el.parentNode.children.length; i++) {
        el.parentNode.children[i].classList.toggle('on', el.parentNode.children[i] === el);
      }
      refreshBkPkgs();
      break;

    /* ---------- 필드 · 숏게임 (별도 결제) ---------- */
    case 'bk-mode':
      if (!bookCtx) break;
      bookSync();
      var modeNext = el.getAttribute('data-v') === 'sep' ? 'sep' : 'pass';
      /* 이미 정산된 레슨은 수강권↔별도 결제를 바꾸면 차감이 어긋난다 */
      var editCur = bookCtx.editing ? findSession(bookCtx.editing) : null;
      if (editCur && (editCur.deducted || editCur.charged) && (isSep(editCur) !== (modeNext === 'sep'))) {
        toast('이미 정산된 레슨이라 모드는 바꿀 수 없어요');
        break;
      }
      bookCtx.mode = modeNext;
      if (bookCtx.mode === 'sep' && !bookCtx.sepDur) bookCtx.sepDur = 120;
      paintBook();
      break;

    case 'bk-kind':
      if (!bookCtx) break;
      bookSync();
      bookCtx.kind = normSepKind(el.getAttribute('data-v'));
      paintBook();
      break;

    case 'bk-target':
      if (!bookCtx) break;
      bookSync();
      bookCtx.target = el.getAttribute('data-v') === 'guest' ? 'guest' : 'member';
      paintBook();
      break;

    case 'bk-sepdur':
      if (!bookCtx) break;
      bookCtx.sepDur = parseInt(el.getAttribute('data-v'), 10) || 120;
      w = document.getElementById('bkSepDur');
      if (w) w.value = '';          /* 프리셋을 고르면 직접 입력칸은 다시 비운다 */
      syncSepDurChips('bk', bookCtx.sepDur);
      validateBook();
      break;

    case 'sep-fee-save': {
      var sf = findSession(el.getAttribute('data-sid'));
      var fe = document.getElementById('sepFee');
      if (!sf || !fe) break;
      sf.fee = feeNum(fe.value);
      save();
      w = el.closest('.sheetwrap');
      if (w) closeSheetEl(w);
      render(true);
      toast(sessionName(sf) + ' 별도 레슨비 ' + (sepFee(sf) ? money(sepFee(sf)) : '미입력') + ' 저장');
      break;
    }

    case 'book-save':
      saveBooking();
      break;

    /* ---------- 캘린더 + 한 줄 추가 ---------- */
    case 'quick-add':
      /* 오늘 탭에서는 '오늘'로, 캘린더 탭에서는 고른 날짜로 레슨을 잡습니다 */
      openQuickAddSheet(ui.tab === 'today' ? todayISO() : ui.date);
      break;

    case 'qa-voice':
      toggleQaVoice();
      break;

    case 'am-voice':
      toggleAmVoice();
      break;

    case 'qa-example': {
      var ql = document.getElementById('qaLine');
      if (ql) { ql.value = el.getAttribute('data-v'); applyQuickParse(); }
      break;
    }

    case 'qa-dur':
      if (!qaCtx) break;
      qaCtx.duration = parseInt(el.getAttribute('data-v'), 10) || 55;
      setSegValue('qaDur', qaCtx.duration);
      validateQuick();
      break;

    case 'qa-mode': {
      if (!qaCtx) break;
      qaSyncFromDOM();
      qaCtx.mode = el.getAttribute('data-v') === 'sep' ? 'sep' : 'pass';
      paintQaForm();
      validateQuick();
      break;
    }

    case 'qa-kind':
      if (!qaCtx) break;
      qaSyncFromDOM();
      qaCtx.kind = normSepKind(el.getAttribute('data-v'));
      paintQaForm();
      validateQuick();
      break;

    case 'qa-target':
      if (!qaCtx) break;
      qaSyncFromDOM();
      qaCtx.target = el.getAttribute('data-v') === 'guest' ? 'guest' : 'member';
      paintQaForm();
      validateQuick();
      break;

    case 'qa-sepdur':
      if (!qaCtx) break;
      qaCtx.sepDur = parseInt(el.getAttribute('data-v'), 10) || 120;
      w = document.getElementById('qaSepDur');
      if (w) w.value = '';          /* 프리셋을 고르면 직접 입력칸은 다시 비운다 */
      syncSepDurChips('qa', qaCtx.sepDur);
      validateQuick();
      break;

    case 'qa-save':
      saveQuickLesson();
      break;

    /* ---------- 통계 / 설정 ---------- */
    case 'tpl-use': {
      var tid = el.getAttribute('data-id');
      var tpl = null;
      state.templates.forEach(function(t){ if (t.id === tid) tpl = t; });
      openAddMemberSheet(null, tpl);
      break;
    }

    case 'pro-save': {
      var pEl = document.getElementById('setPro'), aEl = document.getElementById('setAcademy');
      if (pEl && pEl.value.trim()) state.pro.name = pEl.value.trim();
      if (aEl) state.pro.academy = aEl.value.trim();
      save();
      render();
      toast('프로 정보를 저장했어요');
      break;
    }

    case 'export-data':
      exportData();
      break;

    case 'demo-reset':
      askConfirm('샘플 데이터 채우기', '지금 이 브라우저에 저장한 예약·회원·기록이 모두 지워지고, 기능을 둘러볼 수 있는 예시 데이터로 바뀌어요.', '샘플로 바꾸기', resetDemo);
      break;

    case 'fresh-start':
      askConfirm('내 데이터로 새로 시작', '이 브라우저에 저장한 예약·회원·수강권·레슨 기록이 모두 지워지고, 지금 프로 이름과 소속만 남긴 빈 상태로 시작해요. 되돌릴 수 없어요.', '빈 상태로 시작', resetFresh);
      break;

    /* ---------- 체험판 시작 온보딩 ---------- */
    case 'onboard-start':
      finishOnboarding(false);
      break;

    case 'onboard-demo':
      finishOnboarding(true);
      break;

    default:
      break;
  }
}

function renderGenderChips(el){
  var seg = document.getElementById('mfGender');
  if (!seg) return;
  for (var i = 0; i < seg.children.length; i++) {
    seg.children[i].classList.toggle('on', seg.children[i] === el);
  }
}

function onFieldChange(e){
  var t = e.target;
  /* 온보딩 이름칸에 글자가 들어오면 빨간 안내를 지운다 */
  if (t && t.id === 'ozPro') {
    var er = document.getElementById('ozErr');
    if (er && String(t.value || '').trim()) er.classList.remove('on');
  }
  var pid = t && t.getAttribute ? t.getAttribute('data-pid') : null;
  if (pid) {
    var pkg = pkgById(pid);
    var hintEl = document.getElementById('pv_' + pid);
    var v = parseInt(String(t.value).replace(/[^0-9]/g, ''), 10);
    if (hintEl && pkg) {
      hintEl.innerHTML = (v > 0 && pkg.totalSessions > 0)
        ? '회당 약 <b>' + money(Math.round(v / pkg.totalSessions)) + '</b> · 총 ' + money(v)
        : '금액을 넣으면 회당 금액을 계산해 드려요.';
    }
    return;
  }
  var id = t && t.id;
  if (!id) return;
  if (id === 'mSearch') {
    ui.search = e.target.value;
    var box = document.getElementById('memberList');
    if (box) box.innerHTML = memberRowsHTML(filteredMembers());
  } else if (id === 'quickLine') {
    applyQuickLine();
  } else if (id === 'mfSessions' || id === 'mfPrice' || id === 'mfRemain') {
    updateUnit();
  } else if (id === 'pkSessions' || id === 'pkPrice') {
    updatePkUnit();
  } else if (id === 'noteText') {
    refreshNoteDate();
    refreshNoteTags();
  } else if (id === 'tmText') {
    paintTodayMemoTags();
  } else if (id === 'rqSessions') {
    if (!renewCtx) return;
    var rn = parseInt(e.target.value, 10);
    renewCtx.sessions = (rn > 0) ? rn : 0;
    if (!renewCtx.amountTouched) renewCtx.amount = renewalDefaultAmount(renewCtx.memberId, renewCtx.sessions, renewCtx.duration);
    paintRenew();
  } else if (id === 'rqAmount') {
    if (!renewCtx) return;
    var rav = String(e.target.value).replace(/[^0-9]/g, '');
    renewCtx.amount = rav === '' ? '' : parseInt(rav, 10);
    renewCtx.amountTouched = true;
    paintRenew();
  } else if (id === 'noteDate') {
    if (memberCtx) memberCtx.noteDate = e.target.value;
  } else if (id === 'bkMember') {
    refreshBkPkgs();
  } else if (id === 'bkGuest' || id === 'bkFee' || id === 'bkSepDur' || id === 'bkLocation' || id === 'bkMemo') {
    if (bookCtx) {
      if (id === 'bkGuest') bookCtx.guest = t.value;
      else if (id === 'bkFee') {
        bookCtx.fee = t.value;
        var bh = document.getElementById('bkFeeHint');
        if (bh) bh.innerHTML = feeHintHTML(t.value);
      } else if (id === 'bkSepDur') {
        var bv = parseInt(String(t.value).replace(/[^0-9]/g, ''), 10);
        bookCtx.sepDur = bv > 0 ? bv : 120;   /* 직접 입력하면 프리셋 강조를 풀고, 지우면 기본 120분 */
        syncSepDurChips('bk', bookCtx.sepDur);
      } else if (id === 'bkLocation') bookCtx.location = t.value;
      else if (id === 'bkMemo') bookCtx.memo = t.value;
    }
    validateBook();
  } else if (id === 'bkDate' || id === 'bkTime') {
    validateBook();
  } else if (id === 'qaLine') {
    applyQuickParse();
  } else if (id === 'qaGuest' || id === 'qaFee' || id === 'qaSepDur' || id === 'qaLocation') {
    if (qaCtx) {
      if (id === 'qaGuest') qaCtx.guest = t.value;
      else if (id === 'qaFee') {
        qaCtx.fee = t.value;
        var qh = document.getElementById('qaFeeHint');
        if (qh) qh.innerHTML = feeHintHTML(t.value);
      } else if (id === 'qaSepDur') {
        var qv = parseInt(String(t.value).replace(/[^0-9]/g, ''), 10);
        qaCtx.sepDur = qv > 0 ? qv : 120;     /* 직접 입력하면 프리셋 강조를 풀고, 지우면 기본 120분 */
        syncSepDurChips('qa', qaCtx.sepDur);
      } else if (id === 'qaLocation') qaCtx.location = t.value;
    }
    validateQuick();
  } else if (id === 'qaDate' || id === 'qaTime' || id === 'qaMember') {
    validateQuick();
  }
}

/* =========================================================
   실행 스플래시 (약 3.5초 · 탭하면 바로 넘어감)
   ========================================================= */
var SPLASH_MS = 3500;      /* 스플래시가 머무는 시간 (3.5초) */
var SPLASH_FADE = 440;     /* 사라지는 전환(420ms) + 여유 */
function endSplash(){
  var el = document.getElementById('splash');
  if (!el || el.getAttribute('data-done')) return;
  el.setAttribute('data-done', '1');
  el.classList.add('out');
  el.setAttribute('aria-hidden', 'true');
  setTimeout(function(){ el.hidden = true; }, SPLASH_FADE);
}
function startSplash(){
  var el = document.getElementById('splash');
  if (!el) return;
  var skip = function(){ endSplash(); };
  el.addEventListener('pointerdown', skip);
  el.addEventListener('click', skip);
  el.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') skip(); });
  setTimeout(endSplash, SPLASH_MS);
}

/* =========================================================
   시작
   ========================================================= */
function init(){
  /* 저장본이 하나도 없을 때만 '체험판 시작' 온보딩 — 기존 사용자의 데이터는 그대로 이어집니다 */
  var firstRun = !hasSavedState();
  if (firstRun) {
    obWaiting = true;               /* 이름을 받기 전에는 아무것도 저장하지 않음 */
    state = blankState('', '');
  } else {
    load();
  }
  if (!state.notes) state.notes = [];
  /* 예전에 저장한 레슨 기록은 본문에서 태그를 한 번 계산해 둡니다 */
  var tagged = 0;
  state.notes.forEach(function(n){
    if (!isArr(n.tags)) { n.tags = detectGolfTags(n.text || ''); tagged++; }
  });
  if (!isArr(state.renewalLog)) state.renewalLog = [];
  state.members.forEach(function(mm){ if (!isArr(mm.passHistory)) mm.passHistory = []; });
  if (tagged) save();
  if (!state.pro) state.pro = { name: '이시훈', title: 'KPGA 투어 프로', academy: '' };
  if (!state.templates) state.templates = [];
  /* 레슨 시간 범위 — 없던 저장본은 기본 06:00~23:00 로 맞춥니다 */
  if (!state.hours) state.hours = { fromMin: DEF_FROM, toMin: DEF_TO };
  var drange = dayRange();
  state.hours = { fromMin: drange.from, toMin: drange.to };
  if (state.theme !== 'black' && state.theme !== 'green') state.theme = 'green';
  applyTheme(state.theme);   /* 첫 페인트 전에 <head>가 이미 맞춰 두었고, 여기서 저장본과 동기화 */
  ui.date = todayISO();
  ui.month = todayISO().slice(0, 7);
  render();
  if (firstRun) {
    /* 스플래시 아래에 미리 깔아 두고, 3.5초 스플래시가 걷히면 자연스럽게 이어집니다 */
    showOnboarding();
    setTimeout(focusOnboarding, SPLASH_MS + SPLASH_FADE + 120);
  }
}

document.addEventListener('click', onClick);
document.addEventListener('input', onFieldChange);
document.addEventListener('change', onFieldChange);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeTopSheet();
  /* 온보딩에서 이름을 적고 Enter 를 누르면 바로 시작 */
  if (e.key === 'Enter') {
    var ob = document.getElementById('onboard');
    if (ob && !ob.hidden && (e.target.id === 'ozPro' || e.target.id === 'ozAcademy')) finishOnboarding(false);
  }
});
/* 앱을 떠날 때는 마이크를 확실히 반납합니다 */
window.addEventListener('pagehide', function(){ if (voice.want || voice.inst) vrStop(); });

/* 앱을 켜면 스플래시가 먼저 뜨고, 화면은 그 뒤에 준비됩니다 */
startSplash();
init();

})();

</script>
