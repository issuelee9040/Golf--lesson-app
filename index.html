<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- 홈 화면에 추가(standalone)했을 때 상태 바 글자색: 그린 화이트는 어두운 글자(default),
     시크 블랙은 밝은 글자(black). 아래 부트스트랩이 첫 페인트 전에 저장된 테마에 맞춰 바꿉니다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ProPlan">
<meta name="application-name" content="ProPlan">
<meta name="description" content="ProPlan — 프로의 레슨 · 회원 · 일정 관리">
<title>ProPlan</title>
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="assets/proplan-lockup-green.png">
<script>
/* 화면 테마 — 첫 페인트 전에 적용해 '시크 블랙'에서 흰 화면이 번쩍이지 않게 합니다 */
(function(){
  var t = 'green';
  try {
    var raw = localStorage.getItem('golfLessonApp.v2'), s = null;
    if (raw) s = JSON.parse(raw);
    if (s && (s.theme === 'black' || s.theme === 'green')) t = s.theme;
    else {
      var m = localStorage.getItem('golfLessonApp.theme');
      if (m === 'black' || m === 'green') t = m;
    }
  } catch(e){}
  document.documentElement.setAttribute('data-theme', t);
  var mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', t === 'black' ? '#131316' : '#F2F2F7');
  var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (sb) sb.setAttribute('content', t === 'black' ? 'black' : 'default');
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box}
/* 아이폰 사파리 '당겨서 새로고침' 방지 — 화면을 아래로 당겨도 앱이 다시 열리지 않습니다.
   (시트 안에서 끌어내릴 때는 아래 attachSheetGestures 가 touchmove 를 함께 막습니다) */
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;overscroll-behavior-y:none}
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#0B0F14; --ink2:#3C434D; --muted:#8A9099;
  --line:#E3E6EB; --line2:#EFF1F4;
  --green:#0F7B4A; --green-d:#0A5C37; --green-soft:#E6F4EC; --green-mid:#CFE9DA;
  --amber:#A05F00; --amber-soft:#FFF3DF; --amber-line:#F1D9A8;
  --red:#B3352A; --red-soft:#FDECEA; --red-line:#F3C7C1;
  --blue:#2F6FED; --blue-soft:#EAF1FF;
  --gray-soft:#F1F2F5;
  /* 화면 테마에서 함께 바뀌는 바탕·글자 토큰 */
  --page:#DFE3E9; --field:#FFFFFF; --surf2:#F7F9FA; --surf3:#FAFBFC;
  --tabbar:rgba(255,255,255,.96);
  --amber-ink:#7A4800; --amber-deep:#8A5200; --red-ink:#96271D;
  --blue-ink:#2359C4; --gray-ink:#7A8088;
  --sopt-ink:#5C636D; --subink:#7A8AA5; --faint:#B4B9C1; --tl-line:#ECEEF2;
  --green-solid:#0F7B4A;
  --radius:18px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
body{
  background:var(--page); color:var(--ink); font-size:15px; line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
/* 아이폰 사파리는 입력칸 글자가 16px 미만이면 칸을 탭할 때 화면을 자동 확대합니다.
   그래서 모든 입력칸은 16px 로 고정합니다 (10장 디자인 가이드). */
input,select,textarea{font:inherit;color:inherit;border-radius:0;font-size:16px}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
#app{
  position:relative;display:flex;flex-direction:column;width:100%;max-width:430px;
  margin:0 auto;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;overscroll-behavior:none;
  box-shadow:0 0 0 1px rgba(16,24,40,.06),0 24px 70px rgba(16,24,40,.14);
}
/* ---------- 상단 브랜드 바 — 깃발 + ProPlan 워드마크가 왼쪽 ----------
   사진(PNG)을 21px 로 줄이면 아이폰 고해상도 화면에서 흐리게 번져 보여서,
   같은 로고를 글자 모양 그대로 딴 벡터 경로(인라인 SVG)로 그립니다.
   바탕은 아래 .hd 그라데이션과 같은 --bg 로 이어 붙여 경계선·흐림이 없습니다. */
.brandbar{flex:none;position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 16px 8px;background:var(--bg);border-bottom:0;
  /* 홈 화면에 추가한 앱은 viewport-fit=cover 라 화면이 상태 바 밑까지 올라갑니다.
     그대로 두면 시계·배터리 뒤로 로고가 비쳐 흐릿하게 겹치므로, 상태 바 높이만큼 바탕색을 더 채웁니다.
     사파리 브라우저 안에서는 env() 값이 0 이라 지금과 똑같이 보입니다. */
  padding-top:calc(9px + env(safe-area-inset-top, 0px))}
.brandbar .bb-lockup{display:flex;align-items:center;height:21px;line-height:0}
.brandbar .bb-svg{display:block;height:21px;width:107px;overflow:visible}
.brandbar .bb-flag{fill:#0F7B4A}
.brandbar .bb-word{fill:#0B0F14}
html[data-theme="black"] .brandbar{background:var(--bg)}
html[data-theme="black"] .brandbar .bb-flag{fill:#34D399}
html[data-theme="black"] .brandbar .bb-word{fill:#F4F6F8}
/* ---------- header ---------- */
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px 8px;background:linear-gradient(180deg,var(--bg) 72%,rgba(242,242,247,0))}
.hd h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.hd .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.hd-left{display:flex;align-items:center;gap:10px;min-width:0}
.hd-left>div{min-width:0}
.iconbtn{width:34px;height:34px;flex:none;border-radius:11px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);box-shadow:var(--shadow)}
.iconbtn svg{width:18px;height:18px}
/* ---------- main ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{width:0}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid rgba(16,24,40,.035)}
.card+.card{margin-top:10px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
.sec .aside{font-size:12px;color:var(--muted);font-weight:700}
.sec .link{font-size:12.5px;color:var(--green);font-weight:800}
.link{font-size:12.5px;color:var(--green);font-weight:800}
.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}
.muted{color:var(--muted)}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;color:#fff;
  background:linear-gradient(152deg,#128A53 0%,#0C6B41 52%,#08492C 100%);
  box-shadow:0 12px 26px rgba(8,73,44,.24)}
.hero:after{content:"";position:absolute;right:-56px;top:-70px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
.hero:before{content:"";position:absolute;right:-10px;bottom:-70px;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.05)}
.hero .k{position:relative;font-size:12px;font-weight:700;opacity:.82;letter-spacing:.2px}
.hero .big{position:relative;font-size:31px;font-weight:800;letter-spacing:-1.1px;line-height:1.15;margin-top:5px}
.hero .row{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pillstat{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.17);border-radius:999px;
  padding:4px 9px;font-size:11.5px;font-weight:700}
.herobtn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  margin-top:15px;padding:13px 15px;border-radius:15px;background:var(--field);color:var(--green-d);
  font-size:14.5px;font-weight:800;letter-spacing:-.2px;box-shadow:0 6px 14px rgba(0,0,0,.14)}
.herobtn .hb-sub{display:block;font-size:11px;font-weight:700;color:#6B7A72;letter-spacing:0;margin-top:1px}
.herobtn .hb-go{flex:none;width:26px;height:26px;border-radius:50%;background:var(--green-soft);
  display:flex;align-items:center;justify-content:center;color:var(--green)}
.herobtn .hb-go svg{width:15px;height:15px}
/* ---------- alerts ---------- */
.alert{display:flex;gap:10px;background:var(--amber-soft);border:1px solid var(--amber-line);
  border-radius:15px;padding:12px 13px;margin-top:12px;color:#6B4400}
.alert.blue{background:var(--blue-soft);border-color:#CFE0FF;color:#1F4EA8}
.alert .ai{flex:none;margin-top:1px}
.alert .at{font-size:13px;font-weight:800}
.alert .ad{font-size:11.5px;font-weight:600;opacity:.86;margin-top:2px}
/* ---------- lesson card ---------- */
.lesson-card{padding:9px 13px}
.lesson-card+.lesson-card{margin-top:7px}
.lesson{display:flex;gap:10px}
.timecol{flex:none;width:48px}
.timecol .t{font-size:15px;font-weight:800;letter-spacing:-.4px}
.timecol .d{font-size:10.5px;font-weight:800;color:var(--muted);margin-top:1px}
.lesson .body{flex:1;min-width:0}
.nameline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.name{font-size:15px;font-weight:800;letter-spacing:-.25px}
.meta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta b{color:var(--ink2);font-weight:800}
.bar{height:4px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#17A466,#0F7B4A)}
.bar>i.low{background:linear-gradient(90deg,#E8A33C,#D07C12)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* 오늘 카드 레슨 액션 4개(완료 · 취소·노쇼 · 수업 메모 · 레슨 차트)는 390px 아이폰에서도 한 줄에 들어가게 */
.acts{gap:5px;flex-wrap:nowrap;margin-top:7px}
.acts .btn{flex:1 1 0;min-width:0;height:34px;padding:0 4px;font-size:12px;border-radius:10px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden}
.lesson .nameline .tedit{margin-left:auto;flex:none;height:29px;padding:0 10px;font-size:12px;background:var(--field);border:1px solid var(--line);color:var(--ink2)}
/* ---------- status pill ---------- */
.st{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:8px;font-size:11.5px;font-weight:800;white-space:nowrap}
.st-completed{background:var(--green-soft);color:var(--green-d)}
.st-same_day_cancel{background:var(--amber-soft);color:var(--amber)}
.st-no_show{background:var(--red-soft);color:var(--red)}
.st-excused_cancel{background:var(--gray-soft);color:#6B7280}
.st-makeup{background:var(--blue-soft);color:var(--blue)}
.st-scheduled{background:var(--card);color:var(--green);border:1px solid var(--green-mid)}
/* ---------- 필드 · 숏게임 (별도 결제) ---------- */
.lkind{flex:none;display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:7px;
  font-size:11px;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
.lkind.lk-field{background:#DCF1F4;color:#06555C;box-shadow:inset 0 0 0 1px #A6D8DE}
.lkind.lk-shortgame{background:#EDE5FE;color:#4C2694;box-shadow:inset 0 0 0 1px #CCB9F5}
.lkind.lk-onepoint{background:#FCEFD6;color:#7A4700;box-shadow:inset 0 0 0 1px #EBD3A4}
/* 별도 결제 종류 3칸 — 390px 아이폰에서 글자가 줄바꿈되지 않게 한 줄에 균등 배분 */
.seg.kind3 button{font-size:12.5px;letter-spacing:-.4px;white-space:nowrap}
.guestpill{flex:none;display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;
  background:var(--gray-soft);color:#6B7280;font-size:10px;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
.paytag{flex:none;display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:6px;
  background:var(--amber-soft);color:var(--amber);font-size:10.5px;font-weight:800;white-space:nowrap}
.modeseg{margin-bottom:13px}
.modeseg button{font-size:12px;letter-spacing:-.4px}
.sopts.n4{grid-template-columns:repeat(4,1fr)}
.sguide-badge.sep{background:#E4F3F5;color:#0C6068;box-shadow:inset 0 0 0 1px #BFE0E4}
.dur{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.dur.d55{background:var(--green-soft);color:var(--green-d)}
.tagwarn{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--red-soft);color:var(--red)}
.tagnone{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--gray-soft);color:#6B7280}
/* 별도 결제로만 다닌 회원 — 수강권은 없지만 이용 횟수는 남는다 */
.tagsep{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;
  background:var(--green-soft);color:var(--green-d)}
html[data-theme="black"] .tagsep{background:rgba(70,214,156,.16);color:#9BF0C9}
.mrow .rem.none{font-size:15px;color:#B4B9C1;letter-spacing:0}
html[data-theme="black"] .mrow .rem.none{color:#5C6169}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:44px;padding:0 16px;
  border-radius:14px;font-size:14.5px;font-weight:800;letter-spacing:-.2px;border:1px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--green-solid);color:#fff;box-shadow:0 4px 12px rgba(15,123,74,.26)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:var(--gray-soft);color:var(--ink2)}
.btn-outline{background:var(--field);border-color:var(--line);color:var(--ink2)}
.btn-danger{background:var(--field);border-color:var(--red-line);color:var(--red)}
.btn-sm{height:38px;padding:0 12px;font-size:12.5px;border-radius:11px}
.btn-block{display:flex;width:100%}
.btn:disabled{opacity:.42;box-shadow:none}
/* ---------- segmented / chips ---------- */
.seg{display:flex;background:#E4E8EE;border:1px solid rgba(16,24,40,.045);border-radius:12px;padding:3px;gap:3px}
html[data-theme="black"] .seg{background:#202026;border-color:rgba(255,255,255,.05)}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:800;color:var(--ink2);text-align:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.16)}
html[data-theme="black"] .seg button.on{background:#2E2E36;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.seg.mini{max-width:210px}
/* 남/여 — 반투명 회색 띠가 아니라 '고르는 상자' 두 칸으로 보이게 */
.seg.boxed{background:transparent;border:0;padding:0;gap:8px;max-width:210px}
.seg.boxed button{height:45px;border-radius:12px;background:var(--field);border:1px solid #D3D8DF;
  color:var(--ink2);box-shadow:var(--shadow)}
.seg.boxed button.on{background:var(--green);border-color:var(--green-d);color:#fff;
  box-shadow:0 6px 14px -7px rgba(15,123,74,.6)}
html[data-theme="black"] .seg.boxed button{background:#202026;border-color:rgba(255,255,255,.16);color:#C9CDD4}
html[data-theme="black"] .seg.boxed button.on{background:var(--green-solid);border-color:#34D399;color:#fff;
  box-shadow:0 6px 16px -8px rgba(52,211,153,.65)}
.statsseg button.on,.rvunit button.on{color:var(--green-d)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;background:var(--gray-soft);font-size:12.5px;font-weight:800;color:var(--ink2);border:1px solid transparent}
.chip.on{background:var(--green-soft);color:var(--green-d);border-color:var(--green-mid)}
/* 소요시간 직접 입력 — 프리셋 칩과 같은 모양의 빈 입력칸(반투명 '직접 입력' 안내) */
.chips.durchips{gap:5px}
.chips.durchips .chip{padding:7px 11px}
/* 횟수 프리셋 — 30회를 빼고 다섯 개가 390px에서도 한 줄에 꽉 차게 */
.chips.countrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chips.countrow .chip{padding:8px 0;text-align:center;border-radius:11px;font-size:12.5px;border-color:var(--line)}
input.chipinp{flex:none;width:104px;height:33px;border-radius:999px;padding:0 10px;text-align:center;
  font-size:16px;font-weight:800;letter-spacing:-.3px}
input.chipinp::placeholder{font-size:12.5px;font-weight:800;color:var(--muted);opacity:.8;letter-spacing:-.2px}
.sortbtn{flex:none;display:inline-flex;align-items:center;gap:2px;height:27px;padding:0 7px 0 10px;border-radius:9px;
  background:var(--field);border:1px solid var(--line);box-shadow:var(--shadow);white-space:nowrap;
  font-size:11.5px;font-weight:800;color:var(--ink2);letter-spacing:-.3px}
.sortbtn svg{width:13px;height:13px;flex:none;color:#A8ADB5;margin-top:1px}
.sortbtn:active{background:var(--gray-soft)}
.sec h2 .sec-cnt{font-size:12px;font-weight:700;color:var(--muted);margin-left:1px;letter-spacing:-.1px}
/* 회원목록 도구줄 — 페이지 제목 '회원목록' 아래에 같은 말을 또 쓰지 않고 인원수 + 정렬만 */
.listbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 8px}
.listbar .lb-cnt{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:-.1px}
.listbar .lb-cnt b{font-size:13px;font-weight:800;color:var(--ink2)}
/* 입력칸 위 작은 이름표 — 숫자를 넣어 placeholder 가 사라져도 무엇인지 보이게 */
.field.minifield{margin-bottom:0}
.field.minifield>label{font-size:10.5px;font-weight:800;color:var(--muted);margin:0 0 4px 3px}
.field.minifield .input{height:43px}
/* ---------- calendar ---------- */
.monhdr{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
.monhdr .m{font-size:17px;font-weight:800;letter-spacing:-.4px}
.monhdr .navs{display:flex;align-items:center;gap:6px}
.cal{background:var(--card);border-radius:18px;padding:8px 6px 10px;border:1px solid var(--line2);box-shadow:var(--shadow)}
.cal .wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.cal .wk div{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day{position:relative;height:46px;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink2)}
.day.out{color:#C7CBD2}
.day.sun{color:#C4553F}
.day.sat{color:#3C6FBF}
.day.today{box-shadow:inset 0 0 0 1.5px var(--green);color:var(--green-d);font-weight:800}
.day.sel{background:var(--green-solid);color:#fff;box-shadow:0 5px 12px rgba(15,123,74,.3)}
.day.sel.sun,.day.sel.sat{color:#fff}
.dots{display:flex;gap:2px;height:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:#0F7B4A}
.dots i.a{background:#E0A33E}.dots i.r{background:#D9614F}.dots i.g{background:#C7CBD2}
.day.sel .dots i{background:rgba(255,255,255,.9)}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:18px 2px 8px}
.dayhead .dh{font-size:16px;font-weight:800;letter-spacing:-.3px}
.dayhead .ds{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.tl{position:relative;margin:6px 0 0;padding-left:42px}
.tlh{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--tl-line)}
.tlh span{position:absolute;left:0;top:-8px;font-size:10px;font-weight:800;color:var(--faint);background:var(--bg);padding-right:6px}
.tlbody{position:absolute;left:42px;right:0;top:0;bottom:0}
.ev{position:absolute;overflow:hidden;border-radius:10px;padding:4px 7px;border-left:3px solid #0F7B4A;
  display:block;text-align:left;font-weight:700;line-height:1.25}
.ev-scheduled{background:var(--card);border-color:var(--green);color:var(--ink);box-shadow:0 1px 4px rgba(16,24,40,.1)}
.ev-completed{background:var(--green-soft);border-color:#0F7B4A;color:var(--green-d)}
.ev-same_day_cancel{background:var(--amber-soft);border-color:#E0A33E;color:var(--amber-ink)}
.ev-no_show{background:var(--red-soft);border-color:#D9614F;color:var(--red-ink)}
.ev-excused_cancel{background:var(--gray-soft);border-color:#C7CBD2;color:var(--gray-ink)}
.ev-makeup{background:var(--blue-soft);border-color:#2F6FED;color:var(--blue-ink)}
.ev-t{display:block;font-size:9.5px;font-weight:800;opacity:.85;white-space:nowrap}
.ev-n{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-m{display:block;font-size:10px;font-weight:700;opacity:.8;white-space:nowrap}
/* 낮은 블록(25분 등)은 두 줄이 잘리므로 한 줄로 가운데 정렬해 표시 */
.ev-compact{padding:0 9px;display:flex;align-items:center}
.ev-line{display:flex;align-items:center;width:100%;min-width:0;white-space:nowrap;line-height:1.1}
.ev-line .ev-lt{flex:none;font-size:10px;font-weight:800;opacity:.75;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.ev-line .ev-ln{flex:0 1 auto;min-width:0;font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.ev-line .ev-ld{flex:none;font-size:10px;font-weight:800;opacity:.7}
/* 잔여 횟수는 폭이 좁아도 끝까지 남기고, 이름이 먼저 줄임표로 줄어듭니다 */
.ev-line .ev-lr{flex:none;font-size:10px;font-weight:800;opacity:.7;letter-spacing:-.2px}
.ev-line .ev-ln::before,.ev-line .ev-ld::before,.ev-line .ev-lr::before{content:"·";margin:0 5px;opacity:.5;font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;color:var(--muted)}
.empty .et{font-size:14px;font-weight:800;color:var(--ink2)}
.empty .ed{font-size:12px;font-weight:600;margin-top:4px}
/* ---------- members ---------- */
.search{position:relative;margin:2px 0 10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#A9AEB6}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--field);
  padding:0 12px 0 34px;font-size:16px;font-weight:600}
.search input::placeholder{color:var(--faint);font-weight:600}
.mrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:9px 12px;
  box-shadow:var(--shadow);border:1px solid rgba(16,24,40,.035);width:100%}
.mrow+.mrow{margin-top:6px}
.av{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;background:var(--green-soft);color:var(--green-d)}
.av.b{background:var(--blue-soft);color:var(--blue-ink)}
.av.a{background:var(--amber-soft);color:var(--amber-deep)}
.av.r{background:var(--red-soft);color:var(--red-ink)}
.mrow .mi{flex:1;min-width:0}
.mrow .mn{font-size:14.5px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mrow .mm{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mr{flex:none;text-align:right}
.mrow .rem{font-size:16px;font-weight:800;letter-spacing:-.5px}
.mrow .rem small{font-size:11px;font-weight:700;color:var(--muted);margin-left:1px}
.mrow .rem.low{color:var(--red)}
.chev{flex:none;color:#C3C8CF}
.chev svg{width:16px;height:16px;display:block}
/* 수강권 칸: 시트 배경(#F2F2F7)과 구분되도록 반투명 흰색 + 그린 틴트 + 얇은 테두리·그림자 */
.pcard{position:relative;border:1px solid rgba(15,123,74,.18);border-radius:16px;padding:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.80) 45%,rgba(230,244,236,.62) 100%);
  -webkit-backdrop-filter:blur(10px) saturate(1.06);backdrop-filter:blur(10px) saturate(1.06);
  box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 22px -14px rgba(15,123,74,.38)}
.pcard+.pcard{margin-top:10px}
.pcard .bar{background:rgba(16,24,40,.08)}
/* 별도 레슨 기록 줄 (회원 정보창) */
.sepline{display:flex;align-items:center;gap:8px;width:100%;padding:10px 2px;border-bottom:1px solid var(--line2);text-align:left}
.sepline:last-child{border-bottom:0}
.sp-d{flex:none;width:64px;font-size:10.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.sp-k{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.sp-sub{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:-.1px}
.sp-f{flex:none;font-size:11.5px;font-weight:800;color:var(--amber)}
.pcard.dead{background:linear-gradient(180deg,rgba(250,250,251,.94),rgba(241,242,245,.78));
  border-color:rgba(16,24,40,.10);box-shadow:0 1px 2px rgba(16,24,40,.04);opacity:.82}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnum{font-size:20px;font-weight:800;letter-spacing:-.6px}
.pnum small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:#6C7480;font-weight:600;margin-top:6px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;padding:7px 0;border-bottom:1px solid var(--line2)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-weight:700;font-size:12px}
.kv .v{font-weight:800}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.hist:last-child{border-bottom:0}
.hist .hd-t{width:52px;flex:none}
.hist .hd-t b{font-size:12.5px;font-weight:800;display:block}
.hist .hd-t span{font-size:10.5px;color:var(--muted);font-weight:700}
.hist .hd-b{flex:1;min-width:0}
.hist .hd-b .hm{font-size:11.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{background:var(--card);border-radius:16px;padding:13px 14px;border:1px solid rgba(16,24,40,.035);box-shadow:var(--shadow)}
.kpi .n{font-size:22px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
.kpi .n small{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}
.kpi.green .n{color:var(--green-d)}
.kpi.amber .n{color:var(--amber)}
.kpi.red .n{color:var(--red)}
.kpi.blue .n{color:var(--blue)}
.wchart{display:flex;align-items:flex-end;gap:8px;height:112px;margin-top:12px}
.wcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.wbar{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#19A76A,#0F7B4A);min-height:4px}
.wbar.zero{background:var(--line2)}
.wval{font-size:11px;font-weight:800;color:var(--ink2)}
.wlab{font-size:10.5px;font-weight:700;color:var(--muted)}
.tpl{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.tpl:last-child{border-bottom:0}
.tpl .ti{flex:1;min-width:0}
.tpl .tn{font-size:13.5px;font-weight:800}
.tpl .ts{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
/* ---------- 수입 정산 ---------- */
.statsseg{margin:2px 0 14px}
.rvhero .big{font-size:29px;letter-spacing:-1px}
.rvhero .big small{font-size:15px;font-weight:800;opacity:.8;margin-left:2px;letter-spacing:0}
.rvunit{margin:0 0 2px}
.rvchart{margin-top:14px}
.rvchart .wcol{padding:0;background:none;display:flex}
.rvchart .wval,.rvchart .wlab,.rvchart .wbar{display:block}
.rvchart .wval.on,.rvchart .wlab.on{color:var(--green-d)}
.rvlist{background:var(--card);border-radius:18px;border:1px solid rgba(16,24,40,.035);box-shadow:var(--shadow);padding:0 15px}
.rvitem{border-bottom:1px solid var(--line2)}
.rvitem:last-child{border-bottom:0}
.rvrow{display:flex;align-items:center;gap:9px;width:100%;padding:12px 0}
.rvrow .rvmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rvtitle{font-size:13.5px;font-weight:800;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvmeta{font-size:11.5px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.rvamt{font-size:14px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.rvcnt{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.rvchev{flex:none;display:flex;color:#C2C7CF}
.rvchev svg{width:15px;height:15px;transition:transform .18s}
.rvrow[data-open="1"] .rvchev svg{transform:rotate(90deg)}
.rvdetail{padding:0 0 12px}
.rvline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:700;padding:5px 0 5px 9px;border-left:2px solid var(--green-mid);margin:0 0 4px 2px}
.rvline .n{font-size:12px;font-weight:800;min-width:0}
.rvline .n .t{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:1px}
.rvline .a{flex:none;color:var(--ink2);white-space:nowrap}
.rvline.miss{border-left-color:var(--amber-line)}
.rvline .a.miss{color:var(--amber)}
.rvmem{display:block;width:100%;padding:11px 0;border-bottom:1px solid var(--line2);text-align:left}
.rvmem:last-child{border-bottom:0}
.rvmemhead{display:flex;align-items:center;gap:8px}
.rvmemhead .n{flex:1;min-width:0;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvmemhead .c{flex:none;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.rvmemhead .a{flex:none;font-size:13px;font-weight:800;white-space:nowrap}
.rvshare{display:block;height:4px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:7px}
.rvshare>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#7BC9A3,#3EA97A)}
.rvmiss{background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:15px;padding:12px 13px;margin-top:12px;color:#6B4400}
.rvmiss .t{font-size:12.5px;font-weight:800}
.rvmiss .d{font-size:11.5px;font-weight:600;margin-top:2px;opacity:.85;line-height:1.45}
.rvmiss .mrow{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--amber-line)}
.rvmiss .mrow .n{flex:1;min-width:0;font-size:12.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvmiss .mrow .c{flex:none;font-size:11px;font-weight:700;opacity:.8}
.rvmiss .btn{flex:none;height:28px;padding:0 10px;font-size:11.5px;border-radius:9px;background:var(--field);border:1px solid var(--amber-line);color:var(--amber)}
/* 수입 구성: 정규 수강권 vs 필드 · 숏게임 별도 — 위쪽 색 띠로 두 덩어리를 구분 */
.rvsplit{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:11px;border-radius:18px;overflow:hidden;
  background:var(--line);border:1px solid rgba(16,24,40,.06);box-shadow:var(--shadow)}
.rvsplit .si{position:relative;background:var(--card);padding:15px 14px 12px}
.rvsplit .si:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#19A76A,#0F7B4A)}
.rvsplit .si.sep{background:#F2FAFB}
.rvsplit .si.sep:before{background:linear-gradient(90deg,#22B3C0,#0C8E97)}
.rvsplit .k{display:block;font-size:11.5px;font-weight:800;color:var(--ink2);letter-spacing:-.2px;line-height:1.3;word-break:keep-all}
.rvsplit .v{display:block;font-size:18px;font-weight:800;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}
.rvsplit .si.sep .v{color:#0C6068}
.rvsplit .m{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px;letter-spacing:-.1px}
.rvline.sep{border-left-color:#BFE0E4}
/* ---------- 선택 필드 · 피커 ---------- */
.pickfield{display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.2}
.pickfield .pv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;font-weight:600}
.pickfield .pv .ph{color:#A3A9B1;font-weight:600}
.pickfield .pv .sub{color:var(--muted);font-size:11.5px;font-weight:700;margin-left:6px}
.pickfield .pchev{flex:none;display:flex;color:var(--muted)}
.pickfield .pchev svg{width:18px;height:18px}
.pklist{display:flex;flex-direction:column;gap:8px}
.pkopt{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;border-radius:14px;
  background:var(--field);border:1.5px solid var(--line2);text-align:left}
.pkopt .pt{flex:1;min-width:0}
.pkopt .pt b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkopt .pt span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkopt .pc{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:transparent}
.pkopt .pc svg{width:14px;height:14px}
.pkopt.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,123,74,.1)}
.pkopt.on .pc{background:var(--green);border-color:var(--green);color:#fff}
.pkopt .pt b .plus{color:var(--green-d)}
.pkempty{padding:22px 4px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.tslotwrap{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tslot{height:40px;border-radius:11px;background:var(--field);border:1px solid var(--line);font-size:13px;
  font-weight:800;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.tslot.on{background:var(--green-solid);border-color:var(--green-solid);color:#fff;box-shadow:0 4px 10px rgba(15,123,74,.24)}
.dpcal{margin-top:2px}
.dpcal .day{width:100%;height:42px;font-size:13px}
.dpcal .day.sel{color:#fff}
.dplabel{font-size:12px;font-weight:700;color:var(--muted);margin:2px 3px 8px}
/* ---------- tabbar ---------- */
.tabbar{flex:none;display:flex;background:var(--tabbar);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:6px 0 4px;border-radius:12px;color:#9AA0A8;font-size:10.5px;font-weight:800;letter-spacing:-.2px}
.tabbar button svg{width:23px;height:23px}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button.on{color:var(--green)}
/* ---------- sheet ---------- */
.sheetwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(9,13,18,.4);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  overscroll-behavior:none;overscroll-behavior-y:none;touch-action:pan-y pinch-zoom}
/* 닫히는 동안에는 뒤 화면을 눌러도 반응하지 않게 (두 번 닫힘·엉뚱한 탭 방지) */
.sheetwrap.closing{pointer-events:none}
.sheet{width:100%;max-width:430px;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  max-height:92vh;box-shadow:0 -10px 40px rgba(0,0,0,.24);animation:sheetup .24s cubic-bezier(.2,.9,.2,1);
  overscroll-behavior:contain;touch-action:pan-y pinch-zoom}
@keyframes sheetup{from{transform:translateY(34px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet .grab{flex:none;width:38px;height:5px;border-radius:3px;background:#D3D7DD;margin:8px auto 2px;touch-action:none}
.sheet .sh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px 6px}
.sheet .sh h3{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sheet .sub{padding:0 17px 8px;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.5}
/* 시간 범위 안내 — '시작 시간' 시트 부제 아래 한 줄 */
.sheet .sub .subnote{display:block;margin-top:4px;color:var(--ink2);font-weight:700}
.sheet .sub .subnote b{color:var(--green-d);font-weight:800}
.sheet .sb{flex:1;overflow-y:auto;padding:4px 16px 14px;overscroll-behavior:contain;overscroll-behavior-y:contain}
.sheet .sf{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.sf .sumline{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.sf .sumline b{font-weight:800}
.sf .hintline{font-size:11.5px;font-weight:700;color:var(--amber);margin-bottom:8px}
/* ---------- forms ---------- */
.field{margin-bottom:12px}
.field>label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin:0 0 5px 3px;letter-spacing:.1px}
.input{width:100%;height:45px;border-radius:13px;border:1px solid var(--line);background:var(--field);padding:0 12px;
  font-size:16px;font-weight:600;-webkit-appearance:none;appearance:none}
.input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(15,123,74,.12)}
textarea.input{height:auto;min-height:86px;padding:11px 12px;line-height:1.5;resize:vertical}
.row2{display:flex;gap:9px}
.row2>*{flex:1;min-width:0}
/* 날짜 칸이 유효기간 칸과 한 줄에 있을 때 날짜(2026.11.23 (월))가 줄임표로 잘리지 않게 조금 더 준다 */
.row2>.wide{flex:1.34}
.hint{font-size:11px;font-weight:600;color:var(--muted);margin:6px 3px 0;line-height:1.45}
.err{font-size:11.5px;font-weight:800;color:var(--red);margin:7px 3px 0;line-height:1.45}
.ok{font-size:11.5px;font-weight:700;color:var(--green-d);margin:7px 3px 0}
.formnote{background:var(--field);border:1px solid var(--line2);border-radius:13px;padding:11px 12px;font-size:11.5px;
  font-weight:600;color:var(--ink2);line-height:1.5;margin-bottom:12px}
/* ---------- settle sheet ---------- */
.srow{border:1px solid var(--line2);background:var(--field);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.srow.pend{border-color:var(--amber-line);background:#FFFDF8}
.srowh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sname{font-size:14px;font-weight:800;letter-spacing:-.2px}
.stime{font-size:11.5px;font-weight:700;color:var(--muted)}
.sproj{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted)}
.sproj b{color:var(--ink);font-weight:800}
.sproj.dim{color:#B4B9C1}
.sopts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:9px}
.sopt{height:38px;border-radius:9px;background:var(--gray-soft);font-size:10.5px;font-weight:800;color:var(--sopt-ink);

/* 고르기 전에도 '1회 차감' 성격이 보이도록 당일취소는 옅은 호박, 노쇼는 옅은 빨강 */
.sopt.sopt-same_day_cancel:not(.on){background:var(--amber-soft);color:var(--amber-ink);
  box-shadow:inset 0 0 0 1px var(--amber-line)}
.sopt.sopt-no_show:not(.on){background:var(--red-soft);color:var(--red-ink);
  box-shadow:inset 0 0 0 1px var(--red-line)}
.sopt.on{background:#111820;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.sopt.on.opt-ded{background:var(--green-d)}
/* 정산 줄 — 고른 상태 이름을 잔여 미리보기와 나란히 남겨, 색만으로 상태를 짐작하지 않게 */
.ssel{flex:none;display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:6px;
  font-size:10.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;
  background:var(--gray-soft);color:var(--sopt-ink)}
.ssel.ssel-completed{background:var(--green-soft);color:var(--green-d)}
.ssel.ssel-same_day_cancel{background:var(--amber-soft);color:var(--amber-ink)}
.ssel.ssel-no_show{background:var(--red-soft);color:var(--red-ink)}
.ssel.ssel-excused_cancel{background:var(--gray-soft);color:var(--gray-ink)}
.ssel.ssel-makeup{background:var(--blue-soft);color:var(--blue-ink)}
/* 레슨 상태 5가지 — 예전 한 줄씩(5줄) 쌓던 것을 절반 높이 2열 타일로.
   누르는 높이는 46px 그대로라 손가락으로 짚기 편함 */
.statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:2px 0 8px}
.stopt{position:relative;display:flex;align-items:center;gap:8px;height:46px;padding:0 13px;border-radius:13px;
  background:var(--field);border:1px solid var(--line);font-size:13.5px;font-weight:800;letter-spacing:-.2px;
  color:var(--ink);text-align:left}
.stopt:last-child:nth-child(odd){grid-column:1 / -1}   /* 5개면 마지막 칸은 가로로 꽉 */
.stopt:active{transform:translateY(1px)}
.stopt .so-dot{flex:none;width:8px;height:8px;border-radius:50%;background:#C6CBD3}
.stopt .so-t{flex:1;min-width:0}
.stopt .so-k{flex:none;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:-.2px}
.stopt.stopt-completed .so-dot{background:var(--green)}
.stopt.stopt-same_day_cancel .so-dot{background:var(--amber)}
.stopt.stopt-no_show .so-dot{background:var(--red)}
.stopt.stopt-excused_cancel .so-dot{background:#9AA0A8}
.stopt.stopt-makeup .so-dot{background:var(--blue)}
.stopt.on{border-color:var(--green);background:var(--green-soft);box-shadow:inset 0 0 0 1px var(--green-mid)}
.stopt.on .so-t,.stopt.on .so-k{color:var(--green-d)}
.stopt.on .so-dot{box-shadow:0 0 0 3px rgba(15,123,74,.14)}
.stophint{margin:0 2px 2px;word-break:keep-all}
/* ---------- 시트 하단 초록 CTA ---------- */
.cta-hero{position:relative;overflow:hidden;display:flex;width:100%;align-items:center;justify-content:center;
  height:50px;border-radius:15px;color:#fff;font-size:15px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;
  background:linear-gradient(152deg,#128A53 0%,#0C6B41 52%,#08492C 100%);

.cta-hero:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;

.cta-hero:active{transform:translateY(1px)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,12px);

  z-index:90;opacity:0;transition:opacity .18s,transform .18s;max-width:84vw;text-align:center;pointer-events:none;

.fab{position:absolute;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;

.drow{display:flex;align-items:center;gap:8px;width:100%;padding:11px 0;border-bottom:1px solid var(--line2);text-align:left}

/* 한 줄 자동 정리 상자 — 앱의 '자동 입력' 구역은 에메랄드 틴트로 통일 */
.quick{background:linear-gradient(180deg,#F3FAF6,#E9F5EE);border:1px solid var(--green-mid);border-radius:16px;padding:12px;margin-bottom:14px}

.calstat .dot{flex:none;width:6px;height:6px;border-radius:50%;background:#C3C8CF}
.calstat.on{color:var(--green-d)}
.calstat.on .dot{background:var(--green)}
.calopt{display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;border-radius:15px;
  background:var(--field);border:1px solid var(--line);margin-top:9px;box-shadow:var(--shadow)}
.calopt:active{background:#F7F8FA}
.calopt .co-ic{flex:none;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:17px;line-height:1;background:#EEF0F4}
.calopt .co-ic.gg{background:#EAF1FF}
.calopt .co-b{flex:1;min-width:0}
.calopt .co-t{display:block;font-size:14px;font-weight:800;letter-spacing:-.2px}
.calopt .co-d{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:2px;line-height:1.35}
.calopt .co-go{flex:none;color:#B7BDC6;display:flex}
.calopt .co-go svg{width:15px;height:15px}
.calnote{margin-top:12px;padding:10px 11px;border-radius:12px;background:var(--surf3);border:1px solid var(--line2);
  font-size:11px;font-weight:600;color:var(--muted);line-height:1.5}
.calnote b{font-weight:800;color:var(--ink2)}
/* ---------- 골프 태그 (클럽/영역 자동 분류) ---------- */
.tagbar{display:flex;gap:6px;overflow-x:auto;margin:0 1px 10px;padding:1px 1px 3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tagbar::-webkit-scrollbar{display:none}
.tagf{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;
  background:var(--field);border:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--ink2);
  white-space:nowrap;letter-spacing:-.2px;box-shadow:var(--shadow)}
.tagf.on{background:var(--green-solid);border-color:var(--green-solid);color:#fff;box-shadow:0 4px 10px -2px rgba(15,123,74,.34)}
.tagf .n{font-size:10px;font-weight:800;color:var(--muted)}
.tagf.on .n{color:#fff;opacity:.9}
.gtag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:6px;
  font-size:10px;font-weight:800;letter-spacing:-.2px}
.gtag.t-driver{background:#E7EFFD;color:#2457A8}
.gtag.t-iron{background:#E6F4EC;color:#0A5C37}
.gtag.t-approach{background:#FFF3DF;color:#8A5200}
.gtag.t-putt{background:#F0EAFE;color:#5B34A8}
.gtag.t-field{background:#E4F3F5;color:#0C6068}
.tagchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tagchip{display:inline-flex;align-items:center;height:27px;padding:0 10px;border-radius:9px;background:var(--field);
  border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--ink2);letter-spacing:-.2px;box-shadow:var(--shadow)}
.tagchip.on{border:1px solid var(--green);background:var(--green-soft);color:var(--green-d);box-shadow:inset 0 0 0 1px var(--green-mid)}
.tagchip:active{transform:scale(.97)}
/* 오늘 차트 메모 — 입력칸 아래 날짜 표시와 자동 태그 미리보기 */
.tm-when{margin-left:auto;font-size:11px;font-weight:800;color:var(--green-d);letter-spacing:-.2px}
.tm-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:19px;margin-top:9px}
.tm-taghint{font-size:10.5px;font-weight:700;color:var(--muted)}
html[data-theme="black"] .tm-when{color:#9BF0C9}
/* ---------- 카톡 요약 복사 (1초 리포트) — 반투명 노랑 ---------- */
.btn.btn-kakao{background:rgba(250,204,21,.18);border:1px solid rgba(250,204,21,.45);color:#5C4300;font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px -10px rgba(190,150,0,.55);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.btn-kakao:active{background:rgba(250,204,21,.30)}
/* 레슨 상태 시트 하단 — 아이콘 · 두 줄 설명 · '복사' 표시 */
.kakao-cta{height:54px;gap:9px;padding:0 13px 0 11px;letter-spacing:0;border-radius:14px}
.kakao-cta .kko-ic{flex:none;width:28px;height:28px;border-radius:9px;background:rgba(250,204,21,.26);color:#6B4E00;
  border:1px solid rgba(250,204,21,.50);display:flex;align-items:center;justify-content:center}
.kakao-cta .kko-ic svg{width:15px;height:15px}
.kakao-cta .kko-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.kakao-cta .kko-t b{font-size:14px;font-weight:800;letter-spacing:-.2px;line-height:1.15}
.kakao-cta .kko-s{font-size:10.5px;font-weight:700;color:#7A5F16;letter-spacing:-.1px;line-height:1.2}
.kakao-cta .kko-go{flex:none;font-size:10.5px;font-weight:800;color:#5C4300;background:rgba(250,204,21,.30);
  border:1px solid rgba(250,204,21,.55);border-radius:7px;padding:4px 7px}
html[data-theme="black"] .btn.btn-kakao{background:rgba(250,204,21,.16);border-color:rgba(250,204,21,.42);color:#FDE68A;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 20px -14px rgba(250,204,21,.55)}
html[data-theme="black"] .btn.btn-kakao:active{background:rgba(250,204,21,.24)}
html[data-theme="black"] .kakao-cta .kko-ic{background:rgba(250,204,21,.20);border-color:rgba(250,204,21,.38);color:#FDE68A}
html[data-theme="black"] .kakao-cta .kko-s{color:rgba(253,230,138,.75)}
html[data-theme="black"] .kakao-cta .kko-go{color:#FDE68A;background:rgba(250,204,21,.18);border-color:rgba(250,204,21,.34)}
/* 레슨 차트 제목 옆 — 같은 노란색의 작은 버튼 */
.kakaochip{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px 0 9px;border-radius:10px;
  background:linear-gradient(180deg,#FFEF62,#FEE500);border:1px solid #E9D000;color:#3A2A00;
  font-size:11.5px;font-weight:800;letter-spacing:-.2px;box-shadow:0 2px 7px rgba(180,145,0,.22)}
.kakaochip svg{width:13px;height:13px}
.kakaochip:active{background:#F3DC00}
html[data-theme="black"] .kakaochip{box-shadow:0 2px 10px rgba(254,229,0,.18)}
/* ---------- 재등록 골든타임 (오늘 탭) ---------- */
.golden{margin-top:12px;padding:12px 13px 9px;border-radius:16px;
  background:linear-gradient(135deg,#FFF3D9,#FFFCF6 58%,#FFF6E4);border:1px solid var(--amber-line);
  box-shadow:0 12px 24px -18px rgba(160,95,0,.6)}
.golden-hd{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#8A5200;letter-spacing:-.1px}
.golden-hd .gh-ic{flex:none;width:20px;height:20px;border-radius:7px;background:#F7E3BC;color:#8A5200;
  display:flex;align-items:center;justify-content:center}
.golden-hd .gh-ic svg{width:12px;height:12px}
.golden-hd .gh-n{margin-left:auto;font-size:10.5px;font-weight:800;color:#A98343;white-space:nowrap}
.golden-sub{font-size:10.5px;font-weight:700;color:#A98343;margin:4px 1px 3px;line-height:1.35;letter-spacing:-.1px}
.golden-row{display:flex;align-items:center;gap:8px;width:100%;padding:8px 0;text-align:left}
.golden-row+.golden-row{border-top:1px solid rgba(241,217,168,.75)}
.golden-n{flex:1;min-width:0;font-size:13px;font-weight:800;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.golden-r{flex:none;font-size:11px;font-weight:800;color:#8A5200;white-space:nowrap;background:#F9E8C8;border-radius:6px;padding:2px 6px}
.golden-go{flex:none;display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 10px;border-radius:9px;
  background:#8A5200;color:#fff;font-size:11px;font-weight:800;box-shadow:0 3px 8px rgba(138,82,0,.26)}
.golden-go svg{width:11px;height:11px}
.golden-more{font-size:10.5px;font-weight:700;color:#A98343;padding:4px 0 1px}
/* ---------- 수강권 연장 (재등록) ---------- */
.renewbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:52px;margin-top:12px;
  padding:0 13px 0 16px;border-radius:15px;background:linear-gradient(160deg,#12975A,#0B6A42);color:#fff;
  box-shadow:0 12px 24px -12px rgba(8,73,44,.6),inset 0 1px 0 rgba(255,255,255,.16)}
.renewbtn:active{transform:scale(.99)}
.renewbtn .rb-t{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.renewbtn .rb-t b{font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.renewbtn .rb-sub{font-size:10.5px;font-weight:700;opacity:.86;letter-spacing:-.1px}
.renewbtn .rb-go{flex:none;display:flex;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);
  align-items:center;justify-content:center}
.renewbtn .rb-go svg{width:14px;height:14px}
.rpreset{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rpre{height:50px;border-radius:13px;background:var(--field);border:1px solid var(--line);font-size:13.5px;
  font-weight:800;letter-spacing:-.3px;text-align:center;color:var(--ink2);padding:0 2px}
.rpre.on{background:var(--green-soft);border-color:var(--green-mid);color:var(--green-d);box-shadow:inset 0 0 0 1px var(--green)}
.rsum{margin-top:12px;padding:11px 12px 10px;border-radius:14px;background:var(--surf2);border:1px solid var(--line2)}
.rline{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:-.2px}
.rline+.rline{margin-top:5px}
.rline .k{flex:none;min-width:56px;font-size:11px;font-weight:700;color:var(--muted)}
.rline b{font-weight:800;color:var(--ink)}
.rline .big{font-size:14.5px;font-weight:800;color:var(--green-d)}
.rline .arrow{color:#B7BDC6;font-weight:700}
/* ---------- 실행 스플래시 (앱을 키우면 약 2초) ---------- */
.splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;height:100vh;height:100dvh;overflow:hidden;color:#fff;text-align:center;
  background:linear-gradient(152deg,#128A53 0%,#0C6B41 52%,#08492C 100%);
  padding:calc(env(safe-area-inset-top) + 28px) 28px calc(env(safe-area-inset-bottom) + 28px);
  transition:opacity 420ms ease,transform 420ms ease,visibility 0s linear 420ms;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none}
.splash:before{content:"";position:absolute;left:50%;top:40%;width:min(80vw,370px);height:min(80vw,370px);
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.18),rgba(255,255,255,.055) 46%,rgba(255,255,255,0) 70%)}
.splash:after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;pointer-events:none;
  background:linear-gradient(180deg,rgba(2,32,19,0),rgba(2,32,19,.22))}
.splash.out{opacity:0;transform:scale(1.035);pointer-events:none;visibility:hidden}
.splash[hidden]{display:none}
/* ProPlan 브랜드 락업 — 깃발 엠블럼 + 워드마크 (테마마다 다른 파일) */
.sp-lockup{position:relative;display:block;width:min(60vw,232px);
  animation:spBadge 900ms cubic-bezier(.22,1,.36,1) both;
  filter:drop-shadow(0 14px 30px rgba(2,28,17,.30))}
.sp-lockup img{display:block;width:100%;height:auto}
.sp-lockup .lk-black{display:none}
html[data-theme="black"] .sp-lockup .lk-green{display:none}
html[data-theme="black"] .sp-lockup .lk-black{display:block}
.sp-sub{position:relative;margin-top:20px;font-size:12px;font-weight:700;letter-spacing:.45px;color:rgba(255,255,255,.76);
  animation:spUp 820ms 210ms cubic-bezier(.22,1,.36,1) both}
.sp-bar{position:relative;margin-top:36px;width:104px;height:3px;border-radius:999px;
  background:rgba(255,255,255,.22);overflow:hidden;
  animation:spUp 820ms 300ms cubic-bezier(.22,1,.36,1) both}
.sp-bar>i{display:block;width:100%;height:100%;border-radius:999px;transform-origin:left center;
  background:linear-gradient(90deg,rgba(255,255,255,.5),#fff);
  animation:spFill 3500ms cubic-bezier(.38,0,.3,1) both}   /* SPLASH_MS 와 같은 값 */
@keyframes spBadge{from{opacity:0;transform:scale(.86) translateY(8px)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* ---------- 체험판 시작 온보딩 — 처음 여는 프로가 자기 이름으로 바로 시작 ---------- */
.onboard{position:fixed;inset:0;z-index:9500;display:flex;flex-direction:column;align-items:center;
  width:100%;height:100vh;height:100dvh;overflow-y:auto;color:#fff;text-align:center;
  background:linear-gradient(152deg,#128A53 0%,#0C6B41 52%,#08492C 100%);
  padding:calc(env(safe-area-inset-top) + 34px) 22px calc(env(safe-area-inset-bottom) + 24px);
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  animation:obIn 420ms ease both}
.onboard[hidden]{display:none}
@keyframes obIn{from{opacity:0}to{opacity:1}}
.ob-wrap{width:100%;max-width:362px;margin:auto;display:flex;flex-direction:column;align-items:center}
.ob-lockup{display:block;width:min(52vw,200px);margin:0 auto 22px;
  filter:drop-shadow(0 14px 30px rgba(2,28,17,.32))}
.ob-lockup img{display:block;width:100%;height:auto}
.ob-lockup .lk-black{display:none}
html[data-theme="black"] .ob-lockup .lk-green{display:none}
html[data-theme="black"] .ob-lockup .lk-black{display:block}
.ob-wrap h2{font-size:23px;font-weight:800;letter-spacing:-.8px;line-height:1.3}
.ob-lead{margin-top:7px;font-size:13.5px;font-weight:600;letter-spacing:-.2px;color:rgba(255,255,255,.82)}
.ob-form{width:100%;margin-top:24px;padding:16px 14px 15px;border-radius:20px;text-align:left;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.20);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 18px 40px rgba(2,28,17,.24),inset 0 1px 0 rgba(255,255,255,.16)}
.ob-field+.ob-field{margin-top:12px}
.ob-field label{display:flex;align-items:center;gap:5px;margin:0 2px 6px;
  font-size:11.5px;font-weight:800;letter-spacing:-.1px;color:rgba(255,255,255,.88)}
.ob-field label em{font-style:normal;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.60)}
.ob-field .input{height:48px;background:rgba(255,255,255,.97);border-color:rgba(255,255,255,.30);color:#0B0F14}
.ob-field .input::placeholder{color:#9AA1AA;font-weight:600}
.ob-field .input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.26)}
.ob-err{display:none;margin:8px 2px 0;font-size:11.5px;font-weight:800;color:#FFE2DC}
.ob-err.on{display:block}
.ob-start{display:flex;align-items:center;justify-content:center;width:100%;height:50px;margin-top:15px;
  border-radius:15px;background:#fff;color:#0A5C37;font-size:15px;font-weight:800;letter-spacing:-.3px;
  text-align:center;box-shadow:0 8px 20px rgba(2,28,17,.24)}
.ob-start:active{transform:translateY(1px)}
.ob-demo{display:block;width:100%;margin-top:13px;padding:4px 0;text-align:center;
  font-size:12.5px;font-weight:800;color:rgba(255,255,255,.88)}
.ob-demo span{border-bottom:1px solid rgba(255,255,255,.38);padding-bottom:2px}
.ob-foot{margin-top:18px;font-size:11px;font-weight:700;letter-spacing:-.1px;color:rgba(255,255,255,.62)}
html[data-theme="black"] .onboard{background:linear-gradient(165deg,#1C1C20 0%,#161618 52%,#0F0F11 100%)}
html[data-theme="black"] .ob-lockup{filter:drop-shadow(0 16px 34px rgba(0,0,0,.66))}
html[data-theme="black"] .ob-form{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.12);
  box-shadow:0 20px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
html[data-theme="black"] .ob-field .input{background:#26262C;border-color:rgba(255,255,255,.14);color:#F3F4F6}
html[data-theme="black"] .ob-field .input::placeholder{color:#7E848C}
html[data-theme="black"] .ob-start{background:#34D399;color:#062B1C}
/* 화면이 낮은 기기(SE·가로 모드)에서는 로고와 여백을 줄여 한 화면에 들어오게 */
@media (max-height:700px){
  .ob-lockup{width:150px;margin-bottom:14px}
  .ob-wrap h2{font-size:20px}
  .ob-form{margin-top:16px;padding:13px 12px 12px}
  .ob-field .input{height:44px}
  .ob-start{height:46px;margin-top:12px}
  .ob-foot{margin-top:12px}
}
/* 브랜드 · 체험판 안내 (설정 탭 맨 아래) */
.brandfoot{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:28px 0 6px}
.brandfoot img{display:block;width:104px;height:auto}
.brandfoot .lk-lightword{display:block}
.brandfoot .lk-darkword{display:none}
html[data-theme="black"] .brandfoot .lk-lightword{display:none}
html[data-theme="black"] .brandfoot .lk-darkword{display:block}
.brandfoot .bf-tag{margin-bottom:4px;padding:2px 7px;border-radius:999px;background:var(--gray-soft);
  font-size:10px;font-weight:800;letter-spacing:.3px;color:var(--muted)}
html[data-theme="black"] .brandfoot .bf-tag{background:#26262C;color:#8B9099}
/* ---------- 화면 테마 선택 (설정 탭) ---------- */
.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themecard{position:relative;display:block;width:100%;padding:9px 9px 10px;border-radius:16px;background:var(--card);
  border:1.5px solid var(--line);text-align:left;transition:border-color .16s ease,box-shadow .16s ease,transform .12s ease}
.themecard:active{transform:scale(.985)}
.themecard.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,123,74,.10)}
.tprev{position:relative;display:block;height:88px;border-radius:11px;overflow:hidden}
.tprev.green{background:#F2F2F7;box-shadow:inset 0 0 0 1px #E3E6EB}
.tprev.black{background:#131316;box-shadow:inset 0 0 0 1px #2C2C33}
.tprev i{position:absolute;display:block}
.tprev .tp-h{left:9px;top:11px;width:34%;height:5px;border-radius:3px;background:#0B0F14}
.tprev .tp-c{left:9px;right:9px;top:23px;height:26px;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.tprev .tp-c2{left:9px;right:9px;top:53px;height:20px;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.tprev .tp-p{left:16px;top:31px;width:28px;height:8px;border-radius:4px;background:#0F7B4A}
.tprev.black .tp-h{background:#F3F4F6}
.tprev.black .tp-c,.tprev.black .tp-c2{background:#232328;box-shadow:none}
.tprev.black .tp-p{background:#46D69C}
.tlabel{display:block;margin-top:8px;font-size:12.5px;font-weight:800;letter-spacing:-.25px;line-height:1.25}
.tnote{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.tcheck{position:absolute;right:14px;top:15px;width:20px;height:20px;border-radius:50%;background:var(--green-solid);color:#fff;
  display:none;align-items:center;justify-content:center;font-size:11px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.themecard.on .tcheck{display:flex}

/* =========================================================
   🖤 시크 블랙 — 무광 차콜 다크 테마 (html[data-theme="black"])
   그린 화이트(:root 기본값)는 손대지 않고 여기서만 색을 바꿉니다.
   ========================================================= */
html[data-theme="black"]{
  --page:#08090A; --bg:#131316; --card:#1B1B1F; --field:#232328;
  --surf2:#202024; --surf3:#1B1B20; --tabbar:rgba(22,22,26,.94);
  --ink:#F3F4F6; --ink2:#C6C9D0; --muted:#8B9099;
  --line:#2F2F36; --line2:#26262C;

/* ---------- 날짜 / 숫자 유틸 ---------- */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseISO(s){ var p = String(s).split('-'); return new Date(+p[0], (+p[1]) - 1, +p[2]); }
function addDays(s, n){ var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function addMonths(s, n){
  var d = parseISO(s), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return iso(d);
}
function todayISO(){ return iso(new Date()); }
function dowOf(s){ return parseISO(s).getDay(); }
function minOf(t){ var p = String(t || '00:00').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m % 60); }
/* ---------- 레슨 시간 범위 (설정 탭에서 변경 · 기본 06:00~23:00) ---------- */
function dayRange(){
  var r = state.hours || {};
  var from = +r.fromMin, to = +r.toMin;
  if (!(from > 0)) from = DEF_FROM;
  if (!(to > 0)) to = DEF_TO;
  if (from < FROM_MIN) from = FROM_MIN;
  if (from > FROM_MAX) from = FROM_MAX;
  if (to < TO_MIN) to = TO_MIN;
  if (to > TO_MAX) to = TO_MAX;
  if (to < from + 60) to = Math.min(TO_MAX, from + 60);   /* 마감이 시작보다 앞서지 않게 */
  return { from: from, to: to };
}
function dayFromMin(){ return dayRange().from; }
function dayToMin(){ return dayRange().to; }
function hourLabel(m){ return m >= 1440 ? '24:00' : hhmm(m); }
function dayRangeLabel(){ var r = dayRange(); return hourLabel(r.from) + '~' + hourLabel(r.to); }
/* 시작 시간 칩 목록 — 설정한 범위 안에서 30분 단위 (24:00 은 시작 시간으로 쓰지 않음) */
function daySlots(){
  var r = dayRange(), out = [];
  for (var m = r.from; m <= r.to; m += 30) { if (m >= 1440) break; out.push(hhmm(m)); }
  return out;
}
function fromSlotOptions(){
  var out = [];
  for (var m = FROM_MIN; m <= FROM_MAX; m += 30) out.push({ v:String(m), label:hourLabel(m) });
  return out;
}
function toSlotOptions(){
  var out = [];
  for (var m = TO_MIN; m <= TO_MAX; m += 30) out.push({ v:String(m), label:hourLabel(m) });
  return out;
}
function nowMin(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function nowLocalISO(){
  var d = new Date();
  return iso(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function fmtLong(s){ var d = parseISO(s); return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')'; }
function fmtShort(s){ var d = parseISO(s); return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')'; }
function fmtDot(s){ var d = parseISO(s); return (d.getMonth()+1) + '.' + d.getDate(); }
function fmtNum(s){ var d = parseISO(s); return String(d.getFullYear()).slice(2) + '.' + (d.getMonth()+1) + '.' + d.getDate(); }
/* 회원 정보 · 수강권 · 차트처럼 한 화면 안에서 날짜를 비교하는 곳은 YYYY.MM.DD 로 통일 */
function fmtYMD(s){ var d = parseISO(s); return d.getFullYear() + '.' + pad(d.getMonth()+1) + '.' + pad(d.getDate()); }
function fmtYMDDow(s){ return fmtYMD(s) + ' (' + WEEK[parseISO(s).getDay()] + ')'; }
function monthLabel(ym){ var p = String(ym).split('-'); return p[0] + '년 ' + (+p[1]) + '월'; }
function hms(m){ if (!m) return '0분'; var h = Math.floor(m/60), r = m % 60; return (h ? h + '시간 ' : '') + (r ? r + '분' : (h ? '' : '0분')); }
function money(n){ if (n === '' || n === null || n === undefined) return '-'; return Number(n).toLocaleString('ko-KR') + '원'; }
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(p){ return (p || 'id') + '_' + Math.random().toString(36).slice(2, 9); }
function durName(d){ return d + '분'; }
function sum(arr, f){ var s = 0; for (var i = 0; i < arr.length; i++) s += f(arr[i]); return s; }

/* =========================================================
   필드 · 숏게임 (별도 결제) 레슨
   - 수강권(remainingSessions)을 절대 건드리지 않는다

   ========================================================= */
function isSep(s){
  if (!s) return false;
  return s.separatePay === true || s.lessonKind === 'field' || s.lessonKind === 'shortgame' || s.lessonKind === 'onepoint';
}
function normSepKind(k){ return SEP_KINDS[k] ? k : 'field'; }
function sepKind(s){ return normSepKind(s && s.lessonKind); }
function sepKindName(kind){ return SEP_KINDS[normSepKind(kind)].label; }
function sepKindShort(kind){ return SEP_KINDS[normSepKind(kind)].short; }
function sepKindLabel(s){ return sepKindName(sepKind(s)); }
function sepBadge(s){ return SEP_KINDS[sepKind(s)].badge; }
function sepIcon(s){ return SEP_KINDS[sepKind(s)].icon; }
function sepFee(s){ var v = parseInt(String(s && s.fee === undefined ? '' : s.fee), 10); return v > 0 ? v : 0; }
function feeNum(v){ v = String(v === undefined || v === null ? '' : v).replace(/[^0-9]/g, ''); return v ? parseInt(v, 10) : 0; }
function feeHintHTML(v){
  var n = feeNum(v);
  if (!n) return '비워 두면 일정만 남고, 수입에는 잡히지 않아요.';
  return '<b>' + money(n) + '</b> · 별도 결제 수입에 잡혀요';
}
/* 레슨의 사람 이름 (비회원 포함) */
function sessionName(s){
  if (!s) return '-';
  if (s.memberId) return memberName(s.memberId);
  return s.guestName || '비회원';
}
function statusKeysFor(s){ return isSep(s) ? SEP_STATUS_KEYS : STATUS_KEYS; }
function sepFeeLine(s){ return sepFee(s) ? money(sepFee(s)) : '금액 미입력'; }

/* =========================================================
   별도 결제 방문 회원 보존
   - 필드 · 숏게임 · 원포인트로만 온 사람도 회원목록에 남긴다
     (수강권은 만들지 않으므로 잔여 횟수는 0 · '수강권 없음')
   - 나중에 그 사람이 수강권을 끊으면 회원목록에서 바로 [+ 수강권 추가]
   - 팀 · 단체 이름은 한 번짜리 묶음이라 회원으로 만들지 않는다
   ========================================================= */
function isTeamName(name){
  return /(팀|단체|모임|그룹)$/.test(String(name || '').replace(/\s+/g, ''));
}
/* 회원 한 명의 별도 레슨 이용 기록 (일반취소는 빠짐) */
function sepUsage(memberId){
  var n = 0, fee = 0, last = '', kinds = {};
  if (!memberId) return { count: 0, fee: 0, last: '', kinds: kinds };
  state.sessions.forEach(function(s){
    if (!isSep(s) || s.memberId !== memberId) return;
    if (s.status === 'excused_cancel') return;
    var k = sepKind(s);
    n++; fee += sepFee(s); kinds[k] = (kinds[k] || 0) + 1;
    if (!last || s.date > last) last = s.date;
  });
  return { count: n, fee: fee, last: last, kinds: kinds };
}
function sepUsageMembers(memberId){
  return state.sessions.filter(function(s){
    return isSep(s) && s.memberId === memberId && s.status !== 'excused_cancel';
  }).sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return minOf(b.startTime) - minOf(a.startTime);
  });
}
/* 이름만 적어 온 비회원 → 회원목록에 남기고 그 회원으로 연결 */
function ensureMemberForGuest(name){
  var nm = String(name || '').trim().replace(/\s+/g, ' ');
  if (!nm || isTeamName(nm)) return null;
  var m = findMemberByName(nm);
  if (m) return m;
  m = { id: uid('mem'), name: nm, gender:'', region:'', phone:'', level:'', memo:'',
        since: todayISO(), fromSeparate: true };
  state.members.push(m);
  return m;
}

/* =========================================================
   외부 캘린더 연동 (아이폰 캘린더 .ics · 구글 캘린더 템플릿 링크)
   ========================================================= */
var CAL_TARGETS = [['both','둘 다'],['apple','아이폰 캘린더'],['google','구글 캘린더']];
var calPendingSid = null;   /* 팝업이 막혔을 때 토스트 [열기]로 다시 여는 레슨 */

function calSync(){
  if (!state.calendarSync || typeof state.calendarSync !== 'object') state.calendarSync = {};
  var cs = state.calendarSync;
  cs.enabled = (cs.enabled === true);
  var ok = false;
  for (var i = 0; i < CAL_TARGETS.length; i++) if (CAL_TARGETS[i][0] === cs.target) ok = true;
  if (!ok) cs.target = 'both';
  return cs;
}
function calTargetLabel(v){
  for (var i = 0; i < CAL_TARGETS.length; i++) if (CAL_TARGETS[i][0] === v) return CAL_TARGETS[i][1];
  return '둘 다';
}

/* 레슨 하나 → 캘린더 내용 */
function calSummary(s){
  var who = sessionName(s) + (s.memberId ? '' : ' (비회원)');
  if (isSep(s)) return '[골프 레슨] ' + sepKindLabel(s) + ' · ' + who + ' · ' + s.durationMinutes + '분';
  return '[골프 레슨] ' + who + ' · ' + s.durationMinutes + '분';
}
function calDescLines(s){
  var sep = isSep(s);
  var m = s.memberId ? memberById(s.memberId) : null, pkg = sep ? null : pkgById(s.packageId), out = [];
  if (sep) {
    out.push('대상: ' + sessionName(s) + (s.memberId ? '' : ' (비회원)'));
    out.push('레슨: ' + sepKindLabel(s) + ' ' + s.durationMinutes + '분');
    out.push('별도 결제: ' + (sepFee(s) ? money(sepFee(s)) : '금액 미입력') + ' · 수강권 차감 없음');
  } else {
    var rem = '';
    if (pkg) rem = ' · 잔여 ' + pkg.remainingSessions + '/' + pkg.totalSessions + '회';
    else { var tr = totalRemaining(s.memberId); if (tr) rem = ' · 잔여 ' + tr + '회'; }
    out.push('회원: ' + (m ? m.name : '회원') + rem);
    out.push('레슨: ' + s.durationMinutes + '분');
  }
  if (s.location) out.push('장소: ' + s.location);
  if (s.memo) out.push('메모: ' + s.memo);
  out.push('레슨 관리 앱에서 추가');
  return out;
}
function calDescText(s){ return calDescLines(s).join('\n'); }

/* KST 벽시걸 → 20261124T150000 (기기 시간대와 무관하게 계산) */
function calStamp(date, time, addMin){
  var y = +String(date).slice(0,4), mo = +String(date).slice(5,7), d = +String(date).slice(8,10);
  var p = String(time || '00:00').split(':');
  var t = (+p[0]) * 60 + (+p[1] || 0) + (addMin || 0);
  var base = new Date(Date.UTC(y, mo - 1, d));
  base.setUTCDate(base.getUTCDate() + Math.floor(t / 1440));
  var m = ((t % 1440) + 1440) % 1440;
  return base.getUTCFullYear() + pad(base.getUTCMonth() + 1) + pad(base.getUTCDate()) +
    'T' + pad(Math.floor(m / 60)) + pad(m % 60) + '00';
}
function calUtcNow(){
  var d = new Date();
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
    pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
}

/* RFC 5545 문자 이스케이프 · 75옥텟 줄바꿈 */
function icsEsc(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
    .replace(/\r\n|\r|\n/g, '\\n');
}
function utf8Len(ch){
  var c = ch.charCodeAt(0);
  if (c < 0x80) return 1;
  if (c < 0x800) return 2;
  if (c < 0x10000) return 3;
  return 4;
}
function icsFold(line){
  var out = '', cur = '', n = 0;
  for (var i = 0; i < line.length; i++){
    var ch = line.charAt(i), len = utf8Len(ch);
    if (n + len > 73) { out += cur + '\r\n '; cur = ''; n = 1; }   /* 접힘 줄은 앞 공백 1옥텟 포함 */
    cur += ch; n += len;
  }
  return out + cur;
}
function icsUid(s){ return String(s.id) + '@golf-lesson-app'; }

function icsText(s){
  var L = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Golf Lesson App//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VTIMEZONE','TZID:Asia/Seoul',
    'BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0900','TZOFFSETTO:+0900','TZNAME:KST','END:STANDARD',
    'END:VTIMEZONE',
    'BEGIN:VEVENT','UID:' + icsEsc(icsUid(s)),'DTSTAMP:' + calUtcNow(),
    'DTSTART;TZID=Asia/Seoul:' + calStamp(s.date, s.startTime, 0),
    'DTEND;TZID=Asia/Seoul:' + calStamp(s.date, s.startTime, s.durationMinutes),
    'SUMMARY:' + icsEsc(calSummary(s))
  ];
  if (s.location) L.push('LOCATION:' + icsEsc(s.location));
  L.push('DESCRIPTION:' + icsEsc(calDescText(s)));
  L.push('SEQUENCE:0','STATUS:CONFIRMED','TRANSP:OPAQUE','END:VEVENT','END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function icsFileName(s){ return 'golf-lesson-' + String(s.date).replace(/-/g, '') + '-' + String(s.startTime).replace(':', '') + '.ics'; }

function addToAppleCalendar(s){
  try {
    var blob = new Blob([icsText(s)], { type:'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = icsFileName(s); a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ try { URL.revokeObjectURL(url); } catch(e){} }, 30000);
    return true;
  } catch(e){ return false; }
}

function gcalUrl(s){
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent(calSummary(s)) +
    '&dates=' + calStamp(s.date, s.startTime, 0) + '/' + calStamp(s.date, s.startTime, s.durationMinutes) +
    '&ctz=Asia/Seoul' +
    (s.location ? '&location=' + encodeURIComponent(s.location) : '') +
    '&details=' + encodeURIComponent(calDescText(s));
}
function addToGoogleCalendar(s){
  var u = gcalUrl(s), w = null;
  try { w = window.open(u, '_blank'); } catch(e){ w = null; }
  if (!w) { try { w = window.open(u); } catch(e2){ w = null; } }
  return !!w;
}

function paintCalSetting(){
  var cs = calSync();
  var sw = document.getElementById('calSwitch');
  if (sw) { sw.classList.toggle('on', cs.enabled); sw.setAttribute('aria-checked', cs.enabled ? 'true' : 'false'); }
  var seg = document.getElementById('calTargets');
  if (seg) {
    seg.classList.toggle('dim', !cs.enabled);
    for (var i = 0; i < seg.children.length; i++) {
      var b = seg.children[i];
      b.classList.toggle('on', b.getAttribute('data-v') === cs.target);
      if (cs.enabled) b.removeAttribute('disabled');
      else b.setAttribute('disabled', 'disabled');
      b.setAttribute('aria-disabled', cs.enabled ? 'false' : 'true');
    }
  }
  var lbl = document.getElementById('calTargetsLbl');
  if (lbl) lbl.textContent = calTargetsLabel(cs);
  var txt = document.getElementById('calStateTxt');
  if (txt) txt.textContent = cs.enabled ? ('켜짐 · ' + calTargetLabel(cs.target) + '에 넣어요') : '꺼짐 · 레슨만 앱에 저장돼요';
  var stat = document.getElementById('calStat');
  if (stat) {
    stat.classList.toggle('on', cs.enabled);
    stat.classList.toggle('saved', calSaved);
    stat.innerHTML = calStatHTML(cs);
  }
}

/* 레슨을 저장한 직후: 설정에 맞춰 캘린더로 보낸다 */
function calendarAfterAdd(s){
  var cs = calSync();
  if (!cs.enabled || !s) return;
  if (cs.target === 'apple') {
    toast(addToAppleCalendar(s) ? '.ics 파일을 만들었어요 · 열어서 "캘린더에 추가"를 누르면 끝'
      : '캘린더 파일을 만들지 못했어요 · 레슨 상태에서 다시 시도해 주세요', { ms: 3600 });
  } else if (cs.target === 'google') {
    if (!addToGoogleCalendar(s)) {
      calPendingSid = s.id;
      toast('팝업이 막혔어요 · 구글 캘린더로 열기', { act:'cal-google-retry', label:'열기', ms: 8000 });
    }
  } else {
    openCalSheet(s.id, true);
  }
}

/* ---------- 상태 ---------- */
var state = null;
var ui = { tab:'today', date: todayISO(), memberId: null, search:'', month: todayISO().slice(0,7),
  stats:'lesson', revUnit:'month', revOpen:'' };

/* ---------- 화면 테마 (그린 화이트 · 시크 블랙) ---------- */
var THEMES = {
  /* meta = 상태 바/브라우저 상단 색. 상단 바 바탕(--bg)과 같은 값으로 맞춰 이음매가 보이지 않게 합니다 */
  green: { label:'🌿 그린 화이트', note:'밝은 시그니처', meta:'#F2F2F7' },
  black: { label:'🖤 시크 블랙',   note:'무광 차콜',   meta:'#131316' }
};
function themeOf(){ return (state && state.theme === 'black') ? 'black' : 'green'; }
/* <html data-theme> · 브라우저 상단 색 · 빠른 부팅용 짧은 키를 한 번에 맞춥니다 */
function applyTheme(t){
  t = (t === 'black') ? 'black' : 'green';
  document.documentElement.setAttribute('data-theme', t);
  var mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', THEMES[t].meta);
  /* 홈 화면 앱의 상태 바 글자색도 테마를 따라갑니다 (아이폰은 다음 실행 때 반영) */
  var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (sb) sb.setAttribute('content', t === 'black' ? 'black' : 'default');
  try { localStorage.setItem('golfLessonApp.theme', t); } catch(e){}
  return t;
}
function themeCardHTML(k){
  var on = themeOf() === k;
  return '<button class="themecard' + (on ? ' on' : '') + '" data-act="theme" data-v="' + k + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
    '<span class="tprev ' + k + '" aria-hidden="true"><i class="tp-h"></i><i class="tp-c"></i><i class="tp-c2"></i><i class="tp-p"></i></span>' +
    '<span class="tlabel">' + THEMES[k].label + '</span>' +
    '<span class="tnote">' + THEMES[k].note + '</span>' +
    '<span class="tcheck" aria-hidden="true">✓</span></button>';
}
function setTheme(t){
  t = (t === 'black') ? 'black' : 'green';
  if (themeOf() === t){ applyTheme(t); return; }
  state.theme = t;
  save();
  applyTheme(t);
  render(true);
  toast(t === 'black' ? '🖤 시크 블랙 테마로 바뀌었어요' : '🌿 그린 화이트 테마로 바뀌었어요');
}

function save(){
  if (obWaiting) return;            /* 온보딩에서 시작 방식을 고르기 전에는 저장하지 않음 */
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}
/* 저장본이 있는지 — 있으면 온보딩을 띄우지 않습니다 (기존 사용자 데이터 보호) */
function hasSavedState(){
  try { return !!localStorage.getItem(KEY); } catch(e){ return false; }
}
function load(){
  var fresh = false;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.members && s.packages && s.sessions) state = s;
    }
  } catch(e){}
  if (!state) { state = buildDemo(); fresh = true; }
  /* 일반취소는 일정에 남기지 않는다 — 예전 데이터에 남아 있던 일반취소 레슨은 한 번만 정리 */
  if (!state.migExcused) {
    var keep = state.sessions.filter(function(x){ return x.status !== 'excused_cancel'; });
    if (keep.length !== state.sessions.length) state.sessions = keep;
    state.migExcused = 1;
    fresh = true;
  }
  if (fresh) save();
}

/* ---------- 조회 ---------- */
function memberById(id){ for (var i=0;i<state.members.length;i++) if (state.members[i].id === id) return state.members[i]; return null; }
function pkgById(id){ for (var i=0;i<state.packages.length;i++) if (state.packages[i].id === id) return state.packages[i]; return null; }
function memberName(id){ var m = memberById(id); return m ? m.name : '(삭제된 회원)'; }
function memberPkgs(id){ return state.packages.filter(function(p){ return p.memberId === id; }); }
function activePkgs(id){ return memberPkgs(id).filter(function(p){ return p.remainingSessions > 0; }); }
function totalRemaining(id){ return sum(activePkgs(id), function(p){ return p.remainingSessions; }); }
function sessionsByDate(d){
  return state.sessions.filter(function(s){ return s.date === d; })
    .sort(function(a,b){ return minOf(a.startTime) - minOf(b.startTime); });
}
function sessionsByMember(id){
  return state.sessions.filter(function(s){ return s.memberId === id; })
    .sort(function(a,b){ if (a.date === b.date) return minOf(b.startTime) - minOf(a.startTime); return a.date < b.date ? 1 : -1; });
}
function settlementFor(d){ for (var i=0;i<state.settlements.length;i++) if (state.settlements[i].date === d) return state.settlements[i]; return null; }
function sessionEnd(s){ return minOf(s.startTime) + s.durationMinutes; }

/* 상태 변경 = 차감 반영의 유일한 통로 (정산·빠른 버튼·수정 모두 여기로) */
function applyStatus(s, status){
  var meta = STATUS[status];
  if (!meta) return false;
  /* 필드 · 숏게임 = 수강권을 건드리지 않고, 별도 결제 수입만 정산한다 */
  if (isSep(s)) {
    s.status = status;
    s.deducted = false;                 /* 수강권 차감 없음 */
    s.charged = !!CHARGED[status];      /* 별도 수입에 잡히는지 */
    return true;
  }
  var was = !!s.deducted, next = !!meta.deducted;
  var pkg = pkgById(s.packageId);
  if (pkg && was !== next) {
    if (next) pkg.remainingSessions = Math.max(0, pkg.remainingSessions - 1);
    else pkg.remainingSessions = Math.min(pkg.totalSessions, pkg.remainingSessions + 1);
  }
  s.status = status;
  s.deducted = next;
  return true;
}

/* 일반취소 = 차감 되돌림 + 일정에서 제거 (오늘·캘린더에서 바로 사라지고 그 시간이 비워짐) */
function cancelExcused(s){
  if (!s) return null;
  var pkg = pkgById(s.packageId);
  var snap = JSON.parse(JSON.stringify(s));       /* 되돌리기용 원본 */
  var remBefore = pkg ? pkg.remainingSessions : null;
  var wasDeducted = !!s.deducted;
  var mname = sessionName(s);
  applyStatus(s, 'excused_cancel');               /* 차감됐던 회차는 여기서 +1 복구 */
  var removed = false;
  for (var i = state.sessions.length - 1; i >= 0; i--) {
    if (state.sessions[i].id === s.id) { state.sessions.splice(i, 1); removed = true; break; }
  }
  /* 통계용 기록만 남긴다(일정·차감에는 영향 없음) */
  if (!state.cancelLog) state.cancelLog = [];
  var log = { date: snap.date, memberId: snap.memberId, at: nowLocalISO() };
  state.cancelLog.push(log);
  return { snap: snap, wasDeducted: wasDeducted, removed: removed, memberName: mname,
           remaining: pkg ? pkg.remainingSessions : null, remBefore: remBefore, log: log };
}

/* 직전 일반취소 한 건 되돌리기 (토스트의 '되돌리기') */
function undoCancelExcused(ctx){
  if (!ctx || !ctx.snap) return false;
  var back = ctx.snap;
  if (findSession(back.id)) return false;         /* 이미 되살아났으면 중복 방지 */
  state.sessions.push(back);
  var pkg = pkgById(back.packageId);
  if (pkg && ctx.remBefore !== null && ctx.remBefore !== undefined) pkg.remainingSessions = ctx.remBefore;
  if (state.cancelLog && ctx.log) {
    for (var i = state.cancelLog.length - 1; i >= 0; i--) {
      if (state.cancelLog[i] === ctx.log) { state.cancelLog.splice(i, 1); break; }
    }
  }
  return true;
}

function finishOnboarding(useDemo){
  var pEl = document.getElementById('ozPro'), aEl = document.getElementById('ozAcademy');
  var name = pEl ? String(pEl.value || '').trim() : '';
  var academy = aEl ? String(aEl.value || '').trim() : '';
